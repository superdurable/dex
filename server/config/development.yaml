log:
  stdout: true
  level: info
  levelKey: "level"
api:
  port: 8801
  queryWorkflowFailedRetryPolicy:
    initialIntervalSeconds: 1
    maximumAttempts: 5
  invokeRPCContinuedAsNewErrorRetryPolicy:
    initialIntervalSeconds: 1
    maximumAttempts: 5
interpreter:
  temporal:
    hostPort: localhost:7233
    namespace: default
    prometheus:
      listenAddress: 0.0.0.0:8890
      timerType: histogram
  defaultWorkflowConfig:
    continueAsNewThreshold: 100
externalStorage:
  enabled: true
  thresholdInBytes: 100000 # 100 KB
  historyRetentionInDays: 3
  supportedStorages:
    - status: active
      storageId: "local-dev-s3"
      storageType: "s3"
      s3Endpoint: "http://localhost:9000"
      s3Bucket: "dex-test-bucket"
      s3Region: "us-east-1"
      s3AccessKey: "minioadmin"
      s3SecretKey: "minioadmin"
      cleanupStrategy:
        cleanupStrategyType: afterAllRunsDeleted
        cleanupFrequencyInDays: 1
    # Local filesystem alternative:
    # - status: active
    #   storageId: "local-dev"
    #   storageType: "local"
    #   localDirectory: "./dex-blobs"
