# please see all available config in https://github.com/superdurable/dex/blob/main/config/config.go
# You can use volume mount to override this config path(/dex/config/config_template.yaml), e.g. for production
api:
  port: 8801
  includeRPCInputOutputIntoHistory: false
  # Opt in only when Update validation and atomic commits justify Temporal's Update concurrency usage.
  useTemporalSynchronousUpdateForAllRPCs: false
  queryWorkflowFailedRetryPolicy:
    initialInterval: 100ms
    backoffCoefficient: 1
    maximumInterval: 100ms
    maximumAttempts: 5
  invokeRPCContinuedAsNewErrorRetryPolicy:
    initialInterval: 100ms
    backoffCoefficient: 2
    maximumInterval: 1s
    totalDuration: 5s
worker:
  # Refresh individual endpoints behind headless WorkerService DNS.
  headlessAddressRefreshInterval: 60s
  # Bound remembered flow-to-endpoint routes.
  maxStickyRoutingEntries: 100000
  # Includes the first headless transport attempt within one activity attempt.
  workerServiceRequestMaxAttempts: 3
  # gRPC status codes that trigger failover between resolved headless endpoints.
  headlessFailoverStatusCodes: [14, 4, 2]
interpreter:
  # Bounds backend index creation and propagation checks. Existing indexes return immediately.
  attributeIndexSyncTimeout: 2m
  defaultWorkflowConfig:
    continueAsNewThreshold: 100
  temporal:
    hostPort: "temporal:7233"
    namespace: "default"
    cloudAPIKey: ""
blobStore:
  enabled: true
  thresholdInBytes: 1024
  historyRetentionInDays: 3
  supportedStorages:
    - status: active
      storageId: "local"
      storageType: "local"
      localDirectory: "/dex/dex-blobs"
# Streams remain disabled until redisURL is configured.
