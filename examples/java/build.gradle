plugins {
    id "java"
    id "org.springframework.boot" version "3.5.3"
    id "io.spring.dependency-management" version "1.1.7"
}

java {
    toolchain {
        // Examples track the newest Java release; -PjavaVersion overrides.
        languageVersion = JavaLanguageVersion.of(
                providers.gradleProperty("javaVersion").getOrElse("26"))
    }
}

// Spring's ASM cannot parse the newest class files yet; runtime stays newest.
tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

repositories {
    mavenCentral()
}

dependencies {
    implementation "org.springframework.boot:spring-boot-starter-web"
    implementation "io.superdurable:dex-sdk:1.45.2"

    implementation "com.fasterxml.jackson.datatype:jackson-datatype-jsr310"
    implementation "com.fasterxml.jackson.datatype:jackson-datatype-jdk8"
    implementation "com.fasterxml.jackson.core:jackson-databind"
    implementation "com.fasterxml.jackson.core:jackson-annotations"
    implementation "com.fasterxml.jackson.core:jackson-core"

    testImplementation "org.springframework.boot:spring-boot-starter-test"
    testImplementation "org.junit.jupiter:junit-jupiter"
}

// The customer refund command adds a second main class.
springBoot {
    mainClass = "io.superdurable.dex.SpringMainApplication"
}

// ./gradlew installCustomerRefund writes build/install/customer-refund/bin/customer-refund.
// It runs outside Gradle so that Ctrl+C reaches the Worker.
def customerRefundScripts = tasks.register("customerRefundScripts", CreateStartScripts) {
    applicationName = "customer-refund"
    mainClass = "io.superdurable.dex.products.customerrefund.CustomerRefundCommand"
    defaultJvmOpts = ["--enable-native-access=ALL-UNNAMED"]
    classpath = files(tasks.named("jar")) + configurations.runtimeClasspath
    outputDir = layout.buildDirectory.dir("customer-refund-scripts").get().asFile
}

tasks.register("installCustomerRefund", Sync) {
    into layout.buildDirectory.dir("install/customer-refund")
    from(customerRefundScripts) {
        into "bin"
    }
    from(tasks.named("jar")) {
        into "lib"
    }
    from(configurations.runtimeClasspath) {
        into "lib"
    }
}

tasks.named("test") {
    useJUnitPlatform()
    // Integ tests share one Worker via SharedIntegExtension.
    maxParallelForks = 1
}
