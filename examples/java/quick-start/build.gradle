plugins {
    id "application"
}

repositories {
    mavenCentral()
}

dependencies {
    implementation "io.superdurable:dex-sdk:1.44.0"

    testImplementation platform("org.junit:junit-bom:5.13.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

// Builds with the JDK that runs Gradle (17 or newer).
tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

// The SDK's disk cache loads a native library; this keeps newer JDKs from warning about it.
def quietJvmArgs = ["--enable-native-access=ALL-UNNAMED"]

// ./gradlew installDist writes two commands to build/install/quick-start/bin:
// worker runs the Worker until Ctrl+C, and start starts one OrderFlow.
// They run outside Gradle so that Ctrl+C reaches the Worker.
application {
    mainClass = "io.superdurable.dex.quickstart.WorkerMain"
    applicationDefaultJvmArgs = quietJvmArgs
}

tasks.named("startScripts", CreateStartScripts) {
    applicationName = "worker"
}

def startCommandScripts = tasks.register("startCommandScripts", CreateStartScripts) {
    applicationName = "start"
    mainClass = "io.superdurable.dex.quickstart.StartMain"
    defaultJvmOpts = quietJvmArgs
    classpath = tasks.named("startScripts", CreateStartScripts).get().classpath
    outputDir = layout.buildDirectory.dir("start-command-scripts").get().asFile
}

distributions.main.contents {
    from(startCommandScripts) {
        into "bin"
    }
}

tasks.named("test", Test) {
    useJUnitPlatform()
    jvmArgs quietJvmArgs
    testLogging {
        events "passed", "skipped", "failed"
        showStandardStreams = true
    }
}
