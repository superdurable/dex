services:
  entity-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: entity_store
      POSTGRES_USER: entity_store
      POSTGRES_PASSWORD: entity_store
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U entity_store -d entity_store"]
      interval: 2s
      timeout: 5s
      retries: 20
    ports:
      - "55432:5432"
    volumes:
      - "./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro"
