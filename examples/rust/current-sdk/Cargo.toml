[package]
name = "dex-examples-rust-current-sdk"
version = "0.0.0"
edition = "2024"
publish = false
rust-version = "1.97"

[lib]
name = "dex_examples_rust"
path = "../src/lib.rs"

[[test]]
name = "dex_integration"
path = "../tests/dex_integration.rs"

[[test]]
name = "flow_smoke"
path = "../tests/flow_smoke.rs"

[dependencies]
dex-sdk = { path = "../../../sdk-rust/crates/dex-sdk" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }

[dev-dependencies]
tempfile = "3.23"
reqwest = { version = "0.12", features = ["blocking", "json"] }

[lints.rust]
unsafe_code = "forbid"
