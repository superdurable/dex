<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dex examples playground</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="app-bar">
      <div>
        <h1>Dex examples playground</h1>
        <p>
          Call product, pattern, and primitive controller APIs. Point this page
          at any language example server. Deal DSL and AI Agent Email keep their own UIs.
        </p>
      </div>
      <form id="settings">
        <label>
          Example server
          <input id="example-server-url" type="url" spellcheck="false" />
        </label>
        <label>
          Dex Web
          <input id="dex-web-url" type="url" spellcheck="false" />
        </label>
        <button type="submit">Save URLs</button>
      </form>
    </header>
    <div class="layout">
      <nav id="nav"></nav>
      <main id="main"></main>
    </div>
    <script src="config.js"></script>
    <script src="catalog.js"></script>
    <script src="app.js"></script>
  </body>
</html>
