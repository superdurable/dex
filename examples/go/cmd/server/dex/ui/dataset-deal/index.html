<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dataset Deal DSL</title>
    <link rel="stylesheet" href="/dataset-deal/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/dataset-deal">
        <span class="brand-mark">D</span>
        <span>Dataset Deal <em>DSL</em></span>
      </a>
      <div class="role-switcher" aria-label="Act as">
        <span>Act as</span>
        <button class="role active" data-role="seller">Seller</button>
        <button class="role" data-role="buyer1">Buyer 1</button>
        <button class="role" data-role="buyer2">Buyer 2</button>
        <button class="role" data-role="buyer3">Buyer 3</button>
      </div>
    </header>
    <main id="app"><div class="loading">Loading Dataset Deal…</div></main>
    <div id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/dataset-deal/app.js"></script>
  </body>
</html>
