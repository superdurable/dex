services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dataset_deal
      POSTGRES_USER: dataset_deal
      POSTGRES_PASSWORD: dataset_deal
    ports:
      - "${DATASET_DEAL_POSTGRES_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dataset_deal -d dataset_deal"]
      interval: 1s
      timeout: 3s
      retries: 30
    volumes:
      - ../workflows/datasetdeal/schema.sql:/docker-entrypoint-initdb.d/001-dataset-deal.sql:ro
