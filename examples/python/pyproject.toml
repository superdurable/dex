[project]
name = "dex-examples-python"
version = "0.1.0"
description = "Dex Python Samples"
authors = [{name = "Quanzheng Long", email = "qlong@indeed.com"}]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "attrs>=22.2,<23",
    "dex-python-sdk==0.0.1",
    "flask>=2.3.3,<3",
    "openai>=1.66.2,<2",
    "openai-agents>=0.0.4,<0.0.5",
    "pydantic>=2.10.6,<3",
]

[dependency-groups]
dev = [
    "mypy>=1.5.1,<2",
    "pytest>=7.4.2,<8",
    "pytest-cov>=4.1,<5",
    "pytest-env>=1.0.1,<2",
]

[tool.uv]
package = false
required-version = "==0.12.2"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
