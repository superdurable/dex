[project]
name = "dex-examples-python"
version = "0.1.0"
description = "Dex Python Samples"
authors = [{name = "Super Durable"}]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dex-agents[connectors,litellm,mcp]==0.4.0",
    # Moves to PyPI (dex-connector-slack==0.2.0) once the release is published there.
    "dex-connector-slack @ https://github.com/superdurable/dex-connectors-library/releases/download/connectors%2Fslack%2Fpython%2Fv0.2.0/dex_connector_slack-0.2.0-py3-none-any.whl#sha256=df82651d748d69bdf906b71fc965098e408d40e86f28b3b27ff493240cfaf320",
    "dex-python-sdk==1.44.0",
    "flask>=3.0,<4",
    "mcp>=2.3,<3",
    "pydantic>=2.10.6,<3",
    "python-dotenv>=1.0,<2",
    "pyyaml>=6.0,<7",
    "quart>=0.20.0,<0.21",
]

[dependency-groups]
dev = [
    "mypy>=1.5.1,<2",
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.26,<2",
    "pytest-cov>=4.1,<5",
    "pytest-env>=1.0.1,<2",
]

[tool.uv]
package = false
# dex-agents 0.4.0 pins dex-python-sdk 1.38.0; the examples track the newest SDK release.
override-dependencies = ["dex-python-sdk==1.44.0"]
required-version = "==0.12.2"

[tool.pytest.ini_options]
pythonpath = [".", "sync-python"]
testpaths = ["tests", "sync-python/sync_tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integ: integration tests against a running Dex server",
]
