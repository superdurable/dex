[tool.poetry]
name = "dex-examples-python"
version = "0.1.0"
description = "Dex Python Samples"
authors = ["Quanzheng Long <qlong@indeed.com>"]
license = "Apache-2.0"
readme = "README.md"
packages = [
    { include = "basic" },
    { include = "moneytransfer" },
    { include = "signup" },
    { include = "resourcecontrol" },
]

[tool.poetry.dependencies]
python = "^3.9"
Flask = "^2.3.3"
dex-sdk = "^0.0.1"
attrs = "^22.2.0"
openai = "^1.66.2"
openai-agents = "^0.0.4"
pydantic = "^2.10.6"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.2"
mypy = "^1.5.1"
pytest-cov = "^4.1.0"
pytest-env = "^1.0.1"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
