[project]
name = "dex-examples-python-codec-server"
version = "0.1.0"
description = "A deployable Dex payload codec server for Dex Web and dexcli"
authors = [{name = "Super Durable"}]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dex-python-sdk[encryption]==1.45.16",
    "aiohttp>=3.14,<4",
]

[dependency-groups]
dev = [
    "mypy>=1.5.1,<2",
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.26,<2",
    "types-protobuf>=7.34.1.20260518",
]

[tool.uv]
package = false
required-version = "==0.12.2"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
strict = true
