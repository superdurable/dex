[project]
name = "dex-examples-python-agent-starter"
version = "0.1.0"
description = "A durable OpenAI Agents SDK agent in one file"
authors = [{name = "Super Durable"}]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dex-agents-openai-agents==0.5.0",
    "dex-python-sdk==1.45.0",
]

[dependency-groups]
dev = [
    "mypy>=1.5.1,<2",
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.26,<2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
strict = true
