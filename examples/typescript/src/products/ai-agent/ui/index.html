<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dex AI Agent</title>
    <link rel="icon" href="data:," />
    <style>
      body { font-family: system-ui, sans-serif; margin: 0 auto; max-width: 52rem; padding: 1rem 1rem 9rem; }
      header { display: flex; gap: 0.75rem; align-items: center; margin-bottom: 1rem; }
      section { margin: 0.5rem 0; padding: 0.5rem 0.75rem; border-radius: 0.5rem; }
      section.user { background: #e8f0fe; }
      section.assistant { background: #f4f4f4; }
      section.panel { border: 1px solid #ccc; }
      .tool { font-size: 0.9rem; margin: 0.25rem 0; }
      .reasoning { color: #666; font-style: italic; }
      .error { color: #b00020; }
      footer { position: fixed; bottom: 0; left: 0; right: 0; display: flex; gap: 0.5rem; padding: 0.75rem;
        background: #fff; border-top: 1px solid #ddd; justify-content: center; align-items: center; }
      textarea { width: 30rem; max-width: 60vw; height: 3rem; }
      button { margin-left: 0.25rem; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./chat-app.js"></script>
  </body>
</html>
