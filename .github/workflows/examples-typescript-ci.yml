name: TypeScript examples CI

on:
  push:
    branches: [main]
    paths:
      - "examples/typescript/**"
      - "examples/entity-store/**"
      - ".github/workflows/examples-typescript-ci.yml"
  pull_request:
    paths:
      - "examples/typescript/**"
      - "examples/entity-store/**"
      - ".github/workflows/examples-typescript-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: examples-typescript-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Published SDK, typecheck, and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: examples/typescript
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/typescript/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Verify published SDK dependency
        run: |
          set -euo pipefail
          declared_version="$(node -p "require('./package.json').dependencies['@superdurable/dex']")"
          resolved_version="$(npm ls --json --depth=0 @superdurable/dex | jq -r '.dependencies["@superdurable/dex"].version')"
          resolved_source="$(node -p "require('./package-lock.json').packages['node_modules/@superdurable/dex'].resolved")"
          if [[ -z "$declared_version" || "$declared_version" == "undefined" ]]; then
            echo "examples/typescript must depend on @superdurable/dex"
            exit 1
          fi
          if [[ "$resolved_version" != "$declared_version" ]]; then
            echo "examples/typescript resolves @superdurable/dex $resolved_version, expected $declared_version"
            exit 1
          fi
          expected_source="https://registry.npmjs.org/@superdurable/dex/-/dex-${declared_version}.tgz"
          if [[ "$resolved_source" != "$expected_source" ]]; then
            echo "examples/typescript must use published @superdurable/dex, not $resolved_source"
            exit 1
          fi
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test

  integ:
    name: Integration tests with dexcli dev (zd, pull)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      DEX_INTEG_ENGINE: zd
      DEX_SERVER_ZD_BINARY: ${{ github.workspace }}/server-zd/target/debug/dex-server-zd
      # These CARGO_* and RUST* values match Server ZD CI, so its main cache restores here.
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      RUST_BACKTRACE: "1"
      RUSTUP_TOOLCHAIN: "1.97.1"
      CARGO_BUILD_JOBS: "4"
    defaults:
      run:
        working-directory: examples/typescript
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Install libclang for RocksDB
        run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server-zd
          shared-key: server-zd-paradedb
          # Restore-only: the Server ZD CI ParadeDB job owns this key.
          save-if: false
      - name: Build dex-server-zd
        working-directory: server-zd
        run: cargo build --locked -p dexzd-server --bin dex-server-zd
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            examples/typescript/package-lock.json
            web/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: |
            cli/go.sum
            server/go.sum
            web/go.sum
      - name: Install dependencies
        run: npm ci
      - name: Integration tests with dexcli dev
        run: ./run-integration-tests.sh
      - name: Upload service logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: typescript-examples-integration-services-zd
          path: /tmp/test-typescript-examples-integration-services.log
          if-no-files-found: ignore
