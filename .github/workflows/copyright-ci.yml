name: Copyright

on:
  pull_request:
    paths:
      - "agents/**"
      - "cli/**"
      - "sdk-go/**"
      - "blob-cache-go/**"
      - "sdk-java/**"
      - "sdk-python/**"
      - "sdk-rust/**"
      - "s3local/**"
      - "server-zd/**"
      - "web/**"
      - "examples/go/**"
      - "examples/java/**"
      - "examples/python/**"
      - "protos/**"
      - "script/licenseheaders/**"
      - "script/release/**"
      - "LICENSE"
      - "LEGACY_NOTICES.md"
      - "LICENSING.md"
      - "CLA.md"
      - "CLA-INDIVIDUAL.md"
      - "CLA-CORPORATE.md"
      - "Makefile"
      - ".github/workflows/copyright-ci.yml"
  workflow_dispatch:
  # Main CI (all) and release workflows call this suite on main and release commits.
  workflow_call:

# Only pull request runs share a group, so superseded PR commits cancel; main and release runs never do.
concurrency:
  group: copyright-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  copyright-check:
    name: License headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: script/licenseheaders/copyright/go.mod
          cache: false
      - name: Test license header tool
        run: make copyright-test
      - name: Verify license headers
        run: make copyright-check
