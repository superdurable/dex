name: Push Docker images (release)

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      version:
        description: Docker image semantic version without the v prefix
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Docker image tag (e.g. v1.0.0)"
        required: true
        type: string

jobs:
  docker:
    runs-on: ubuntu-latest
    # Monorepo: only publish on server-v* release tags, or manual dispatch.
    if: >
      inputs.version != '' ||
      startsWith(github.event.release.tag_name, 'server-v')
    steps:
      - uses: actions/checkout@v7
      - name: Resolve image tag
        id: meta
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ -n "${RELEASE_TAG}" ]]; then
            image_tag="${RELEASE_TAG#server-}"
          else
            image_tag="v${INPUT_VERSION#v}"
          fi
          if [[ ! "${image_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z]+)*$ ]]; then
            echo "Invalid Docker image version: ${image_tag}" >&2
            exit 1
          fi
          echo "tag=${image_tag}" >> "${GITHUB_OUTPUT}"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./server
          push: true
          platforms: linux/arm64,linux/amd64
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/dex-server:${{ steps.meta.outputs.tag }}
