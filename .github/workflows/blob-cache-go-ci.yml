name: Blob Cache Go CI

on:
  pull_request:
    paths:
      - "blob-cache-go/**"
      - ".github/workflows/blob-cache-go-ci.yml"
  workflow_dispatch:
  # Main CI (all) and release workflows call this suite on main and release commits.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: blob-cache-go-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  blob-cache:
    name: Blob cache tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blob-cache-go
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: blob-cache-go/go.mod
          cache-dependency-path: blob-cache-go/go.sum
      - name: Blob cache tests
        run: make blobCacheTests
