name: Go examples CI

on:
  push:
    branches: [main]
    paths:
      - "examples/go/**"
      - "examples/entity-store/**"
      - ".github/workflows/examples-go-ci.yml"
  pull_request:
    paths:
      - "examples/go/**"
      - "examples/entity-store/**"
      - ".github/workflows/examples-go-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: examples-go-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: SDK build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/go
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: examples/go/go.mod
          cache-dependency-path: examples/go/go.sum
      - name: Verify released module dependencies
        env:
          GOWORK: "off"
        run: |
          set -euo pipefail
          for module in \
            github.com/superdurable/dex/sdk-go \
            github.com/superdurable/dex/blob-cache-go \
            github.com/superdurable/dex-connectors-library/sdkgo \
            github.com/superdurable/dex-connectors-library/connectors/openai \
            github.com/superdurable/dex-connectors-library/connectors/slack; do
            required_version="$(go mod edit -json | jq -r --arg module "$module" '.Require[] | select(.Path == $module) | .Version')"
            resolved_version="$(go list -m -f '{{.Version}}' "$module")"
            replacement="$(go list -m -f '{{if .Replace}}{{.Replace.Path}}{{end}}' "$module")"
            if [[ -z "$required_version" ]]; then
              echo "::error::$module must be a direct dependency"
              exit 1
            fi
            if [[ -n "$replacement" ]]; then
              echo "::error::$module must use a released version, not $replacement"
              exit 1
            fi
            if [[ "$resolved_version" != "$required_version" ]]; then
              echo "::error::$module resolves to $resolved_version, expected $required_version"
              exit 1
            fi
          done
      - name: Build
        env:
          GOWORK: "off"
        run: make bins
      - name: Unit tests
        env:
          GOWORK: "off"
        run: make unitTests

  e2e:
    name: End-to-end tests (pull, ${{ matrix.engine }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [zd]
    env:
      DEX_INTEG_ENGINE: ${{ matrix.engine }}
      DEX_SERVER_ZD_BINARY: ${{ github.workspace }}/server-zd/target/debug/dex-server-zd
      # These CARGO_* and RUST* values match Server ZD CI, so its main cache restores here.
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      RUST_BACKTRACE: "1"
      RUSTUP_TOOLCHAIN: "1.97.1"
      CARGO_BUILD_JOBS: "4"
    defaults:
      run:
        working-directory: examples/go
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Install libclang for RocksDB
        run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server-zd
          shared-key: server-zd-paradedb
          # Restore-only: the Server ZD CI ParadeDB job owns this key.
          save-if: false
      - name: Build dex-server-zd
        working-directory: server-zd
        run: cargo build --locked -p dexzd-server --bin dex-server-zd
      - uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: examples/go/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: End-to-end tests
        run: make e2eTests
      - name: Upload service logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: go-examples-e2e-services-${{ matrix.engine }}
          path: /tmp/test-go-examples-e2e-services.log
          if-no-files-found: ignore
