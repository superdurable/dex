name: Go examples CI

on:
  push:
    branches: [main]
    paths:
      - "examples/go/**"
      - "cli/**"
      - ".github/workflows/examples-go-ci.yml"
  pull_request:
    paths:
      - "examples/go/**"
      - "cli/**"
      - ".github/workflows/examples-go-ci.yml"
  workflow_dispatch:

jobs:
  unit:
    name: SDK build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/go
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: examples/go/go.mod
          cache-dependency-path: examples/go/go.sum
      - name: Verify SDK base version
        env:
          GOWORK: "off"
        run: test "$(go list -m -f '{{.Version}}' github.com/superdurable/dex/sdk-go)" = "v0.1.0"
      - name: Build
        env:
          GOWORK: "off"
        run: make bins
      - name: Unit tests
        env:
          GOWORK: "off"
        run: make unitTests

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/go
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: examples/go/go.mod
          cache-dependency-path: examples/go/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Temporal CLI runtime for dexcli dev
        uses: temporalio/setup-temporal@v0
      - name: End-to-end tests
        run: make e2eTests
      - name: Upload service logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: go-examples-e2e-services
          path: /tmp/test-go-examples-e2e-services.log
          if-no-files-found: ignore
