name: Go examples CI

on:
  pull_request:
    paths:
      - "examples/go/**"
      - "examples/entity-store/**"
      - ".github/workflows/examples-go-ci.yml"
  workflow_dispatch:
  # Main CI (all) and release workflows call this suite on main and release commits.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: examples-go-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    name: SDK build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/go
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: examples/go/go.mod
          cache-dependency-path: |
            examples/go/go.sum
            examples/go/quick-start/go.sum
      - name: Verify released module dependencies
        env:
          GOWORK: "off"
        run: |
          set -euo pipefail
          for module in \
            github.com/superdurable/dex/sdk-go \
            github.com/superdurable/dex/blob-cache-go \
            github.com/superdurable/dex-connectors-library/sdkgo \
            github.com/superdurable/dex-connectors-library/connectors/openai/go \
            github.com/superdurable/dex-connectors-library/connectors/slack/go; do
            required_version="$(go mod edit -json | jq -r --arg module "$module" '.Require[] | select(.Path == $module) | .Version')"
            resolved_version="$(go list -m -f '{{.Version}}' "$module")"
            replacement="$(go list -m -f '{{if .Replace}}{{.Replace.Path}}{{end}}' "$module")"
            if [[ -z "$required_version" ]]; then
              echo "::error::$module must be a direct dependency"
              exit 1
            fi
            if [[ -n "$replacement" ]]; then
              echo "::error::$module must use a released version, not $replacement"
              exit 1
            fi
            if [[ "$resolved_version" != "$required_version" ]]; then
              echo "::error::$module resolves to $resolved_version, expected $required_version"
              exit 1
            fi
          done
      - name: Build
        env:
          GOWORK: "off"
        run: make bins
      - name: Unit tests
        env:
          GOWORK: "off"
        run: make unitTests
      - name: Verify Quick Start released module dependencies
        working-directory: examples/go/quick-start
        env:
          GOWORK: "off"
        run: |
          set -euo pipefail
          go mod verify
          for module in \
            github.com/superdurable/dex/sdk-go \
            github.com/superdurable/dex/blob-cache-go; do
            replacement="$(go list -m -f '{{if .Replace}}{{.Replace.Path}}{{end}}' "$module")"
            if [[ -n "$replacement" ]]; then
              echo "::error::Quick Start $module must use a released version, not $replacement"
              exit 1
            fi
          done
          quick_start_sdk="$(go list -m -f '{{.Version}}' github.com/superdurable/dex/sdk-go)"
          examples_sdk="$(cd .. && go list -m -f '{{.Version}}' github.com/superdurable/dex/sdk-go)"
          if [[ "$quick_start_sdk" != "$examples_sdk" ]]; then
            echo "::error::Quick Start uses sdk-go $quick_start_sdk; the Go examples use $examples_sdk"
            exit 1
          fi
      - name: Check Quick Start formatting
        working-directory: examples/go/quick-start
        run: test -z "$(gofmt -s -l .)" || { gofmt -s -l .; exit 1; }
      - name: Build and vet Quick Start
        working-directory: examples/go/quick-start
        env:
          GOWORK: "off"
        run: |
          go build ./...
          go vet ./...

  e2e:
    name: End-to-end tests (pull, zd)
    runs-on: ubuntu-latest
    env:
      DEX_INTEG_ENGINE: zd
      DEX_SERVER_ZD_BINARY: ${{ github.workspace }}/server-zd/target/debug/dex-server-zd
      # These CARGO_* and RUST* values match Server ZD CI, so its main cache restores here.
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      RUST_BACKTRACE: "1"
      RUSTUP_TOOLCHAIN: "1.97.1"
      CARGO_BUILD_JOBS: "4"
    defaults:
      run:
        working-directory: examples/go
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Install libclang for RocksDB
        run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server-zd
          shared-key: server-zd-paradedb
          # Restore-only: the Server ZD CI ParadeDB job owns this key.
          save-if: false
      - name: Build dex-server-zd
        working-directory: server-zd
        run: cargo build --locked -p dexzd-server --bin dex-server-zd
      - uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: examples/go/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: End-to-end tests
        run: make e2eTests
      - name: Upload service logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: go-examples-e2e-services-zd
          path: /tmp/test-go-examples-e2e-services.log
          if-no-files-found: ignore
