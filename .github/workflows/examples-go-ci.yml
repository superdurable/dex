name: Go examples CI

on:
  push:
    branches: [main]
    paths:
      - "examples/go/**"
      - "sdk-go/**"
      - "cli/**"
      - ".github/workflows/examples-go-ci.yml"
  pull_request:
    paths:
      - "examples/go/**"
      - "sdk-go/**"
      - "cli/**"
      - ".github/workflows/examples-go-ci.yml"
  workflow_dispatch:

jobs:
  unit:
    name: SDK build
    runs-on: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'self-hosted' || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: examples/go
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: examples/go/go.mod
          cache-dependency-path: |
            examples/go/go.sum
            sdk-go/go.sum
      - name: Verify released module dependencies
        env:
          GOWORK: "off"
        run: |
          set -euo pipefail
          for module in github.com/superdurable/dex/sdk-go github.com/superdurable/dex/blob-cache-go; do
            required_version="$(go mod edit -json | jq -r --arg module "$module" '.Require[] | select(.Path == $module) | .Version')"
            resolved_version="$(go list -m -f '{{.Version}}' "$module")"
            replacement="$(go list -m -f '{{if .Replace}}{{.Replace.Path}}{{end}}' "$module")"
            if [[ -z "$required_version" ]]; then
              echo "::error::$module must be a direct dependency"
              exit 1
            fi
            if [[ -n "$replacement" ]]; then
              echo "::error::$module must use a released version, not $replacement"
              exit 1
            fi
            if [[ "$resolved_version" != "$required_version" ]]; then
              echo "::error::$module resolves to $resolved_version, expected $required_version"
              exit 1
            fi
          done
      - name: Use checkout SDK
        run: go mod edit -replace github.com/superdurable/dex/sdk-go=../../sdk-go
      - name: Build
        env:
          GOWORK: "off"
        run: make bins
      - name: Unit tests
        env:
          GOWORK: "off"
        run: make unitTests

  e2e:
    name: End-to-end tests
    runs-on: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'self-hosted' || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: examples/go
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: examples/go/go.mod
          cache-dependency-path: |
            examples/go/go.sum
            sdk-go/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Temporal CLI runtime for dexcli dev
        uses: temporalio/setup-temporal@v0
      - name: Use checkout SDK
        run: go mod edit -replace github.com/superdurable/dex/sdk-go=../../sdk-go
      - name: End-to-end tests
        run: make e2eTests
      - name: Upload service logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: go-examples-e2e-services
          path: /tmp/test-go-examples-e2e-services.log
          if-no-files-found: ignore
