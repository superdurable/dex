name: Rust SDK CI

on:
  pull_request:
    paths:
      - "sdk-rust/**"
      # The suites build dexcli and run dexcli dev; the agents terminal UI is not part of it.
      - "cli/cmd/**"
      - "cli/internal/command/**"
      - "cli/internal/dev/**"
      - "cli/internal/flowviz/**"
      - "cli/internal/pointervalue/**"
      - "cli/internal/update/**"
      - "cli/schema/**"
      - "cli/go.mod"
      - "cli/go.sum"
      - "cli/Makefile"
      - "cli/SERVER_ZD_RELEASE"
      - "server-zd/**"
      - "s3local/**"
      - "protos/**"
      # The suites run the Web server inside dexcli dev but never load its pages.
      - "web/**/*.go"
      - "web/go.mod"
      - "web/go.sum"
      - "codecov.yml"
      - ".github/workflows/sdk-rust-ci.yml"
  workflow_dispatch:
  # Main CI (all) and release workflows call this suite on main and release commits.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: sdk-rust-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  RUSTUP_TOOLCHAIN: "1.97.1"

jobs:
  quality:
    name: Format and Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sdk-rust
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Validate public API documentation
        run: make docs-check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  # macOS and Windows test a pull request only when it changes the Rust SDK itself.
  platforms:
    name: Select test platforms
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      os: ${{ steps.select.outputs.os }}
    steps:
      # Depth 2 includes the merge commit's first parent, the pull request base.
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
      - name: Select operating systems
        id: select
        env:
          IS_PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail
          all_platforms='["ubuntu-latest", "macos-latest", "windows-latest"]'
          if [[ "$IS_PULL_REQUEST" != "true" ]]; then
            echo "os=$all_platforms" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed_files="$(git diff --name-only HEAD^1 HEAD)"
          if grep -qE '^(sdk-rust/|\.github/workflows/sdk-rust-ci\.yml$)' <<<"$changed_files"; then
            echo "os=$all_platforms" >> "$GITHUB_OUTPUT"
          else
            echo 'os=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          fi

  tests:
    name: Tests (${{ matrix.os }})
    needs: platforms
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.platforms.outputs.os) }}
    defaults:
      run:
        working-directory: sdk-rust
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Run tests
        run: cargo test --workspace --locked

  integration:
    name: Integration coverage (zd, pull)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
      id-token: write
    env:
      DEX_INTEG_ENGINE: zd
      DEX_SERVER_ZD_BINARY: ${{ github.workspace }}/server-zd/target/debug/dex-server-zd
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      RUST_BACKTRACE: "1"
      RUSTUP_TOOLCHAIN: "1.97.1"
      CARGO_BUILD_JOBS: "4"
    defaults:
      run:
        working-directory: sdk-rust
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Install libclang for RocksDB
        run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server-zd
          shared-key: server-zd-paradedb
          save-if: false
      - name: Build dex-server-zd
        working-directory: server-zd
        run: cargo build --locked -p dexzd-server --bin dex-server-zd
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: |
            cli/go.sum
            web/go.sum
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Run integration coverage
        run: ./run-integration-tests.sh --coverage
      - name: Upload Rust integration coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          disable_search: true
          fail_ci_if_error: true
          files: ./sdk-rust/coverage/lcov.info
          flags: sdk-rust-integration-pull
          name: sdk-rust-integration-pull
          use_oidc: true
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sdk-rust-integration-coverage-pull
          path: sdk-rust/coverage/
          if-no-files-found: ignore
      - name: Upload service logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sdk-rust-integration-services-pull
          path: /tmp/test-rust-sdk-integration-services.log
          if-no-files-found: ignore
