name: Rust SDK CI

on:
  push:
    branches: [main]
    paths:
      - "sdk-rust/**"
      - ".github/workflows/sdk-rust-ci.yml"
  pull_request:
    paths:
      - "sdk-rust/**"
      - ".github/workflows/sdk-rust-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  RUSTUP_TOOLCHAIN: "1.85.0"

jobs:
  quality:
    name: Format and Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sdk-rust
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install 1.85.0 --profile minimal --component rustfmt,clippy
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: sdk-rust
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install 1.85.0 --profile minimal
      - name: Run tests
        run: cargo test --workspace --locked
