name: Rust SDK CI

on:
  push:
    branches: [main]
    paths:
      - "sdk-rust/**"
      - "cli/**"
      - "server/**"
      - "protos/**"
      - "web/**"
      - "codecov.yml"
      - ".github/workflows/sdk-rust-ci.yml"
  pull_request:
    paths:
      - "sdk-rust/**"
      - "cli/**"
      - "server/**"
      - "protos/**"
      - "web/**"
      - "codecov.yml"
      - ".github/workflows/sdk-rust-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  RUSTUP_TOOLCHAIN: "1.97.1"

jobs:
  quality:
    name: Format and Clippy
    runs-on: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'self-hosted' || 'ubuntu-latest' }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sdk-rust
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Validate public API documentation
        run: make docs-check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'self-hosted' || matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'push' && github.ref == 'refs/heads/main' && '["self-hosted"]' || '["ubuntu-latest", "macos-latest", "windows-latest"]') }}
    defaults:
      run:
        working-directory: sdk-rust
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Run tests
        run: cargo test --workspace --locked

  integration:
    name: Integration coverage
    runs-on: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'self-hosted' || 'ubuntu-latest' }}
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: sdk-rust
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: |
            cli/go.sum
            server/go.sum
            web/go.sum
      - name: Install Temporal CLI runtime for dexcli dev
        uses: temporalio/setup-temporal@v0
      - name: Install Rust
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Run integration coverage
        run: ./run-integration-tests.sh --coverage
      - name: Upload Rust integration coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          disable_search: true
          fail_ci_if_error: true
          files: ./sdk-rust/coverage/lcov.info
          flags: sdk-rust-integration
          name: sdk-rust-integration
          use_oidc: true
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sdk-rust-integration-coverage
          path: sdk-rust/coverage/
          if-no-files-found: ignore
      - name: Upload service logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sdk-rust-integration-services
          path: /tmp/test-rust-sdk-integration-services.log
          if-no-files-found: ignore
