name: Push Dex Web image (release)

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      version:
        description: Dex Web image semantic version without the v prefix
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Docker image tag (e.g. v1.0.0)"
        required: true
        type: string
      dry_run:
        description: Build both architectures without pushing images
        required: false
        default: false
        type: boolean

jobs:
  docker:
    runs-on: ubuntu-latest
    if: >
      inputs.version != '' ||
      startsWith(github.event.release.tag_name, 'web/v')
    steps:
      - uses: actions/checkout@v7
      - name: Resolve image tag
        id: meta
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ -n "${RELEASE_TAG}" ]]; then
            image_tag="${RELEASE_TAG#web/}"
          else
            image_tag="v${INPUT_VERSION#v}"
          fi
          if [[ ! "${image_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z]+)*$ ]]; then
            echo "Invalid Docker image version: ${image_tag}" >&2
            exit 1
          fi
          echo "tag=${image_tag}" >> "${GITHUB_OUTPUT}"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Verify Web runtime version
        env:
          WEB_VERSION: ${{ steps.meta.outputs.tag }}
        run: |
          docker build \
            --build-arg "WEB_VERSION=${WEB_VERSION}" \
            --file web/Dockerfile \
            --tag dex-web-release-check \
            .
          runtime_version="$(docker run --rm --entrypoint /dex/dex-web dex-web-release-check --version)"
          [[ "${runtime_version}" == *"${WEB_VERSION}"* ]] || {
            echo "Web runtime version does not match ${WEB_VERSION}: ${runtime_version}" >&2
            exit 1
          }
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./web/Dockerfile
          push: ${{ !inputs.dry_run }}
          platforms: linux/arm64,linux/amd64
          tags: superdurable/dex-web:${{ steps.meta.outputs.tag }}
          build-args: |
            WEB_VERSION=${{ steps.meta.outputs.tag }}
