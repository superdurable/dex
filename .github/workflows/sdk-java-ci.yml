name: Java SDK CI

on:
  push:
    branches: [main]
    paths:
      - "sdk-java/**"
      - "sdk-rust/Cargo.lock"
      - "sdk-rust/Cargo.toml"
      - "sdk-rust/crates/dex-blob-cache/**"
      - "sdk-rust/crates/dex-blob-cache-jni/**"
      - "cli/**"
      - "server/**"
      - "protos/**"
      - "codecov.yml"
      - ".github/workflows/sdk-java-ci.yml"
      - ".github/workflows/sdk-java-publish.yml"
  pull_request:
    paths:
      - "sdk-java/**"
      - "sdk-rust/Cargo.lock"
      - "sdk-rust/Cargo.toml"
      - "sdk-rust/crates/dex-blob-cache/**"
      - "sdk-rust/crates/dex-blob-cache-jni/**"
      - "cli/**"
      - "server/**"
      - "protos/**"
      - "codecov.yml"
      - ".github/workflows/sdk-java-ci.yml"
      - ".github/workflows/sdk-java-publish.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-java-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: User contracts (Java ${{ matrix.java-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: ["8", "17"]
    defaults:
      run:
        working-directory: sdk-java
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install 1.88.0 --profile minimal
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: ${{ matrix.java-version }}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Compile IWF integration ports
        run: ./gradlew compileTestJava --no-daemon
      - name: Test contracts
        run: ./gradlew test --tests io.superdurable.dex.contracts.UserContractsTest --no-daemon

  publication:
    name: Maven publication
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: '1.88.0'
    defaults:
      run:
        working-directory: sdk-java
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install 1.88.0 --profile minimal
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Validate Gradle and Maven consumers
        run: ./validate-publication.sh "0.0.2-ci.${GITHUB_RUN_NUMBER}"

  tests:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    env:
      RUSTUP_TOOLCHAIN: "1.88.0"
    defaults:
      run:
        working-directory: sdk-java
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: |
            cli/go.sum
            server/go.sum
            web/go.sum
      - name: Install Temporal CLI runtime for dexcli dev
        uses: temporalio/setup-temporal@v0
      - name: Install Rust
        run: rustup toolchain install 1.88.0 --profile minimal
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "8"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Run JVM and dexcli dev integration coverage
        run: ./run-integration-tests.sh --coverage
      - name: Upload Java integration coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          disable_search: true
          fail_ci_if_error: true
          files: ./sdk-java/build/reports/jacoco/integration/jacoco.xml
          flags: sdk-java-integration
          name: sdk-java-integration
          use_oidc: true
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sdk-java-integration-coverage
          path: sdk-java/build/reports/jacoco/integration/
          if-no-files-found: ignore
      - name: Upload service logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sdk-java-integration-services
          path: /tmp/test-java-sdk-integration-services.log
          if-no-files-found: ignore
