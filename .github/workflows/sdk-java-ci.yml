name: Java SDK CI

on:
  push:
    branches: [main]
    paths:
      - "sdk-java/**"
      - "sdk-rust/Cargo.lock"
      - "sdk-rust/Cargo.toml"
      - "sdk-rust/crates/dex-blob-cache/**"
      - "sdk-rust/crates/dex-blob-cache-jni/**"
      - "cli/**"
      - "server/**"
      - "protos/**"
      - ".github/workflows/sdk-java-ci.yml"
  pull_request:
    paths:
      - "sdk-java/**"
      - "sdk-rust/Cargo.lock"
      - "sdk-rust/Cargo.toml"
      - "sdk-rust/crates/dex-blob-cache/**"
      - "sdk-rust/crates/dex-blob-cache-jni/**"
      - "cli/**"
      - "server/**"
      - "protos/**"
      - ".github/workflows/sdk-java-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-java-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: User contracts (Java ${{ matrix.java-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: ["8", "17"]
    defaults:
      run:
        working-directory: sdk-java
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: ${{ matrix.java-version }}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Compile IWF integration ports
        run: ./gradlew compileTestJava --no-daemon
      - name: Test contracts
        run: ./gradlew test --tests io.superdurable.dex.contracts.UserContractsTest --no-daemon

  tests:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RUSTUP_TOOLCHAIN: "1.88.0"
    defaults:
      run:
        working-directory: sdk-java
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: |
            cli/go.sum
            server/go.sum
            web/go.sum
      - name: Install Temporal CLI runtime for dexcli dev
        uses: temporalio/setup-temporal@v0
      - name: Install Rust
        run: rustup toolchain install 1.88.0 --profile minimal
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "8"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Run JVM and dexcli dev integration tests
        run: ./run-integration-tests.sh
      - name: Upload service logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sdk-java-integration-services
          path: /tmp/test-java-sdk-integration-services.log
          if-no-files-found: ignore
