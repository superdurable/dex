name: Server ZD Go SDK CI

on:
  push:
    branches: [main]
    paths:
      - "server-zd/**"
      - "sdk-go/**"
      - "cli/**"
      - "web/**"
      - "protos/**"
      - "go.work"
      - "go.work.sum"
      - ".github/workflows/server-zd-sdk-go-ci.yml"
  pull_request:
    paths:
      - "server-zd/**"
      - "sdk-go/**"
      - "cli/**"
      - "web/**"
      - "protos/**"
      - "go.work"
      - "go.work.sum"
      - ".github/workflows/server-zd-sdk-go-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-zd-sdk-go-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  RUSTUP_TOOLCHAIN: "1.97.1"

jobs:
  sdk-go-integration:
    name: Go SDK integration (pull)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: sdk-go
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache-dependency-path: |
            sdk-go/go.sum
            cli/go.sum
            server/go.sum
            go.work.sum
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Rust
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Install libclang for the RocksDB bindings
        run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server-zd
          shared-key: server-zd-sdk-go-release
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run Go SDK integration suite against server-zd
        env:
          DEX_INTEG_ENGINE: zd
        run: ./run-e2e-tests.sh
      - name: Upload service logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: server-zd-sdk-go-integration-services
          path: /tmp/test-go-sdk-phase5-e2e-services.log
          if-no-files-found: ignore
