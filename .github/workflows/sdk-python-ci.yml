name: Python SDK CI

on:
  push:
    branches: [main]
    paths:
      - "sdk-python/**"
      - ".github/workflows/sdk-python-ci.yml"
  pull_request:
    paths:
      - "sdk-python/**"
      - ".github/workflows/sdk-python-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-python-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: User contracts (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: sdk-python
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.2"
          python-version: ${{ matrix.python-version }}
          working-directory: sdk-python
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Test contracts
        run: uv run --frozen pytest tests/test_contracts.py
      - name: Check static types with mypy
        run: uv run --frozen mypy --strict tests/typecheck_contracts.py tests/iwfcompat
      - name: Check static types with pyright
        run: uv run --frozen pyright tests/typecheck_contracts.py tests/iwfcompat

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk-python
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.2"
          python-version: "3.11"
          working-directory: sdk-python
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Run contract linters
        run: |
          uv run --frozen pre-commit run \
            --show-diff-on-failure \
            --color=always \
            --files \
              dex/_contract_utils.py \
              dex/blob_cache.py \
              dex/client.py \
              dex/client_options.py \
              dex/codec.py \
              dex/flow.py \
              dex/flow_config.py \
              dex/flow_info.py \
              dex/flow_options.py \
              dex/state.py \
              dex/step.py \
              dex/step_execution.py \
              dex/worker.py \
              dex/worker_options.py \
              tests/*.py \
              tests/iwfcompat/*.py \
              pyproject.toml \
              uv.lock

  pytest:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk-python
    steps:
      - uses: actions/checkout@v7
      - name: Start Dex environment
        working-directory: sdk-python/dex/tests/dex-service-env
        env:
          DEX_SERVER_IMAGE: superdurable/dex-server:latest
        run: |
          docker pull "$DEX_SERVER_IMAGE"
          docker compose up -d
      - name: Wait for Dex server
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          echo "Waiting for Elasticsearch..."
          for i in $(seq 1 60); do
            if docker exec temporal-elasticsearch-dex curl -fsS http://localhost:9200/_cluster/health >/dev/null 2>&1; then
              echo "Elasticsearch ready (attempt $i)"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "Timed out waiting for Elasticsearch"
              docker logs temporal-elasticsearch-dex 2>&1 | tail -80 || true
              exit 1
            fi
            sleep 5
          done
          echo "Waiting for search attributes..."
          for i in $(seq 1 120); do
            if docker logs temporal-admin-tools-dex 2>&1 | grep -q "All search attributes are registered"; then
              echo "Search attributes ready (attempt $i)"
              break
            fi
            if [ "$i" -eq 120 ]; then
              echo "Timed out waiting for search attributes"
              docker logs temporal-admin-tools-dex 2>&1 | tail -80 || true
              docker logs temporal-dex 2>&1 | tail -80 || true
              exit 1
            fi
            sleep 2
          done
          echo "Waiting for Dex healthcheck..."
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8801/info/healthcheck >/dev/null 2>&1; then
              echo "Dex server healthy (attempt $i)"
              exit 0
            fi
            sleep 2
          done
          echo "Timed out waiting for Dex server"
          docker logs dex-server 2>&1 | tail -80 || true
          exit 1
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.2"
          python-version: "3.11"
          working-directory: sdk-python
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Pytest
        run: |
          echo "[run]">>.coveragerc
          echo "omit = dex/dexpb/">>.coveragerc
          uv run --frozen pytest -vv --cov-config=.coveragerc --cov="dex/" .
      - name: Dump docker logs
        if: always()
        run: bash "$GITHUB_WORKSPACE/.github/scripts/dump-docker-logs.sh"
