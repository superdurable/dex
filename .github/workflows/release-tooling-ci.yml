name: Release Tooling CI

on:
  pull_request:
    paths:
      - "script/release/**"
      - "script/regenerate_derived.py"
      - "script/regenerate_derived_integ_test.py"
      - "Makefile"
      - "skills/script/check-package.py"
      - "docs/reference/*/changelog.mdx"
      - "agents/CHANGELOG.md"
      - ".github/workflows/release-changed-components.yml"
      - ".github/workflows/cli-release.yml"
      - ".github/workflows/docker-image-web-release.yml"
      - ".github/workflows/release-tooling-ci.yml"
      - "CONTRIBUTING.md"
  workflow_dispatch:
  # Main CI (all) and release workflows call this suite on main and release commits.
  workflow_call:

# Only pull request runs share a group, so superseded PR commits cancel; main and release runs never do.
concurrency:
  group: release-tooling-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-tooling:
    name: Release tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Test release tooling
        run: make release-tooling-test
      - name: Test derived-file regeneration
        run: make regenerate-derived-test
      - name: Validate workflow policy
        run: make ci-runner-check
