name: Dex CLI CI

on:
  push:
    branches: [main]
    paths:
      - "cli/**"
      - "web/**"
      - "packages/flow-definition-renderer/**"
      - "sdk-go/**"
      - "protos/**"
      - "go.work"
      - ".github/workflows/cli-ci.yml"
  pull_request:
    paths:
      - "cli/**"
      - "web/**"
      - "packages/flow-definition-renderer/**"
      - "sdk-go/**"
      - "protos/**"
      - "go.work"
      - ".github/workflows/cli-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build and local-stack integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: |
            cli/go.sum
            web/go.sum
            sdk-go/go.sum
            protos/codec-server/go.sum
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install bundled server-zd
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release="$(cat cli/SERVER_ZD_RELEASE)"
          archive="dex-server-zd_${release#server-zd/}_linux_amd64.tar.gz"
          download_dir="$RUNNER_TEMP/server-zd"
          gh release download "$release" --repo "$GITHUB_REPOSITORY" \
            --pattern "$archive" --pattern checksums.txt --dir "$download_dir"
          (cd "$download_dir" && sha256sum --check --ignore-missing checksums.txt)
          tar -xzf "$download_dir/$archive" -C "$download_dir"
          echo "DEX_SERVER_ZD_BINARY=$download_dir/dex-server-zd" >> "$GITHUB_ENV"
      - name: Build embedded Web assets
        working-directory: web
        run: |
          npm ci
          npm run check
          npm run build
      - name: Verify generated Web assets
        run: git diff --exit-code -- web/assets/dist
      - name: Verify standalone module dependencies
        run: |
          set -euo pipefail
          for module in cli web protos/codec-server; do
            dependencies="$(cd "$module" && GOWORK=off go list -m all)"
            if grep -E '^github.com/superdurable/dex ' <<<"$dependencies"; then
              echo "::error::$module imports the removed Go Server module"
              exit 1
            fi
          done
      - name: Test CLI packages
        working-directory: cli
        env:
          GOWORK: "off"
        run: go test ./...
      - name: Test Temporal Codec Server
        run: make -C protos codec-server-test
      - name: Test Go and Python Flow visualization
        working-directory: cli
        env:
          GOWORK: "off"
        run: go test -tags=integration ./internal/command -run TestVisualize -count=1 -v
      - name: Test local server-zd mode
        working-directory: cli
        env:
          GOWORK: "off"
        run: go test -tags=integration ./internal/dev -count=1 -v
      - name: Build release binary
        working-directory: cli
        env:
          GOWORK: "off"
        run: go build -trimpath -o dexcli ./cmd/dexcli
      - name: Verify runtime has no Node dependency
        working-directory: cli
        run: |
          env PATH="$(go env GOROOT)/bin:/usr/bin:/bin" ./dexcli version
          env PATH="$(go env GOROOT)/bin:/usr/bin:/bin" ./dexcli dev --help
          env PATH="$(go env GOROOT)/bin:/usr/bin:/bin" ./dexcli codec-server --help
