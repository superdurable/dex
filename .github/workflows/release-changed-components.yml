name: Release changed components

on:
  workflow_dispatch:
    inputs:
      go_version:
        description: Go SDK semantic version; empty skips it
        required: false
        type: string
      java_version:
        description: Java SDK semantic version; empty skips it
        required: false
        type: string
      python_version:
        description: Python SDK semantic version; empty skips it
        required: false
        type: string
      rust_version:
        description: Rust SDK semantic version; empty skips it
        required: false
        type: string
      typescript_version:
        description: TypeScript SDK semantic version; empty skips it
        required: false
        type: string
      web_version:
        description: Dex Web semantic version; empty skips it
        required: false
        type: string
      cli_version:
        description: CLI semantic version; empty skips it
        required: false
        type: string
      agents_version:
        description: Agents packages version (tag agents/v<version>); empty skips the agents packages
        required: false
        default: ""
        type: string
      agents_python_skip_packages:
        description: >-
          Space-separated agents CLI command distributions the PyPI publisher leaves out, for PyPI's
          new-project limit; empty uploads all (see agents/README.md#releases)
        required: false
        default: ""
        type: string
      run_tests:
        description: Run each selected component's test workflow before creating any release
        required: false
        default: false
        type: boolean
      allow_unchanged:
        description: Allow selected components with no changes since their latest tag
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-changed-components
  cancel-in-progress: false

jobs:
  plan:
    name: Plan releases
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      go_version: ${{ steps.plan.outputs.go_version }}
      java_version: ${{ steps.plan.outputs.java_version }}
      python_version: ${{ steps.plan.outputs.python_version }}
      rust_version: ${{ steps.plan.outputs.rust_version }}
      typescript_version: ${{ steps.plan.outputs.typescript_version }}
      web_version: ${{ steps.plan.outputs.web_version }}
      cli_version: ${{ steps.plan.outputs.cli_version }}
      go: ${{ steps.plan.outputs.go }}
      go_tag: ${{ steps.plan.outputs.go_tag }}
      go_baseline: ${{ steps.plan.outputs.go_baseline }}
      rust: ${{ steps.plan.outputs.rust }}
      rust_tag: ${{ steps.plan.outputs.rust_tag }}
      rust_baseline: ${{ steps.plan.outputs.rust_baseline }}
      java: ${{ steps.plan.outputs.java }}
      java_tag: ${{ steps.plan.outputs.java_tag }}
      java_baseline: ${{ steps.plan.outputs.java_baseline }}
      python: ${{ steps.plan.outputs.python }}
      python_tag: ${{ steps.plan.outputs.python_tag }}
      python_baseline: ${{ steps.plan.outputs.python_baseline }}
      typescript: ${{ steps.plan.outputs.typescript }}
      typescript_tag: ${{ steps.plan.outputs.typescript_tag }}
      typescript_baseline: ${{ steps.plan.outputs.typescript_baseline }}
      web: ${{ steps.plan.outputs.web }}
      web_tag: ${{ steps.plan.outputs.web_tag }}
      web_baseline: ${{ steps.plan.outputs.web_baseline }}
      cli: ${{ steps.plan.outputs.cli }}
      cli_tag: ${{ steps.plan.outputs.cli_tag }}
      cli_baseline: ${{ steps.plan.outputs.cli_baseline }}
      agents: ${{ steps.plan.outputs.agents }}
      agents_tag: ${{ steps.plan.outputs.agents_tag }}
      agents_baseline: ${{ steps.plan.outputs.agents_baseline }}
      agents_version: ${{ steps.plan.outputs.agents_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify main branch
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          if [[ "${RELEASE_REF}" != "refs/heads/main" ]]; then
            echo "Changed-component releases can run only from main" >&2
            exit 1
          fi
      - name: Plan selected components and preflight tags
        id: plan
        env:
          GO_VERSION: ${{ inputs.go_version }}
          JAVA_VERSION: ${{ inputs.java_version }}
          PYTHON_VERSION: ${{ inputs.python_version }}
          RUST_VERSION: ${{ inputs.rust_version }}
          TYPESCRIPT_VERSION: ${{ inputs.typescript_version }}
          WEB_VERSION: ${{ inputs.web_version }}
          CLI_VERSION: ${{ inputs.cli_version }}
          AGENTS_VERSION: ${{ inputs.agents_version }}
          ALLOW_UNCHANGED: ${{ inputs.allow_unchanged }}
        run: |
          options=()
          if [[ "${ALLOW_UNCHANGED}" == "true" ]]; then
            options+=(--allow-unchanged)
          fi
          python3 script/release/changed_components.py \
            --go-version "${GO_VERSION}" --java-version "${JAVA_VERSION}" \
            --python-version "${PYTHON_VERSION}" --rust-version "${RUST_VERSION}" \
            --typescript-version "${TYPESCRIPT_VERSION}" --web-version "${WEB_VERSION}" \
            --cli-version "${CLI_VERSION}" --agents-version "${AGENTS_VERSION}" \
            "${options[@]}" --output "${GITHUB_OUTPUT}"

  reject-non-main:
    name: Reject non-main dispatch
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Changed-component releases can run only from main" >&2
          exit 1

  # Tests are optional; run_tests=true runs each selected component's suite before any release is created.
  test-go:
    name: Test Go SDK
    needs: plan
    if: inputs.run_tests && needs.plan.outputs.go == 'true'
    uses: ./.github/workflows/sdk-go-ci.yml
  test-java:
    name: Test Java SDK
    needs: plan
    if: inputs.run_tests && needs.plan.outputs.java == 'true'
    uses: ./.github/workflows/sdk-java-ci.yml
  test-python:
    name: Test Python SDK
    needs: plan
    if: inputs.run_tests && needs.plan.outputs.python == 'true'
    uses: ./.github/workflows/sdk-python-ci.yml
  test-rust:
    name: Test Rust SDK
    needs: plan
    if: inputs.run_tests && needs.plan.outputs.rust == 'true'
    uses: ./.github/workflows/sdk-rust-ci.yml
  test-typescript:
    name: Test TypeScript SDK
    needs: plan
    if: inputs.run_tests && needs.plan.outputs.typescript == 'true'
    uses: ./.github/workflows/sdk-typescript-ci.yml
  test-web:
    name: Test Dex Web
    needs: plan
    if: inputs.run_tests && needs.plan.outputs.web == 'true'
    uses: ./.github/workflows/web-ci.yml
  test-cli:
    name: Test CLI
    needs: plan
    if: inputs.run_tests && needs.plan.outputs.cli == 'true'
    uses: ./.github/workflows/cli-ci.yml
  test-agents:
    name: Test agents packages
    needs: plan
    if: inputs.run_tests && needs.plan.outputs.agents == 'true'
    uses: ./.github/workflows/agents-ci.yml

  create-releases:
    name: Create selected releases
    needs: [plan, test-go, test-java, test-python, test-rust, test-typescript, test-web, test-cli, test-agents]
    # A suite is skipped when run_tests is off or this run does not release its component.
    if: >-
      !cancelled() && needs.plan.result == 'success'
      && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Create GitHub Releases
        shell: bash
        env:
          GO_SELECTED: ${{ needs.plan.outputs.go }}
          GO_TAG: ${{ needs.plan.outputs.go_tag }}
          GO_BASELINE: ${{ needs.plan.outputs.go_baseline }}
          RUST_SELECTED: ${{ needs.plan.outputs.rust }}
          RUST_TAG: ${{ needs.plan.outputs.rust_tag }}
          RUST_BASELINE: ${{ needs.plan.outputs.rust_baseline }}
          JAVA_SELECTED: ${{ needs.plan.outputs.java }}
          JAVA_TAG: ${{ needs.plan.outputs.java_tag }}
          JAVA_BASELINE: ${{ needs.plan.outputs.java_baseline }}
          PYTHON_SELECTED: ${{ needs.plan.outputs.python }}
          PYTHON_TAG: ${{ needs.plan.outputs.python_tag }}
          PYTHON_BASELINE: ${{ needs.plan.outputs.python_baseline }}
          TYPESCRIPT_SELECTED: ${{ needs.plan.outputs.typescript }}
          TYPESCRIPT_TAG: ${{ needs.plan.outputs.typescript_tag }}
          TYPESCRIPT_BASELINE: ${{ needs.plan.outputs.typescript_baseline }}
          WEB_SELECTED: ${{ needs.plan.outputs.web }}
          WEB_TAG: ${{ needs.plan.outputs.web_tag }}
          WEB_BASELINE: ${{ needs.plan.outputs.web_baseline }}
          CLI_SELECTED: ${{ needs.plan.outputs.cli }}
          CLI_TAG: ${{ needs.plan.outputs.cli_tag }}
          CLI_BASELINE: ${{ needs.plan.outputs.cli_baseline }}
          AGENTS_SELECTED: ${{ needs.plan.outputs.agents }}
          AGENTS_TAG: ${{ needs.plan.outputs.agents_tag }}
          AGENTS_BASELINE: ${{ needs.plan.outputs.agents_baseline }}
        run: |
          # Each release's notes list only its own change-log items; never GitHub-generated notes.
          selected=(
            "go:sdk-go/v:${GO_SELECTED}:${GO_TAG}:${GO_BASELINE}"
            "rust:sdk-rust/v:${RUST_SELECTED}:${RUST_TAG}:${RUST_BASELINE}"
            "java:sdk-java/v:${JAVA_SELECTED}:${JAVA_TAG}:${JAVA_BASELINE}"
            "python:sdk-python/v:${PYTHON_SELECTED}:${PYTHON_TAG}:${PYTHON_BASELINE}"
            "typescript:sdk-typescript/v:${TYPESCRIPT_SELECTED}:${TYPESCRIPT_TAG}:${TYPESCRIPT_BASELINE}"
            "web:web/v:${WEB_SELECTED}:${WEB_TAG}:${WEB_BASELINE}"
            "cli:cli-v:${CLI_SELECTED}:${CLI_TAG}:${CLI_BASELINE}"
            "agents:agents/v:${AGENTS_SELECTED}:${AGENTS_TAG}:${AGENTS_BASELINE}"
          )
          for release in "${selected[@]}"; do
            IFS=: read -r component tag_prefix is_selected tag baseline <<< "${release}"
            if [[ "${is_selected}" != "true" ]]; then
              continue
            fi
            version="${tag#"${tag_prefix}"}"
            release_notes="$(mktemp)"
            # Agents notes come from agents/CHANGELOG.md; the baseline is the previous agents/v* tag.
            if [[ "${component}" == "agents" ]]; then
              python3 script/release/component_release_notes.py agents "${version}" \
                --previous-tag "${baseline}" \
                --repository "${GITHUB_REPOSITORY}" \
                --output "${release_notes}"
              gh release create "${tag}" --target "${GITHUB_SHA}" --title "Dex agents ${version}" \
                --notes-file "${release_notes}" --latest=false
              continue
            fi
            python3 script/release/component_release_notes.py "${component}" "${version}" \
              --output "${release_notes}"
            gh release create "${tag}" --target "${GITHUB_SHA}" --title "${tag}" --notes-file "${release_notes}"
          done

  snapshot-references:
    name: Push released reference snapshots
    needs: [plan, create-releases]
    if: >-
      !cancelled() && needs.create-releases.result == 'success' && (
      needs.plan.outputs.go == 'true' || needs.plan.outputs.python == 'true' ||
      needs.plan.outputs.java == 'true' || needs.plan.outputs.typescript == 'true' ||
      needs.plan.outputs.rust == 'true' || needs.plan.outputs.web == 'true' ||
      needs.plan.outputs.cli == 'true' || needs.plan.outputs.agents == 'true')
    # A snapshot failure must never fail the release run.
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install docs dependencies
        run: npm ci --prefix docs
      - name: Snapshot selected components
        env:
          GO_VERSION: ${{ needs.plan.outputs.go_version }}
          PYTHON_VERSION: ${{ needs.plan.outputs.python_version }}
          JAVA_VERSION: ${{ needs.plan.outputs.java_version }}
          TYPESCRIPT_VERSION: ${{ needs.plan.outputs.typescript_version }}
          RUST_VERSION: ${{ needs.plan.outputs.rust_version }}
          WEB_VERSION: ${{ needs.plan.outputs.web_version }}
          CLI_VERSION: ${{ needs.plan.outputs.cli_version }}
          GO_SELECTED: ${{ needs.plan.outputs.go }}
          PYTHON_SELECTED: ${{ needs.plan.outputs.python }}
          JAVA_SELECTED: ${{ needs.plan.outputs.java }}
          TYPESCRIPT_SELECTED: ${{ needs.plan.outputs.typescript }}
          RUST_SELECTED: ${{ needs.plan.outputs.rust }}
          WEB_SELECTED: ${{ needs.plan.outputs.web }}
          CLI_SELECTED: ${{ needs.plan.outputs.cli }}
          AGENTS_SELECTED: ${{ needs.plan.outputs.agents }}
          AGENTS_VERSION: ${{ needs.plan.outputs.agents_version }}
        run: |
          for component in go python java typescript rust web cli; do
            selected_name="${component^^}_SELECTED"
            if [[ "${!selected_name}" == "true" ]]; then
              version_name="${component^^}_VERSION"
              node docs/scripts/snapshot-reference.mjs "${component}" "${!version_name}"
            fi
          done
          # The agents packages have their own version line.
          if [[ "${AGENTS_SELECTED}" == "true" ]]; then
            node docs/scripts/snapshot-reference.mjs agents "${AGENTS_VERSION}"
          fi
      - name: Check snapshots
        run: npm run check --prefix docs
      # GITHUB_TOKEN cannot open pull requests here, and its pull requests would not trigger CI.
      # A GitHub App token would let this step open the pull request itself.
      - name: Push snapshot branch
        run: |
          git add docs
          if git diff --cached --quiet; then
            echo "No reference snapshot changes." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          branch="automation/reference-snapshots-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "${branch}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "docs: snapshot component references"
          git push origin "${branch}"
          # Check Gate CI accepts the change-log link rewrites of a snapshot only with this description line.
          compare_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${branch}?expand=1&body=changelog%3A%20correction%3A%20reference%20snapshot"
          {
            echo "## Reference snapshots"
            echo
            echo "Pushed \`${branch}\`. Open its pull request: ${compare_url}"
            echo
            echo "Keep the description line \`changelog: correction: reference snapshot\`."
            echo
            echo "Merge reference snapshot branches in release order."
            echo
            echo '```text'
            git show --stat --format='%s' HEAD
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Report snapshot failure
        if: failure()
        run: |
          {
            echo "## Reference snapshots failed"
            echo
            echo "The release is unaffected. Run the snapshot from docs/README.md by hand and open its pull request."
          } >> "${GITHUB_STEP_SUMMARY}"

  # Skipped test-* jobs would otherwise skip every job after create-releases.
  publish-java:
    name: Publish Java SDK
    needs: [plan, create-releases]
    if: ${{ !cancelled() && needs.create-releases.result == 'success' && needs.plan.outputs.java == 'true' }}
    uses: ./.github/workflows/sdk-java-publish.yml
    with:
      version: ${{ needs.plan.outputs.java_version }}
      # test-* above runs this component's suite when run_tests is on.
      run_tests: false
    secrets: inherit

  publish-python:
    name: Publish Python SDK
    needs: [plan, create-releases]
    if: ${{ !cancelled() && needs.create-releases.result == 'success' && needs.plan.outputs.python == 'true' }}
    uses: ./.github/workflows/sdk-python-publish.yml
    with:
      version: ${{ needs.plan.outputs.python_version }}
      # test-* above runs this component's suite when run_tests is on.
      run_tests: false
      publish: true
    secrets: inherit

  publish-rust:
    name: Publish Rust SDK
    needs: [plan, create-releases]
    if: ${{ !cancelled() && needs.create-releases.result == 'success' && needs.plan.outputs.rust == 'true' }}
    uses: ./.github/workflows/sdk-rust-publish.yml
    with:
      version: ${{ needs.plan.outputs.rust_version }}
      # test-* above runs this component's suite when run_tests is on.
      run_tests: false
      publish: true
    secrets: inherit

  publish-typescript:
    name: Publish TypeScript SDK
    needs: [plan, create-releases]
    if: ${{ !cancelled() && needs.create-releases.result == 'success' && needs.plan.outputs.typescript == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch trusted npm publisher
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.plan.outputs.typescript_version }}
          TYPESCRIPT_TAG: ${{ needs.plan.outputs.typescript_tag }}
        run: |
          title="Publish TypeScript SDK ${RELEASE_VERSION}"
          list_matching_run_ids() {
            gh run list \
              --repo "${GITHUB_REPOSITORY}" \
              --workflow sdk-typescript-publish.yml \
              --event workflow_dispatch \
              --commit "${GITHUB_SHA}" \
              --limit 50 \
              --json databaseId,displayTitle |
              jq -c --arg title "${title}" '[.[] | select(.displayTitle == $title) | .databaseId]'
          }
          # Earlier runs with the same title, such as dry runs of this commit, are never the new run.
          existing_run_ids="$(list_matching_run_ids)"
          # On the new tag, the publisher builds the released commit even if main moves on.
          gh workflow run sdk-typescript-publish.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref "${TYPESCRIPT_TAG}" \
            -f "version=${RELEASE_VERSION}"
          for _ in {1..30}; do
            run_id="$(list_matching_run_ids | jq -r --argjson existing "${existing_run_ids}" \
              '.[] | select(. as $id | $existing | index($id) | not)' | head -n 1)"
            if [[ -n "${run_id}" ]]; then
              echo "run_id=${run_id}" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            sleep 2
          done
          echo "Dispatched npm publisher run was not found" >&2
          exit 1
      - name: Wait for npm publication
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        run: gh run watch "${RUN_ID}" --repo "${GITHUB_REPOSITORY}" --exit-status

  # PyPI and npm trusted publishing match the top-level workflow, so the agents publishers are dispatched, not called.
  publish-agents:
    name: Publish ${{ matrix.publisher.name }}
    needs: [plan, create-releases]
    if: ${{ !cancelled() && needs.create-releases.result == 'success' && needs.plan.outputs.agents == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        publisher:
          - name: agents Python packages
            workflow: agents-python-publish.yml
          - name: agents TypeScript packages
            workflow: agents-typescript-publish.yml
    steps:
      - name: Dispatch trusted publisher
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          AGENTS_VERSION: ${{ needs.plan.outputs.agents_version }}
          AGENTS_TAG: ${{ needs.plan.outputs.agents_tag }}
          PUBLISHER_NAME: ${{ matrix.publisher.name }}
          PUBLISHER_WORKFLOW: ${{ matrix.publisher.workflow }}
          PYTHON_SKIP_PACKAGES: ${{ inputs.agents_python_skip_packages }}
        run: |
          title="Publish ${PUBLISHER_NAME} ${AGENTS_VERSION}"
          inputs=(-f "version=${AGENTS_VERSION}" -f "publish=true")
          if [[ "${PUBLISHER_WORKFLOW}" == "agents-python-publish.yml" && -n "${PYTHON_SKIP_PACKAGES}" ]]; then
            inputs+=(-f "skip_packages=${PYTHON_SKIP_PACKAGES}")
          fi
          list_matching_run_ids() {
            gh run list \
              --repo "${GITHUB_REPOSITORY}" \
              --workflow "${PUBLISHER_WORKFLOW}" \
              --event workflow_dispatch \
              --commit "${GITHUB_SHA}" \
              --limit 50 \
              --json databaseId,displayTitle |
              jq -c --arg title "${title}" '[.[] | select(.displayTitle == $title) | .databaseId]'
          }
          # Earlier runs with the same title, such as dry runs of this commit, are never the new run.
          existing_run_ids="$(list_matching_run_ids)"
          # On the new tag, the publishers build the released commit even if main moves on.
          gh workflow run "${PUBLISHER_WORKFLOW}" \
            --repo "${GITHUB_REPOSITORY}" \
            --ref "${AGENTS_TAG}" \
            "${inputs[@]}"
          for _ in {1..30}; do
            run_id="$(list_matching_run_ids | jq -r --argjson existing "${existing_run_ids}" \
              '.[] | select(. as $id | $existing | index($id) | not)' | head -n 1)"
            if [[ -n "${run_id}" ]]; then
              echo "run_id=${run_id}" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            sleep 2
          done
          echo "Dispatched ${PUBLISHER_WORKFLOW} run was not found" >&2
          exit 1
      - name: Wait for publication
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        run: gh run watch "${RUN_ID}" --repo "${GITHUB_REPOSITORY}" --exit-status

  publish-web:
    name: Publish Dex Web
    needs: [plan, create-releases]
    if: ${{ !cancelled() && needs.create-releases.result == 'success' && needs.plan.outputs.web == 'true' }}
    uses: ./.github/workflows/docker-image-web-release.yml
    with:
      version: ${{ needs.plan.outputs.web_version }}
      # test-* above runs this component's suite when run_tests is on.
      run_tests: false
    secrets: inherit

  # Runs after create-releases, so an sdk-go release in the same run is the version the module requires.
  publish-web-embedded:
    name: Publish embedded Dex Web Go module
    needs: [plan, create-releases]
    if: ${{ !cancelled() && needs.create-releases.result == 'success' && needs.plan.outputs.web == 'true' }}
    uses: ./.github/workflows/web-embedded-module-release.yml
    with:
      version: ${{ needs.plan.outputs.web_version }}
      # test-* above runs this component's suite when run_tests is on.
      run_tests: false
    secrets: inherit

  publish-cli:
    name: Publish CLI
    needs: [plan, create-releases]
    if: ${{ !cancelled() && needs.create-releases.result == 'success' && needs.plan.outputs.cli == 'true' }}
    uses: ./.github/workflows/cli-release.yml
    with:
      version: ${{ needs.plan.outputs.cli_version }}
      # test-* above runs this component's suite when run_tests is on.
      run_tests: false
      publish: true
    secrets: inherit

  # Registries are checked only here, after publishing, so their outages never fail a pull request.
  verify-compatibility-registries:
    name: Verify compatibility file versions
    needs: [plan, create-releases, publish-java, publish-python, publish-rust, publish-typescript, publish-cli, publish-agents]
    if: ${{ !cancelled() && needs.create-releases.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The check resolves release tags such as agents/v0.6.0, so it needs every tag.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Maven Central can take many minutes to show a new release, so it retries for up to 20 minutes.
      - name: Check every version the compatibility file lists
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 script/release/server_zd_compatibility.py verify-registries --attempts 20 --delay 60

  complete:
    name: Verify publications
    if: always() && needs.plan.result != 'skipped'
    needs:
      - plan
      - create-releases
      - publish-java
      - publish-python
      - publish-rust
      - publish-typescript
      - publish-web
      - publish-web-embedded
      - publish-cli
      - publish-agents
      - verify-compatibility-registries
    runs-on: ubuntu-latest
    steps:
      - name: Report results
        shell: bash
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          RELEASE_RESULT: ${{ needs.create-releases.result }}
          GO_SELECTED: ${{ needs.plan.outputs.go }}
          JAVA_SELECTED: ${{ needs.plan.outputs.java }}
          JAVA_RESULT: ${{ needs.publish-java.result }}
          PYTHON_SELECTED: ${{ needs.plan.outputs.python }}
          PYTHON_RESULT: ${{ needs.publish-python.result }}
          RUST_SELECTED: ${{ needs.plan.outputs.rust }}
          RUST_RESULT: ${{ needs.publish-rust.result }}
          TYPESCRIPT_SELECTED: ${{ needs.plan.outputs.typescript }}
          TYPESCRIPT_RESULT: ${{ needs.publish-typescript.result }}
          CLI_SELECTED: ${{ needs.plan.outputs.cli }}
          WEB_SELECTED: ${{ needs.plan.outputs.web }}
          WEB_RESULT: ${{ needs.publish-web.result }}
          WEB_EMBEDDED_RESULT: ${{ needs.publish-web-embedded.result }}
          CLI_RESULT: ${{ needs.publish-cli.result }}
          AGENTS_SELECTED: ${{ needs.plan.outputs.agents }}
          AGENTS_RESULT: ${{ needs.publish-agents.result }}
          COMPATIBILITY_RESULT: ${{ needs.verify-compatibility-registries.result }}
        run: |
          {
            echo "### Publication results"
            echo
            echo "| Component | Result |"
            echo "|---|---|"
            [[ "${GO_SELECTED}" == "true" ]] && echo "| Go SDK | released |" || echo "| Go SDK | skipped |"
            for result in \
              "Java SDK:${JAVA_SELECTED}:${JAVA_RESULT}" \
              "Python SDK:${PYTHON_SELECTED}:${PYTHON_RESULT}" \
              "Rust SDK:${RUST_SELECTED}:${RUST_RESULT}" \
              "TypeScript SDK:${TYPESCRIPT_SELECTED}:${TYPESCRIPT_RESULT}" \
              "Dex Web:${WEB_SELECTED}:${WEB_RESULT}" \
              "Embedded Dex Web Go module:${WEB_SELECTED}:${WEB_EMBEDDED_RESULT}" \
              "CLI:${CLI_SELECTED}:${CLI_RESULT}" \
              "Agents packages:${AGENTS_SELECTED}:${AGENTS_RESULT}" \
              "Compatibility file versions:true:${COMPATIBILITY_RESULT}"; do
              name="${result%%:*}"
              remainder="${result#*:}"
              selected="${remainder%%:*}"
              outcome="${remainder#*:}"
              [[ "${selected}" == "true" ]] || outcome="skipped"
              echo "| ${name} | ${outcome} |"
            done
          } >> "${GITHUB_STEP_SUMMARY}"

          if [[ "${PLAN_RESULT}" != "success" || "${RELEASE_RESULT}" != "success" ]]; then
            exit 1
          fi
          for result in \
            "${JAVA_SELECTED}:${JAVA_RESULT}" \
            "${PYTHON_SELECTED}:${PYTHON_RESULT}" \
            "${RUST_SELECTED}:${RUST_RESULT}" \
            "${TYPESCRIPT_SELECTED}:${TYPESCRIPT_RESULT}" \
            "${WEB_SELECTED}:${WEB_RESULT}" \
            "${WEB_SELECTED}:${WEB_EMBEDDED_RESULT}" \
            "${CLI_SELECTED}:${CLI_RESULT}" \
            "${AGENTS_SELECTED}:${AGENTS_RESULT}" \
            "true:${COMPATIBILITY_RESULT}"; do
            if [[ "${result%%:*}" == "true" && "${result#*:}" != "success" ]]; then
              exit 1
            fi
          done
