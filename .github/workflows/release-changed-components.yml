name: Release changed components

on:
  workflow_dispatch:
    inputs:
      version:
        description: Shared semantic version for every changed component
        required: true
        type: string
      agents_version:
        description: Agents packages version (tag agents/v<version>); empty skips the agents packages
        required: false
        default: ""
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-changed-components
  cancel-in-progress: false

jobs:
  plan:
    name: Plan releases
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      go: ${{ steps.plan.outputs.go }}
      go_tag: ${{ steps.plan.outputs.go_tag }}
      go_baseline: ${{ steps.plan.outputs.go_baseline }}
      rust: ${{ steps.plan.outputs.rust }}
      rust_tag: ${{ steps.plan.outputs.rust_tag }}
      rust_baseline: ${{ steps.plan.outputs.rust_baseline }}
      java: ${{ steps.plan.outputs.java }}
      java_tag: ${{ steps.plan.outputs.java_tag }}
      java_baseline: ${{ steps.plan.outputs.java_baseline }}
      python: ${{ steps.plan.outputs.python }}
      python_tag: ${{ steps.plan.outputs.python_tag }}
      python_baseline: ${{ steps.plan.outputs.python_baseline }}
      typescript: ${{ steps.plan.outputs.typescript }}
      typescript_tag: ${{ steps.plan.outputs.typescript_tag }}
      typescript_baseline: ${{ steps.plan.outputs.typescript_baseline }}
      web: ${{ steps.plan.outputs.web }}
      web_tag: ${{ steps.plan.outputs.web_tag }}
      web_baseline: ${{ steps.plan.outputs.web_baseline }}
      cli: ${{ steps.plan.outputs.cli }}
      cli_tag: ${{ steps.plan.outputs.cli_tag }}
      cli_baseline: ${{ steps.plan.outputs.cli_baseline }}
      agents: ${{ steps.plan.outputs.agents }}
      agents_tag: ${{ steps.plan.outputs.agents_tag }}
      agents_baseline: ${{ steps.plan.outputs.agents_baseline }}
      agents_version: ${{ steps.plan.outputs.agents_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify main branch
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          if [[ "${RELEASE_REF}" != "refs/heads/main" ]]; then
            echo "Changed-component releases can run only from main" >&2
            exit 1
          fi
      - name: Detect changes and preflight tags
        id: plan
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          AGENTS_VERSION: ${{ inputs.agents_version }}
        run: >-
          python3 script/release/changed_components.py "${RELEASE_VERSION}"
          --agents-version "${AGENTS_VERSION}" --output "${GITHUB_OUTPUT}"

  reject-non-main:
    name: Reject non-main dispatch
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Changed-component releases can run only from main" >&2
          exit 1

  create-releases:
    name: Create selected releases
    needs: plan
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Create GitHub Releases
        shell: bash
        env:
          GO_SELECTED: ${{ needs.plan.outputs.go }}
          GO_TAG: ${{ needs.plan.outputs.go_tag }}
          GO_BASELINE: ${{ needs.plan.outputs.go_baseline }}
          RUST_SELECTED: ${{ needs.plan.outputs.rust }}
          RUST_TAG: ${{ needs.plan.outputs.rust_tag }}
          RUST_BASELINE: ${{ needs.plan.outputs.rust_baseline }}
          JAVA_SELECTED: ${{ needs.plan.outputs.java }}
          JAVA_TAG: ${{ needs.plan.outputs.java_tag }}
          JAVA_BASELINE: ${{ needs.plan.outputs.java_baseline }}
          PYTHON_SELECTED: ${{ needs.plan.outputs.python }}
          PYTHON_TAG: ${{ needs.plan.outputs.python_tag }}
          PYTHON_BASELINE: ${{ needs.plan.outputs.python_baseline }}
          TYPESCRIPT_SELECTED: ${{ needs.plan.outputs.typescript }}
          TYPESCRIPT_TAG: ${{ needs.plan.outputs.typescript_tag }}
          TYPESCRIPT_BASELINE: ${{ needs.plan.outputs.typescript_baseline }}
          WEB_SELECTED: ${{ needs.plan.outputs.web }}
          WEB_TAG: ${{ needs.plan.outputs.web_tag }}
          WEB_BASELINE: ${{ needs.plan.outputs.web_baseline }}
          CLI_SELECTED: ${{ needs.plan.outputs.cli }}
          CLI_TAG: ${{ needs.plan.outputs.cli_tag }}
          CLI_BASELINE: ${{ needs.plan.outputs.cli_baseline }}
          AGENTS_SELECTED: ${{ needs.plan.outputs.agents }}
          AGENTS_TAG: ${{ needs.plan.outputs.agents_tag }}
          AGENTS_BASELINE: ${{ needs.plan.outputs.agents_baseline }}
        run: |
          selected=(
            "${GO_SELECTED}:${GO_TAG}:${GO_BASELINE}"
            "${RUST_SELECTED}:${RUST_TAG}:${RUST_BASELINE}"
            "${JAVA_SELECTED}:${JAVA_TAG}:${JAVA_BASELINE}"
            "${PYTHON_SELECTED}:${PYTHON_TAG}:${PYTHON_BASELINE}"
            "${TYPESCRIPT_SELECTED}:${TYPESCRIPT_TAG}:${TYPESCRIPT_BASELINE}"
            "${WEB_SELECTED}:${WEB_TAG}:${WEB_BASELINE}"
            "${CLI_SELECTED}:${CLI_TAG}:${CLI_BASELINE}"
            "${AGENTS_SELECTED}:${AGENTS_TAG}:${AGENTS_BASELINE}"
          )
          for release in "${selected[@]}"; do
            if [[ "${release%%:*}" == "true" ]]; then
              release="${release#*:}"
              tag="${release%%:*}"
              baseline="${release#*:}"
              generated_notes="$(mktemp)"
              release_notes="$(mktemp)"
              arguments=(--method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" -f "tag_name=${tag}" -f "target_commitish=${GITHUB_SHA}")
              if [[ -n "${baseline}" ]]; then
                arguments+=(-f "previous_tag_name=${baseline}")
              fi
              gh api "${arguments[@]}" --jq .body > "${generated_notes}"
              {
                printf '## Breaking Changes\n\nNone.\n\n'
                cat "${generated_notes}"
              } > "${release_notes}"
              gh release create "${tag}" --target "${GITHUB_SHA}" --title "${tag}" --notes-file "${release_notes}"
            fi
          done

  publish-java:
    name: Publish Java SDK
    needs: [plan, create-releases]
    if: needs.plan.outputs.java == 'true'
    uses: ./.github/workflows/sdk-java-publish.yml
    with:
      version: ${{ needs.plan.outputs.version }}
    secrets: inherit

  publish-python:
    name: Publish Python SDK
    needs: [plan, create-releases]
    if: needs.plan.outputs.python == 'true'
    uses: ./.github/workflows/sdk-python-publish.yml
    with:
      version: ${{ needs.plan.outputs.version }}
      publish: true
    secrets: inherit

  publish-rust:
    name: Publish Rust SDK
    needs: [plan, create-releases]
    if: needs.plan.outputs.rust == 'true'
    uses: ./.github/workflows/sdk-rust-publish.yml
    with:
      version: ${{ needs.plan.outputs.version }}
      publish: true
    secrets: inherit

  publish-typescript:
    name: Publish TypeScript SDK
    needs: [plan, create-releases]
    if: needs.plan.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch trusted npm publisher
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          title="Publish TypeScript SDK ${RELEASE_VERSION}"
          gh workflow run sdk-typescript-publish.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main \
            -f "version=${RELEASE_VERSION}"
          for _ in {1..30}; do
            run_id="$({
              gh run list \
                --repo "${GITHUB_REPOSITORY}" \
                --workflow sdk-typescript-publish.yml \
                --event workflow_dispatch \
                --branch main \
                --limit 20 \
                --json databaseId,displayTitle
            } | jq -r --arg title "${title}" \
              '.[] | select(.displayTitle == $title) | .databaseId' | head -n 1)"
            if [[ -n "${run_id}" ]]; then
              echo "run_id=${run_id}" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            sleep 2
          done
          echo "Dispatched npm publisher run was not found" >&2
          exit 1
      - name: Wait for npm publication
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        run: gh run watch "${RUN_ID}" --repo "${GITHUB_REPOSITORY}" --exit-status

  # PyPI and npm trusted publishing match the top-level workflow, so the agents publishers are dispatched, not called.
  publish-agents:
    name: Publish ${{ matrix.publisher.name }}
    needs: [plan, create-releases]
    if: needs.plan.outputs.agents == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        publisher:
          - name: agents Python packages
            workflow: agents-python-publish.yml
          - name: agents TypeScript packages
            workflow: agents-typescript-publish.yml
    steps:
      - name: Dispatch trusted publisher
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          AGENTS_VERSION: ${{ needs.plan.outputs.agents_version }}
          PUBLISHER_NAME: ${{ matrix.publisher.name }}
          PUBLISHER_WORKFLOW: ${{ matrix.publisher.workflow }}
        run: |
          title="Publish ${PUBLISHER_NAME} ${AGENTS_VERSION}"
          gh workflow run "${PUBLISHER_WORKFLOW}" \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main \
            -f "version=${AGENTS_VERSION}" \
            -f "publish=true"
          for _ in {1..30}; do
            run_id="$({
              gh run list \
                --repo "${GITHUB_REPOSITORY}" \
                --workflow "${PUBLISHER_WORKFLOW}" \
                --event workflow_dispatch \
                --branch main \
                --limit 20 \
                --json databaseId,displayTitle
            } | jq -r --arg title "${title}" \
              '.[] | select(.displayTitle == $title) | .databaseId' | head -n 1)"
            if [[ -n "${run_id}" ]]; then
              echo "run_id=${run_id}" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            sleep 2
          done
          echo "Dispatched ${PUBLISHER_WORKFLOW} run was not found" >&2
          exit 1
      - name: Wait for publication
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        run: gh run watch "${RUN_ID}" --repo "${GITHUB_REPOSITORY}" --exit-status

  publish-web:
    name: Publish Dex Web
    needs: [plan, create-releases]
    if: needs.plan.outputs.web == 'true'
    uses: ./.github/workflows/docker-image-web-release.yml
    with:
      version: ${{ needs.plan.outputs.version }}
    secrets: inherit

  publish-cli:
    name: Publish CLI
    needs: [plan, create-releases]
    if: needs.plan.outputs.cli == 'true'
    uses: ./.github/workflows/cli-release.yml
    with:
      version: ${{ needs.plan.outputs.version }}
      publish: true
    secrets: inherit

  complete:
    name: Verify publications
    if: always() && needs.plan.result != 'skipped'
    needs:
      - plan
      - create-releases
      - publish-java
      - publish-python
      - publish-rust
      - publish-typescript
      - publish-web
      - publish-cli
      - publish-agents
    runs-on: ubuntu-latest
    steps:
      - name: Report results
        shell: bash
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          RELEASE_RESULT: ${{ needs.create-releases.result }}
          GO_SELECTED: ${{ needs.plan.outputs.go }}
          JAVA_SELECTED: ${{ needs.plan.outputs.java }}
          JAVA_RESULT: ${{ needs.publish-java.result }}
          PYTHON_SELECTED: ${{ needs.plan.outputs.python }}
          PYTHON_RESULT: ${{ needs.publish-python.result }}
          RUST_SELECTED: ${{ needs.plan.outputs.rust }}
          RUST_RESULT: ${{ needs.publish-rust.result }}
          TYPESCRIPT_SELECTED: ${{ needs.plan.outputs.typescript }}
          TYPESCRIPT_RESULT: ${{ needs.publish-typescript.result }}
          CLI_SELECTED: ${{ needs.plan.outputs.cli }}
          WEB_SELECTED: ${{ needs.plan.outputs.web }}
          WEB_RESULT: ${{ needs.publish-web.result }}
          CLI_RESULT: ${{ needs.publish-cli.result }}
          AGENTS_SELECTED: ${{ needs.plan.outputs.agents }}
          AGENTS_RESULT: ${{ needs.publish-agents.result }}
        run: |
          {
            echo "### Publication results"
            echo
            echo "| Component | Result |"
            echo "|---|---|"
            [[ "${GO_SELECTED}" == "true" ]] && echo "| Go SDK | released |" || echo "| Go SDK | skipped |"
            for result in \
              "Java SDK:${JAVA_SELECTED}:${JAVA_RESULT}" \
              "Python SDK:${PYTHON_SELECTED}:${PYTHON_RESULT}" \
              "Rust SDK:${RUST_SELECTED}:${RUST_RESULT}" \
              "TypeScript SDK:${TYPESCRIPT_SELECTED}:${TYPESCRIPT_RESULT}" \
              "Dex Web:${WEB_SELECTED}:${WEB_RESULT}" \
              "CLI:${CLI_SELECTED}:${CLI_RESULT}" \
              "Agents packages:${AGENTS_SELECTED}:${AGENTS_RESULT}"; do
              name="${result%%:*}"
              remainder="${result#*:}"
              selected="${remainder%%:*}"
              outcome="${remainder#*:}"
              [[ "${selected}" == "true" ]] || outcome="skipped"
              echo "| ${name} | ${outcome} |"
            done
          } >> "${GITHUB_STEP_SUMMARY}"

          if [[ "${PLAN_RESULT}" != "success" || "${RELEASE_RESULT}" != "success" ]]; then
            exit 1
          fi
          for result in \
            "${JAVA_SELECTED}:${JAVA_RESULT}" \
            "${PYTHON_SELECTED}:${PYTHON_RESULT}" \
            "${RUST_SELECTED}:${RUST_RESULT}" \
            "${TYPESCRIPT_SELECTED}:${TYPESCRIPT_RESULT}" \
            "${WEB_SELECTED}:${WEB_RESULT}" \
            "${CLI_SELECTED}:${CLI_RESULT}" \
            "${AGENTS_SELECTED}:${AGENTS_RESULT}"; do
            if [[ "${result%%:*}" == "true" && "${result#*:}" != "success" ]]; then
              exit 1
            fi
          done
