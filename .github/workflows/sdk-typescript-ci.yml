name: TypeScript SDK CI

on:
  push:
    branches: [main]
    paths:
      - "sdk-typescript/**"
      - ".github/workflows/sdk-typescript-ci.yml"
  pull_request:
    paths:
      - "sdk-typescript/**"
      - ".github/workflows/sdk-typescript-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-typescript-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: User contracts (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    defaults:
      run:
        working-directory: sdk-typescript
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: sdk-typescript/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check static types
        run: npm run typecheck
      - name: Test contracts
        run: npm test
