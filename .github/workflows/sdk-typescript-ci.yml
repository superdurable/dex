name: TypeScript SDK CI

on:
  push:
    branches: [main]
    paths:
      - "sdk-typescript/**"
      - "cli/**"
      - "server/**"
      - "protos/**"
      - "web/**"
      - ".github/workflows/sdk-typescript-ci.yml"
  pull_request:
    paths:
      - "sdk-typescript/**"
      - "cli/**"
      - "server/**"
      - "protos/**"
      - "web/**"
      - ".github/workflows/sdk-typescript-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-typescript-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: User contracts (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    defaults:
      run:
        working-directory: sdk-typescript
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: sdk-typescript/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check static types
        run: npm run typecheck
      - name: Test contracts
        run: npm test

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: sdk-typescript
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            sdk-typescript/package-lock.json
            web/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: |
            cli/go.sum
            server/go.sum
      - name: Install Temporal CLI runtime
        uses: temporalio/setup-temporal@v0
      - name: Install dependencies
        run: npm ci
      - name: Run integration tests with dexcli dev
        run: ./run-integration-tests.sh
      - name: Upload service logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sdk-typescript-integration-services
          path: /tmp/test-typescript-sdk-integration-services.log
          if-no-files-found: ignore
