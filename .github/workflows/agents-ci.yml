name: Agents CI

on:
  pull_request:
    paths:
      - "agents/**"
      - ".github/workflows/agents-ci.yml"
      - ".github/workflows/agents-python-publish.yml"
      - ".github/workflows/agents-typescript-publish.yml"
  workflow_dispatch:
  # Main CI (all) and release workflows call this suite on main and release commits.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: agents-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DEXCLI_RELEASE_TAG: cli-v1.46.1
  DEXCLI_ARCHIVE: dexcli_v1.46.1_linux_amd64.tar.gz

jobs:
  discover:
    name: Discover agent packages
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.discover.outputs.packages }}
    steps:
      # Depth 2 includes the merge commit's first parent, the pull request base.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Test the package selection
        run: python3 agents/script/select_ci_packages_test.py
      # A pull request tests the packages it changes and their dependents; other runs test every package.
      - name: Select the packages this change can affect
        id: select
        env:
          IS_PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail
          if [[ "$IS_PULL_REQUEST" == "true" ]]; then
            git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed-files.txt"
            selected="$(python3 agents/script/select_ci_packages.py --changed-files "$RUNNER_TEMP/changed-files.txt")"
          else
            selected="$(python3 agents/script/select_ci_packages.py)"
          fi
          echo "selected=$selected" >> "$GITHUB_OUTPUT"
          jq . <<<"$selected"
      # Every package with an executable agents/<language>/<package>/ci.sh or
      # agents/cli/<language>/<package>/ci.sh gets a matrix job when selected.
      - name: List packages with an executable ci.sh
        id: discover
        env:
          SELECTED_PACKAGES: ${{ steps.select.outputs.selected }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          package_paths=()
          for script in agents/*/*/ci.sh agents/cli/*/*/ci.sh; do
            if [[ ! -x "$script" ]]; then
              echo "::error file=$script::$script is not executable; run chmod +x and commit it"
              exit 1
            fi
            package_paths+=("$(dirname "$script")")
          done
          if (( ${#package_paths[@]} == 0 )); then
            echo "::error::found no agents/<language>/<package>/ci.sh"
            exit 1
          fi
          packages="$(printf '%s\n' "${package_paths[@]}" | jq -R -s -c --argjson selected "$SELECTED_PACKAGES" '
            split("\n")
            | map(select(length > 0))
            | map(select(. as $path | $selected | index($path)))
            | map(if (split("/") | length) == 4
                  then {path: ., language: (split("/")[2]), name: ("cli-" + split("/")[3])}
                  else {path: ., language: (split("/")[1]), name: (split("/")[2])}
                  end)
            | map(. as $package
                  | if .language == "typescript"
                    then ("22", "26") as $node | $package + {node: $node}
                    else $package + {node: "22"}
                    end)
            | map(. + {label: (if .node == "22" then .path else (.path + " (node " + .node + ")") end)})
            | map(. as $package
                  | ({"agents/python/core": 3}[.path] // 1) as $count
                  | range(1; $count + 1) as $index
                  | $package + {shard: "\($index)/\($count)", shard_name: "\($index)-of-\($count)"}
                  | if $count == 1 then . else .label += " (shard \(.shard))" end)
          ')"
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          jq . <<<"$packages"

  package:
    name: ${{ matrix.package.label }}
    needs: discover
    # A change that no package reads, such as agents/CHANGELOG.md, selects no package.
    if: needs.discover.outputs.packages != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.discover.outputs.packages) }}
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.2"
          python-version: "3.11"
          working-directory: ${{ matrix.package.path }}
          enable-cache: ${{ matrix.package.language == 'python' }}
      # A Go package's cross-language tests run the TypeScript core too.
      - name: Install Node
        if: matrix.package.language == 'typescript' || matrix.package.language == 'go'
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.package.node }}
      # Pi's grep and find run rg and fd. PI_OFFLINE makes a missing one fail instead of downloading it.
      - name: Install rg and fd for Pi
        if: matrix.package.path == 'agents/cli/typescript/pi'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ripgrep fd-find
          sudo ln -sf "$(command -v fdfind)" /usr/local/bin/fd
          rg --version
          fd --version
          echo "PI_OFFLINE=1" >> "$GITHUB_ENV"
      - name: Install Go
        if: matrix.package.language == 'go'
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.package.path }}/go.mod
          cache-dependency-path: ${{ matrix.package.path }}/go.sum
      - name: Download and verify dexcli
        env:
          GH_TOKEN: ${{ github.token }}
          DEXCLI_DIR: ${{ runner.temp }}/dexcli
        run: |
          set -euo pipefail
          mkdir -p "$DEXCLI_DIR"
          cd "$DEXCLI_DIR"
          gh release download "$DEXCLI_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$DEXCLI_ARCHIVE" \
            --pattern checksums.txt
          if ! grep -E "^[0-9a-f]{64}  (\./)?${DEXCLI_ARCHIVE//./\\.}\$" checksums.txt > archive.sha256; then
            echo "checksums.txt has no entry for $DEXCLI_ARCHIVE"
            exit 1
          fi
          sha256sum --check --strict archive.sha256
          tar -xzf "$DEXCLI_ARCHIVE"
          test -x dexcli && test -x dex-server-zd
          ./dexcli --version
          echo "DEXCLI=$DEXCLI_DIR/dexcli" >> "$GITHUB_ENV"
      - name: Run ci.sh
        working-directory: ${{ matrix.package.path }}
        env:
          DEX_AGENTS_CI_SHARD: ${{ matrix.package.shard }}
        run: ./ci.sh
      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: agents-${{ matrix.package.language }}-${{ matrix.package.name }}-node${{ matrix.package.node }}-shard${{ matrix.package.shard_name }}-logs
          path: /tmp/pytest-of-*/pytest-*/**/*.log
          if-no-files-found: ignore

  built-packages:
    name: Built-package smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.2"
          python-version: "3.11"
          working-directory: agents/python/core
      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Download and verify dexcli
        env:
          GH_TOKEN: ${{ github.token }}
          DEXCLI_DIR: ${{ runner.temp }}/dexcli
        run: |
          set -euo pipefail
          mkdir -p "$DEXCLI_DIR"
          cd "$DEXCLI_DIR"
          gh release download "$DEXCLI_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$DEXCLI_ARCHIVE" \
            --pattern checksums.txt
          if ! grep -E "^[0-9a-f]{64}  (\./)?${DEXCLI_ARCHIVE//./\\.}\$" checksums.txt > archive.sha256; then
            echo "checksums.txt has no entry for $DEXCLI_ARCHIVE"
            exit 1
          fi
          sha256sum --check --strict archive.sha256
          tar -xzf "$DEXCLI_ARCHIVE"
          ./dexcli --version
          echo "DEXCLI=$DEXCLI_DIR/dexcli" >> "$GITHUB_ENV"
      - name: Check that every package carries one version
        run: |
          version="$(uv run --no-project --python 3.11 python -c 'import tomllib; print(tomllib.load(open("agents/python/core/pyproject.toml", "rb"))["project"]["version"])')"
          uv run --no-project --python 3.11 python agents/script/stamp_agents_release_version.py "$version" --check
      - name: Build, install, and run the built packages
        run: agents/script/smoke-test-built-packages.sh all
