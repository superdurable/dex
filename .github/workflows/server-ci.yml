name: Server CI

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "protos/**"
      - ".github/scripts/dump-docker-logs.sh"
      - ".github/workflows/server-ci.yml"
  pull_request:
    paths:
      - "server/**"
      - "protos/**"
      - ".github/scripts/dump-docker-logs.sh"
      - ".github/workflows/server-ci.yml"
  workflow_dispatch:

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Unit tests
        env:
          GOWORK: "off"
        run: make unitTests

  web-api-integ:
    name: Web API integration (${{ matrix.backend }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: temporal
            compose_file: docker-compose/ci-temporal-dependencies.yml
            make_target: ci-web-api-temporal-test
          - backend: cadence
            compose_file: docker-compose/ci-cadence-dependencies.yml
            make_target: ci-web-api-cadence-test
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Start ${{ matrix.backend }} dependencies
        run: docker compose -f ${{ matrix.compose_file }} up -d
      - name: Wait for Temporal search attributes
        if: matrix.backend == 'temporal'
        run: |
          echo "Waiting for search attributes registration..."
          for i in $(seq 1 90); do
            if docker logs temporal-admin-tools 2>&1 | grep -q "All search attributes are registered"; then
              echo "Search attributes ready (attempt $i)"
              sleep 2
              exit 0
            fi
            sleep 2
          done
          echo "Timed out waiting for search attributes"
          docker logs temporal-admin-tools 2>&1 | tail -40 || true
          exit 1
      - name: Web API integration tests
        env:
          GOWORK: "off"
        run: make ${{ matrix.make_target }}
      - name: Dump docker logs
        if: always()
        run: bash "$GITHUB_WORKSPACE/.github/scripts/dump-docker-logs.sh"

  temporal-integ:
    name: Temporal integration (partition ${{ matrix.partition }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        partition: [0, 1, 2, 3, 4]
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Start Temporal dependencies
        run: docker compose -f docker-compose/ci-temporal-dependencies.yml up -d
      - name: Wait for Temporal search attributes
        run: |
          echo "Waiting for search attributes registration..."
          for i in $(seq 1 90); do
            if docker logs temporal-admin-tools 2>&1 | grep -q "All search attributes are registered"; then
              echo "Search attributes ready (attempt $i)"
              sleep 2
              exit 0
            fi
            sleep 2
          done
          echo "Timed out waiting for search attributes"
          docker logs temporal-admin-tools 2>&1 | tail -40 || true
          exit 1
      - name: Temporal integ tests
        env:
          GOWORK: "off"
        run: make ci-temporal-integ-test totalPartitions=5 partitionNum=${{ matrix.partition }}
      - name: Dump docker logs
        if: always()
        run: bash "$GITHUB_WORKSPACE/.github/scripts/dump-docker-logs.sh"

  cadence-integ:
    name: Cadence integration (partition ${{ matrix.partition }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        partition: [0, 1, 2, 3, 4]
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Start Cadence dependencies
        run: docker compose -f docker-compose/ci-cadence-dependencies.yml up -d
      - name: Cadence integ tests
        env:
          GOWORK: "off"
        run: make ci-cadence-integ-test totalPartitions=5 partitionNum=${{ matrix.partition }}
      - name: Dump docker logs
        if: always()
        run: bash "$GITHUB_WORKSPACE/.github/scripts/dump-docker-logs.sh"
