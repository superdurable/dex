name: Web CI

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "packages/flow-definition-renderer/**"
      - "docs/src/data/flow-definitions/**"
      - "protos/**"
      - "sdk-go/**"
      - ".github/workflows/web-ci.yml"
  pull_request:
    paths:
      - "web/**"
      - "packages/flow-definition-renderer/**"
      - "docs/src/data/flow-definitions/**"
      - "protos/**"
      - "sdk-go/**"
      - ".github/workflows/web-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, tests, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: web/go.mod
          cache-dependency-path: |
            web/go.sum
            sdk-go/go.sum
      - name: Install
        run: npm ci
      - name: Check
        run: npm run check
      - name: Build
        run: npm run build
      - name: Go integration tests
        env:
          GOWORK: "off"
        run: make test

  server-zd-e2e:
    name: Dex Web on server-zd
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # A released server-zd binary keeps this job free of a Rust build.
      DEX_SERVER_ZD_RELEASE: server-zd/v0.1.1
      # Update with DEX_SERVER_ZD_RELEASE; it is the linux_amd64 line of that release's checksums.txt.
      DEX_SERVER_ZD_LINUX_AMD64_SHA256: c15897490889b70fb6c9e16e8221c1aabea6ffd7eebb4e47fbbad8123ab233de
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: web/go.mod
          cache-dependency-path: |
            web/go.sum
            sdk-go/go.sum
            cli/go.sum
      - name: Build Dex Web assets
        working-directory: web
        run: npm ci && npm run build
      - name: Download server-zd
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          download_dir="$RUNNER_TEMP/server-zd"
          archive="dex-server-zd_${DEX_SERVER_ZD_RELEASE#server-zd/}_linux_amd64.tar.gz"
          gh release download "$DEX_SERVER_ZD_RELEASE" --repo "$GITHUB_REPOSITORY" \
            --pattern "$archive" --pattern checksums.txt --dir "$download_dir"
          (cd "$download_dir" && sha256sum --check --ignore-missing checksums.txt)
          echo "$DEX_SERVER_ZD_LINUX_AMD64_SHA256  $download_dir/$archive" | sha256sum --check -
          tar -xzf "$download_dir/$archive" -C "$download_dir"
          echo "DEX_SERVER_ZD_BINARY=$download_dir/dex-server-zd" >> "$GITHUB_ENV"
      - name: Run Dex Web end-to-end tests against server-zd
        run: web/scripts/run-server-zd-e2e.sh

  standalone-image:
    name: Dex Web image
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build standalone Web image
        run: docker build -f web/Dockerfile -t dex-web-image-test .
      - name: Verify version and CA bundle
        run: |
          docker run --rm dex-web-image-test --version
          docker run --rm --entrypoint test dex-web-image-test -s /etc/ssl/certs/ca-certificates.crt
      - name: Verify standalone HTTP server
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name dex-web-smoke -p 18804:8802 dex-web-image-test
          trap 'docker rm -f dex-web-smoke >/dev/null' EXIT
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18804/healthz; then
              curl --fail --silent http://127.0.0.1:18804/ | grep -F '<div id="root"></div>'
              exit 0
            fi
            sleep 1
          done
          docker logs dex-web-smoke
          exit 1
