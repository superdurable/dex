name: Web CI

on:
  pull_request:
    paths:
      - "web/**"
      - "packages/flow-definition-renderer/**"
      - "docs/src/data/flow-definitions/**"
      - "agents/conformance/session_graph.json"
      - "protos/**"
      - "sdk-go/**"
      - "script/release/*embedded_web_module.py"
      - ".github/workflows/web-ci.yml"
      - ".github/workflows/web-embedded-module-release.yml"
  workflow_dispatch:
  # Main CI (all) and release workflows call this suite on main and release commits.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: web-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Typecheck, tests, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          # The embedded module check needs the sdk-go release tags.
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: web/go.mod
          cache-dependency-path: |
            web/go.sum
            sdk-go/go.sum
      - name: Install
        run: npm ci
      - name: Check
        run: npm run check
      - name: Build
        run: npm run build
      - name: Go integration tests
        env:
          GOWORK: "off"
        run: make test
      - name: Embedded module builds in a host module
        run: python3 ../script/release/check_embedded_web_module.py --skip-if-sdk-go-unreleased

  server-zd-e2e:
    name: Dex Web on server-zd
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # The repository SDK needs the repository server-zd protocol version.
      DEX_SERVER_ZD_BINARY: ${{ github.workspace }}/server-zd/target/debug/dex-server-zd
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      RUSTUP_TOOLCHAIN: "1.97.1"
      CARGO_BUILD_JOBS: "4"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: web/go.mod
          cache-dependency-path: |
            web/go.sum
            sdk-go/go.sum
            cli/go.sum
      - name: Build Dex Web assets
        working-directory: web
        run: npm ci && npm run build
      - name: Install Rust
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Install libclang for RocksDB
        run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server-zd
          shared-key: server-zd-paradedb
          save-if: false
      - name: Build dex-server-zd
        working-directory: server-zd
        run: cargo build --locked -p dexzd-server --bin dex-server-zd
      - name: Run Dex Web end-to-end tests against server-zd
        run: web/scripts/run-server-zd-e2e.sh

  standalone-image:
    name: Dex Web image
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build standalone Web image
        run: docker build -f web/Dockerfile -t dex-web-image-test .
      - name: Verify version and CA bundle
        run: |
          docker run --rm dex-web-image-test --version
          docker run --rm --entrypoint test dex-web-image-test -s /etc/ssl/certs/ca-certificates.crt
      - name: Verify standalone HTTP server
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name dex-web-smoke -p 18804:8802 dex-web-image-test
          trap 'docker rm -f dex-web-smoke >/dev/null' EXIT
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18804/healthz; then
              curl --fail --silent http://127.0.0.1:18804/ | grep -F '<div id="root"></div>'
              exit 0
            fi
            sleep 1
          done
          docker logs dex-web-smoke
          exit 1
