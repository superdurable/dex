name: Web CI

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "packages/flow-definition-renderer/**"
      - "docs/src/data/flow-definitions/**"
      - "server/**"
      - "protos/**"
      - "sdk-go/integ/main_test.go"
      - "sdk-go/integ/web*"
      - "sdk-go/integ/webv2*/**"
      - ".github/workflows/web-ci.yml"
  pull_request:
    paths:
      - "web/**"
      - "packages/flow-definition-renderer/**"
      - "docs/src/data/flow-definitions/**"
      - "server/**"
      - "protos/**"
      - "sdk-go/integ/main_test.go"
      - "sdk-go/integ/web*"
      - "sdk-go/integ/webv2*/**"
      - ".github/workflows/web-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, tests, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: web/go.mod
          cache-dependency-path: |
            web/go.sum
            server/go.sum
            server/cmd/server/go.sum
      - name: Install
        run: npm ci
      - name: Check
        run: npm run check
      - name: Build
        run: npm run build
      - name: Go integration tests
        env:
          GOWORK: "off"
        run: make test
      - name: Dex Server Web integration tests
        working-directory: server
        env:
          GOWORK: "off"
        run: make serverCommandIntegTests

  server-zd-e2e:
    name: Dex Web on server-zd
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # A released server-zd binary keeps this job free of a Rust build.
      DEX_SERVER_ZD_RELEASE: server-zd/v0.1.1
      # Update with DEX_SERVER_ZD_RELEASE; it is the linux_amd64 line of that release's checksums.txt.
      DEX_SERVER_ZD_LINUX_AMD64_SHA256: c15897490889b70fb6c9e16e8221c1aabea6ffd7eebb4e47fbbad8123ab233de
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/cmd/server/go.mod
          cache-dependency-path: |
            web/go.sum
            server/go.sum
            server/cmd/server/go.sum
            cli/go.sum
            sdk-go/go.sum
      - name: Build Dex Web assets
        working-directory: web
        run: npm ci && npm run build
      - name: Download server-zd
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          download_dir="$RUNNER_TEMP/server-zd"
          archive="dex-server-zd_${DEX_SERVER_ZD_RELEASE#server-zd/}_linux_amd64.tar.gz"
          gh release download "$DEX_SERVER_ZD_RELEASE" --repo "$GITHUB_REPOSITORY" \
            --pattern "$archive" --pattern checksums.txt --dir "$download_dir"
          (cd "$download_dir" && sha256sum --check --ignore-missing checksums.txt)
          echo "$DEX_SERVER_ZD_LINUX_AMD64_SHA256  $download_dir/$archive" | sha256sum --check -
          tar -xzf "$download_dir/$archive" -C "$download_dir"
          echo "DEX_SERVER_ZD_BINARY=$download_dir/dex-server-zd" >> "$GITHUB_ENV"
      - name: Run Dex Web end-to-end tests against server-zd
        run: web/scripts/run-server-zd-e2e.sh

  docker-image:
    name: Dex Server image
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -f server/Dockerfile -t dex-server-image-test .
      - name: Verify system CA bundle
        run: docker run --rm --entrypoint test dex-server-image-test -s /etc/ssl/certs/ca-certificates.crt
      - name: Start Temporal dependencies
        run: docker compose -p dex-server-image-test -f server/docker-compose/ci-temporal-dependencies.yml up -d
      - name: Test default and Web-only modes
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            docker rm -f dex-server-default dex-server-web-only >/dev/null 2>&1 || true
            docker compose -p dex-server-image-test -f server/docker-compose/ci-temporal-dependencies.yml down -v >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run -d --name dex-server-default \
            --network testing-network \
            -p 18801:8801 -p 18802:8802 \
            dex-server-image-test
          api_response_file="$(mktemp)"
          for attempt in {1..120}; do
            if (echo >/dev/tcp/127.0.0.1/18801) >/dev/null 2>&1 \
              && curl --fail --silent --max-time 5 http://127.0.0.1:18802/healthz >/dev/null \
              && curl --fail --silent --max-time 5 \
                --header 'Content-Type: application/json' \
                --data '{"pageSize":1}' \
                http://127.0.0.1:18802/api/flows/search >"${api_response_file}" \
              && grep --quiet '"flows"' "${api_response_file}"; then
              break
            fi
            if [[ "${attempt}" = "120" ]]; then
              docker logs dex-server-default
              cat "${api_response_file}"
              exit 1
            fi
            sleep 1
          done
          if ! default_server_processes="$(docker top dex-server-default -eo pid,args)"; then
            echo "Cannot inspect the default Server image process"
            docker logs dex-server-default
            exit 1
          fi
          printf '%s\n' "${default_server_processes}"
          default_server_process_count="$(
            awk 'NR > 1 && /\/dex\/dex-server/ && !seen[$1]++ { count++ } END { print count + 0 }' \
              <<<"${default_server_processes}"
          )"
          if [[ "${default_server_process_count}" -ne 1 ]]; then
            echo "Expected one default Server image process, found ${default_server_process_count}"
            docker logs dex-server-default
            exit 1
          fi

          homepage_response_file="$(mktemp)"
          if ! curl --fail --silent --show-error --max-time 5 http://127.0.0.1:18802/ >"${homepage_response_file}"; then
            echo "Cannot request the default Server image homepage"
            docker logs dex-server-default
            exit 1
          fi
          if ! grep --fixed-strings --quiet '<div id="root"></div>' "${homepage_response_file}"; then
            echo "Default Server image homepage did not include the Dex Web root element"
            cat "${homepage_response_file}"
            docker logs dex-server-default
            exit 1
          fi

          docker rm -f dex-server-default >/dev/null
          docker run -d --name dex-server-web-only \
            -p 18802:8802 \
            dex-server-image-test --services=web
          for attempt in {1..120}; do
            if curl --fail --silent --max-time 5 http://127.0.0.1:18802/healthz >/dev/null; then
              break
            fi
            if [[ "${attempt}" = "120" ]]; then
              docker logs dex-server-web-only
              exit 1
            fi
            sleep 1
          done

  standalone-image:
    name: Dex Web image
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build standalone Web image
        run: docker build -f web/Dockerfile -t dex-web-image-test .
      - name: Verify version and CA bundle
        run: |
          docker run --rm dex-web-image-test --version
          docker run --rm --entrypoint test dex-web-image-test -s /etc/ssl/certs/ca-certificates.crt
      - name: Verify standalone HTTP server
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name dex-web-smoke -p 18804:8802 dex-web-image-test
          trap 'docker rm -f dex-web-smoke >/dev/null' EXIT
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18804/healthz; then
              curl --fail --silent http://127.0.0.1:18804/ | grep -F '<div id="root"></div>'
              exit 0
            fi
            sleep 1
          done
          docker logs dex-web-smoke
          exit 1
