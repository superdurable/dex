name: Server ZD binary release

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      version:
        description: Server ZD semantic version without the v prefix
        required: true
        type: string
  pull_request:
    paths:
      - .github/workflows/server-zd-binary-release.yml
      - server-zd/LICENSE.md
      - server-zd/LEGACY_NOTICES.md
      - server-zd/LICENSES/**
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and smoke test binaries without publishing
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: server-zd-binary-release-${{ github.event.release.tag_name || (inputs.version && format('server-zd/v{0}', inputs.version)) || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  metadata:
    name: Resolve binary version
    if: inputs.version != '' || github.event_name != 'release' || startsWith(github.event.release.tag_name, 'server-zd/v')
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve version and publishing mode
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_VERSION}" ]]; then
            base_version="${INPUT_VERSION}"
            publish=true
          elif [[ "${EVENT_NAME}" == "release" ]]; then
            base_version="${RELEASE_TAG#server-zd/v}"
            publish=true
          else
            if [[ "${GITHUB_REF}" == refs/tags/server-zd/v* ]]; then
              base_version="${GITHUB_REF#refs/tags/server-zd/v}"
            else
              base_version="$(python3 -c 'import tomllib; print(tomllib.load(open("server-zd/Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
            fi
            publish=false
            if [[ "${EVENT_NAME}" == "workflow_dispatch" && "${DRY_RUN}" == "false" ]]; then
              if [[ "${GITHUB_REF}" != refs/tags/server-zd/v* ]]; then
                echo 'Publishing requires selecting a server-zd/vX.Y.Z tag' >&2
                exit 1
              fi
              publish=true
            fi
          fi
          if [[ ! "${base_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid server-zd binary version: ${base_version}" >&2
            exit 1
          fi
          if [[ "${publish}" == true ]]; then
            gh release view "server-zd/v${base_version}" >/dev/null
          fi
          version="${base_version}"
          if [[ "${publish}" != true ]]; then
            version="${base_version}-smoke.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "publish=${publish}" >> "${GITHUB_OUTPUT}"
      # Every later job needs metadata, so this stops the assets, the release upload, and the snapshot.
      - name: Require the change-log entry on the tagged commit
        if: steps.version.outputs.publish == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if ! python3 script/release/changelog_fragments.py check-ready server "${VERSION}"; then
            message="The change-log entry for server-zd/v${VERSION} must be merged to main before the tag. Delete the release and its tag, merge the release-prep pull request, then tag again."
            echo "::error::${message}"
            {
              echo "## Change log not ready for server-zd ${VERSION}"
              echo
              echo "${message}"
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi

  build:
    name: Build and smoke ${{ matrix.os }} ${{ matrix.arch }}
    needs: metadata
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-24.04
            image: quay.io/pypa/manylinux_2_28_x86_64
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64
          - os: darwin
            arch: amd64
            runner: macos-15-intel
          - os: darwin
            arch: arm64
            runner: macos-latest
    env:
      CARGO_BUILD_JOBS: "4"
      RUSTUP_TOOLCHAIN: "1.97.1"
    steps:
      - uses: actions/checkout@v7
      - name: Verify native architecture
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          case "${TARGET_ARCH}" in
            amd64) expected_arch=X64 ;;
            arm64) expected_arch=ARM64 ;;
          esac
          [[ "${RUNNER_ARCH}" == "${expected_arch}" ]]
      - name: Install Rust
        if: runner.os == 'macOS'
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          brew install llvm
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "${GITHUB_ENV}"
      - uses: Swatinem/rust-cache@v2
        if: runner.os == 'macOS'
        with:
          workspaces: server-zd
          shared-key: server-zd-binary-${{ matrix.os }}-${{ matrix.arch }}
      - name: Stamp release version
        working-directory: server-zd
        env:
          SERVER_ZD_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          manifest_path = Path('Cargo.toml')
          lock_path = Path('Cargo.lock')
          manifest = tomllib.loads(manifest_path.read_text())
          original_version = manifest['workspace']['package']['version']
          release_version = os.environ['SERVER_ZD_VERSION']
          package_names = {
              tomllib.loads((Path(member) / 'Cargo.toml').read_text())['package']['name']
              for member in manifest['workspace']['members']
          }
          manifest_text, replacements = re.subn(
              rf'(?m)^(version = "){re.escape(original_version)}("$)',
              rf'\g<1>{release_version}\g<2>',
              manifest_path.read_text(),
              count=1,
          )
          if replacements != 1:
              raise SystemExit('failed to stamp workspace version')
          manifest_path.write_text(manifest_text)
          lock_text = lock_path.read_text()
          for package_name in package_names:
              lock_text, replacements = re.subn(
                  rf'(?m)(^name = "{re.escape(package_name)}"\nversion = "){re.escape(original_version)}("$)',
                  rf'\g<1>{release_version}\g<2>',
                  lock_text,
                  count=1,
              )
              if replacements != 1:
                  raise SystemExit(f'failed to stamp {package_name} lock version')
          lock_path.write_text(lock_text)
          PY
      - name: Build Linux binary in manylinux 2.28
        if: runner.os == 'Linux'
        env:
          BUILD_IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" \
            --workdir "${GITHUB_WORKSPACE}/server-zd" \
            --env CARGO_BUILD_JOBS=4 \
            --env RUSTFLAGS='-C link-arg=-static-libstdc++' \
            "${BUILD_IMAGE}" bash -euo pipefail -c '
              dnf -y install clang clang-devel openssl-devel zlib-devel
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs \
                | sh -s -- -y --profile minimal --default-toolchain 1.97.1
              source /root/.cargo/env
              cargo build --release --locked -p dexzd-server
            '
      - name: Build macOS binary
        if: runner.os == 'macOS'
        working-directory: server-zd
        run: cargo build --release --locked -p dexzd-server
      - name: Check Linux symbol versions
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          binary=server-zd/target/release/dex-server-zd
          versions="$(readelf --version-info "${binary}")"
          glibc_max="$(grep -oE 'GLIBC_[0-9]+\.[0-9]+(\.[0-9]+)?' <<< "${versions}" | sort -Vu | tail -1)"
          glibcxx_max="$(grep -oE 'GLIBCXX_[0-9]+\.[0-9]+(\.[0-9]+)?' <<< "${versions}" | sort -Vu | tail -1 || true)"
          echo "Newest required glibc symbol: ${glibc_max}"
          echo "Newest required libstdc++ symbol: ${glibcxx_max:-none}"
          [[ "$(printf '%s\n%s\n' "${glibc_max}" GLIBC_2.28 | sort -V | tail -1)" == GLIBC_2.28 ]]
          if [[ -n "${glibcxx_max}" ]]; then
            [[ "$(printf '%s\n%s\n' "${glibcxx_max}" GLIBCXX_3.4.25 | sort -V | tail -1)" == GLIBCXX_3.4.25 ]]
          fi
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24.x'
          cache: false
      - name: Build grpcurl
        env:
          GOBIN: ${{ runner.temp }}/go-bin
        run: go install github.com/fullstorydev/grpcurl/cmd/grpcurl@v1.9.3
      - name: Smoke version, gRPC health, and shutdown
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          binary="${GITHUB_WORKSPACE}/server-zd/target/release/dex-server-zd"
          version_output="$("${binary}" --version)"
          [[ "${version_output}" == "dex-server-zd ${EXPECTED_VERSION}" ]] || {
            echo "Unexpected version: ${version_output}" >&2
            exit 1
          }
          cat > "${RUNNER_TEMP}/health.proto" <<'PROTO'
          syntax = "proto3";
          package grpc.health.v1;
          service Health {
            rpc Check(HealthCheckRequest) returns (HealthCheckResponse);
          }
          message HealthCheckRequest { string service = 1; }
          message HealthCheckResponse {
            enum ServingStatus {
              UNKNOWN = 0;
              SERVING = 1;
              NOT_SERVING = 2;
              SERVICE_UNKNOWN = 3;
            }
            ServingStatus status = 1;
          }
          PROTO
          port="$(python3 -c 'import socket; sock = socket.socket(); sock.bind(("127.0.0.1", 0)); print(sock.getsockname()[1]); sock.close()')"
          data_dir="${RUNNER_TEMP}/zd-smoke-data"
          server_pid=''
          cleanup() {
            if [[ -n "${server_pid}" ]] && kill -0 "${server_pid}" 2>/dev/null; then
              kill "${server_pid}"
              wait "${server_pid}" || true
            fi
          }
          trap cleanup EXIT
          "${binary}" dev --data-dir "${data_dir}" --listen "127.0.0.1:${port}" > "${RUNNER_TEMP}/zd-smoke.log" 2>&1 &
          server_pid=$!
          health_check() {
            "${RUNNER_TEMP}/go-bin/grpcurl" -plaintext -max-time 2 \
              -import-path "${RUNNER_TEMP}" -proto health.proto \
              -d '{}' "127.0.0.1:${port}" grpc.health.v1.Health/Check
          }
          serving=false
          deadline=$((SECONDS + 120))
          while (( SECONDS < deadline )); do
            if health_check 2>/dev/null | grep -q '"status": "SERVING"'; then
              serving=true
              break
            fi
            if ! kill -0 "${server_pid}" 2>/dev/null; then
              cat "${RUNNER_TEMP}/zd-smoke.log" >&2
              echo 'dev exited before becoming SERVING' >&2
              exit 1
            fi
            sleep 1
          done
          [[ "${serving}" == true ]] || {
            cat "${RUNNER_TEMP}/zd-smoke.log" >&2
            echo 'dev did not become SERVING' >&2
            exit 1
          }
          kill -TERM "${server_pid}"
          deadline=$((SECONDS + 30))
          while kill -0 "${server_pid}" 2>/dev/null && (( SECONDS < deadline )); do
            sleep 1
          done
          if kill -0 "${server_pid}" 2>/dev/null; then
            cat "${RUNNER_TEMP}/zd-smoke.log" >&2
            echo 'dev did not stop after SIGTERM' >&2
            exit 1
          fi
          exit_status=0
          wait "${server_pid}" || exit_status=$?
          server_pid=''
          [[ "${exit_status}" -eq 0 ]] || {
            cat "${RUNNER_TEMP}/zd-smoke.log" >&2
            echo "dev exited ${exit_status} after SIGTERM" >&2
            exit 1
          }
      - name: Package native binary
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          package_dir="${RUNNER_TEMP}/package"
          mkdir -p "${package_dir}" "${RUNNER_TEMP}/dist"
          cp server-zd/target/release/dex-server-zd "${package_dir}/"
          cp server-zd/LICENSE.md server-zd/LEGACY_NOTICES.md "${package_dir}/"
          cp -R server-zd/LICENSES "${package_dir}/"
          if [[ "${TARGET_OS}" == linux ]]; then
            owner_flags=(--owner=0 --group=0 --numeric-owner)
          else
            owner_flags=(--uid 0 --gid 0)
          fi
          COPYFILE_DISABLE=1 tar "${owner_flags[@]}" -C "${package_dir}" \
            -czf "${RUNNER_TEMP}/dist/dex-server-zd_v${VERSION}_${TARGET_OS}_${TARGET_ARCH}.tar.gz" \
            dex-server-zd LICENSE.md LEGACY_NOTICES.md LICENSES
      - uses: actions/upload-artifact@v7
        with:
          name: server-zd-binary-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/dist/*.tar.gz
          if-no-files-found: error

  checksums:
    name: Validate binaries and checksums
    needs: [metadata, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: server-zd-binary-*
          path: dist
          merge-multiple: true
      - name: Write SHA-256 checksums
        run: |
          set -euo pipefail
          cd dist
          archives=(./*.tar.gz)
          [[ "${#archives[@]}" -eq 4 ]] || {
            echo "Expected four binary archives, found ${#archives[@]}" >&2
            exit 1
          }
          sha256sum -- "${archives[@]}" > checksums.txt
          cat checksums.txt
      - name: Validate Release upload assets
        env:
          RELEASE_TAG: server-zd/v${{ needs.metadata.outputs.version }}
          VERSION: ${{ needs.metadata.outputs.version }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          assets=(dist/*.tar.gz dist/checksums.txt)
          [[ "${#assets[@]}" -eq 5 ]]
          expected_archives=(
            "dist/dex-server-zd_v${VERSION}_linux_amd64.tar.gz"
            "dist/dex-server-zd_v${VERSION}_linux_arm64.tar.gz"
            "dist/dex-server-zd_v${VERSION}_darwin_amd64.tar.gz"
            "dist/dex-server-zd_v${VERSION}_darwin_arm64.tar.gz"
          )
          for archive in "${expected_archives[@]}"; do
            [[ -s "${archive}" ]]
          done
          for asset in "${assets[@]}"; do
            [[ -s "${asset}" ]]
          done
          (cd dist && sha256sum -c checksums.txt)
          gh release upload --help >/dev/null
          printf 'Validated upload: gh release upload %q' "${RELEASE_TAG}"
          printf ' %q' "${assets[@]}"
          printf ' --clobber --repo %q\n' "${GH_REPO}"
      - uses: actions/upload-artifact@v7
        with:
          name: server-zd-binaries-v${{ needs.metadata.outputs.version }}
          path: dist/*
          if-no-files-found: error

  # Publishing waits for the server-zd suites on this exact release commit.
  test-server-zd:
    name: Server ZD tests
    needs: metadata
    if: needs.metadata.outputs.publish == 'true'
    uses: ./.github/workflows/server-zd-ci.yml
  test-server-zd-integ:
    name: Server integration tests
    needs: metadata
    if: needs.metadata.outputs.publish == 'true'
    uses: ./.github/workflows/server-zd-integ-ci.yml

  publish:
    name: Publish Release assets
    if: needs.metadata.outputs.publish == 'true'
    needs: [metadata, checksums, test-server-zd, test-server-zd-integ]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: server-zd-binaries-v${{ needs.metadata.outputs.version }}
          path: dist
      - name: Upload Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: server-zd/v${{ needs.metadata.outputs.version }}
        run: gh release upload "${RELEASE_TAG}" dist/* --clobber

  snapshot-reference:
    name: Push released server reference snapshot
    needs: [metadata, publish]
    if: needs.metadata.outputs.publish == 'true'
    # A snapshot failure must never fail the release run.
    continue-on-error: true
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # A release event checks out the tag; the snapshot branch must start from main.
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install docs dependencies
        run: npm ci --prefix docs
      # The snapshot script owns the version policy: stable 0.1.N, then X.Y.Z minors from 1.0.
      - name: Check reference version
        id: reference
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          if node docs/scripts/snapshot-reference.mjs --reference-version server "${VERSION}"; then
            echo "selected=true" >> "${GITHUB_OUTPUT}"
          else
            echo "No server reference snapshot for ${VERSION}; prereleases are not snapshotted." >> "${GITHUB_STEP_SUMMARY}"
            echo "selected=false" >> "${GITHUB_OUTPUT}"
          fi
      - name: Snapshot server reference
        if: steps.reference.outputs.selected == 'true'
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: node docs/scripts/snapshot-reference.mjs server "${VERSION}"
      - name: Check snapshot
        if: steps.reference.outputs.selected == 'true'
        run: npm run check --prefix docs
      # GITHUB_TOKEN cannot open pull requests here, and its pull requests would not trigger CI.
      # A GitHub App token would let this step open the pull request itself.
      - name: Push snapshot branch
        if: steps.reference.outputs.selected == 'true'
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          git add docs
          if git diff --cached --quiet; then
            echo "No server reference snapshot changes for ${VERSION}." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          branch="automation/reference-snapshots-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "${branch}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "docs: snapshot server reference ${VERSION}"
          git push origin "${branch}"
          # Check Gate CI accepts the change-log link rewrites of a snapshot only with this description line.
          compare_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${branch}?expand=1&body=changelog%3A%20correction%3A%20reference%20snapshot"
          {
            echo "## Server reference snapshot for ${VERSION}"
            echo
            echo "Pushed \`${branch}\`. Open its pull request: ${compare_url}"
            echo
            echo "Keep the description line \`changelog: correction: reference snapshot\`."
            echo
            echo "Merge reference snapshot branches in release order."
            echo
            echo '```text'
            git show --stat --format='%s' HEAD
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Report snapshot failure
        if: failure()
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          {
            echo "## Server reference snapshot for ${VERSION} failed"
            echo
            echo "The release is unaffected. Run the snapshot from docs/README.md by hand and open its pull request."
          } >> "${GITHUB_STEP_SUMMARY}"
