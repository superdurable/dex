name: Publish Rust SDK to crates.io

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      version:
        description: Rust SDK release version
        required: true
        type: string
      publish:
        description: Publish the validated crates to crates.io
        required: false
        default: true
        type: boolean
  pull_request:
    paths:
      - "sdk-rust/**"
      - ".github/workflows/sdk-rust-publish.yml"
  workflow_dispatch:
    inputs:
      version:
        description: Rust SDK release version
        required: true
        type: string
      publish:
        description: Publish the validated crates to crates.io
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: sdk-rust-publish-${{ github.event.release.tag_name || inputs.version || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: "1.97.1"

jobs:
  prepare:
    name: Validate release
    if: >
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_call' ||
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.release.tag_name, 'sdk-rust/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: sdk-rust
    outputs:
      version: ${{ steps.release.outputs.version }}
      source_ref: ${{ steps.sources.outputs.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Select release sources
        id: sources
        shell: bash
        working-directory: .
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          # An existing release tag pins the crate sources, so a republish never builds later main commits.
          ref="${GITHUB_SHA}"
          tag="refs/tags/sdk-rust/v${DISPATCH_VERSION}"
          if [[ "${EVENT_NAME}" == "workflow_dispatch" || "${EVENT_NAME}" == "workflow_call" ]] &&
            git rev-parse -q --verify "${tag}^{commit}" >/dev/null; then
            ref="$(git rev-parse "${tag}^{commit}")"
            git checkout --quiet --detach "${ref}"
          fi
          echo "ref=${ref}" >> "${GITHUB_OUTPUT}"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install Rust
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Resolve release version
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          DISPATCH_VERSION: ${{ inputs.version }}
          DISPATCH_PUBLISH: ${{ inputs.publish }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          if [[ "${EVENT_NAME}" == "release" ]]; then
            version="${RELEASE_TAG#sdk-rust/v}"
            if ! git merge-base --is-ancestor HEAD origin/main; then
              echo "Release tag must point to a commit on main" >&2
              exit 1
            fi
          elif [[ "${EVENT_NAME}" == "workflow_dispatch" || "${EVENT_NAME}" == "workflow_call" ]]; then
            version="${DISPATCH_VERSION}"
            if [[ "${DISPATCH_PUBLISH}" == "true" && "${RELEASE_REF}" != "refs/heads/main" ]]; then
              echo "Manual publishing is allowed only from main" >&2
              exit 1
            fi
          else
            version="$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          fi
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z]+)*$ ]]; then
            echo "Invalid Rust SDK release version: ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
      - name: Stamp package versions from release
        run: >-
          python scripts/stamp_release_version.py
          '${{ steps.release.outputs.version }}'
          --stage-protocol
      - name: Validate stamped workspace
        run: cargo metadata --locked --no-deps --format-version 1
      - name: Verify runtime version
        env:
          DEX_EXPECTED_SDK_VERSION: ${{ steps.release.outputs.version }}
        run: >-
          cargo test --locked -p dex-sdk
          server_protocol::tests::runtime_version_matches_release
          -- --exact
      - name: Build independently publishable crates
        run: |
          cargo package --locked --allow-dirty -p dex-blob-cache -p dex-protocol
      - name: Upload crate archives
        uses: actions/upload-artifact@v7
        with:
          name: dex-rust-crates-${{ steps.release.outputs.version }}
          path: sdk-rust/target/package/*.crate
          if-no-files-found: error

  publish:
    name: Publish Rust crates
    if: github.event_name == 'release' || inputs.publish == true
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sdk-rust
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check out release sources
        shell: bash
        working-directory: .
        env:
          SOURCE_REF: ${{ needs.prepare.outputs.source_ref }}
        run: |
          # The publisher runs from this workflow's commit; the crates come from the release sources.
          cp sdk-rust/scripts/publish_crates.py "${RUNNER_TEMP}/publish_crates.py"
          git checkout --quiet --detach "${SOURCE_REF}"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install Rust
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Stamp package versions from release
        run: >-
          python scripts/stamp_release_version.py
          '${{ needs.prepare.outputs.version }}'
          --stage-protocol
      - name: Validate crates.io credentials
        shell: bash
        env:
          CRATES_IO_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          [[ -n "${CRATES_IO_TOKEN}" ]] || { echo 'CRATES_IO_TOKEN is missing' >&2; exit 1; }
      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: >-
          python "${RUNNER_TEMP}/publish_crates.py"
          '${{ needs.prepare.outputs.version }}'
          dex-blob-cache dex-protocol dex-sdk
