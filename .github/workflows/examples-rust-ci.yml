name: Rust examples CI

on:
  pull_request:
    paths:
      - "examples/rust/**"
      - "examples/entity-store/**"
      - ".github/workflows/examples-rust-ci.yml"
  workflow_dispatch:
  # Main CI (all) and release workflows call this suite on main and release commits.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: examples-rust-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  RUSTUP_TOOLCHAIN: "1.97.1"

jobs:
  quality:
    name: Published SDK, format, Clippy, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: examples/rust
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
      - name: Verify published SDK dependency
        run: |
          set -euo pipefail
          cargo tree --locked -p dex-sdk | tee /tmp/dex-examples-rust-sdk-tree.txt
          grep -qE '^dex-sdk v[0-9]' /tmp/dex-examples-rust-sdk-tree.txt
          if grep -q '(/' /tmp/dex-examples-rust-sdk-tree.txt; then
            echo "examples/rust must depend on published dex-sdk, not a path dependency"
            exit 1
          fi
      - name: Check formatting
        run: make fmt-check
      - name: Run Clippy
        run: make clippy
      - name: Run catalog integration tests
        run: make test
      - name: Verify Quick Start published SDK dependency
        working-directory: examples/rust/quick-start
        run: |
          set -euo pipefail
          cargo tree --locked -p dex-sdk | tee /tmp/dex-quick-start-rust-sdk-tree.txt
          grep -qE '^dex-sdk v[0-9]' /tmp/dex-quick-start-rust-sdk-tree.txt
          if grep -q '(/' /tmp/dex-quick-start-rust-sdk-tree.txt; then
            echo "examples/rust/quick-start must depend on published dex-sdk, not a path dependency"
            exit 1
          fi
      - name: Check Quick Start formatting
        working-directory: examples/rust/quick-start
        run: cargo fmt --all --check
      - name: Run Quick Start Clippy
        working-directory: examples/rust/quick-start
        run: cargo clippy --all-targets --locked -- -D warnings

  integ:
    name: Integration tests with dexcli dev (pull, zd)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DEX_INTEG_ENGINE: zd
      DEX_SERVER_ZD_BINARY: ${{ github.workspace }}/server-zd/target/debug/dex-server-zd
      # With the workflow env, these match Server ZD CI, so its main cache restores here.
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "4"
    defaults:
      run:
        working-directory: examples/rust
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Install libclang for RocksDB
        run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server-zd
          shared-key: server-zd-build
          # Restore-only: the Server ZD build cache workflow owns this key.
          save-if: false
      - name: Build dex-server-zd
        working-directory: server-zd
        run: cargo build --locked -p dexzd-server --bin dex-server-zd
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: |
            cli/go.sum
            web/go.sum
      - name: Integration tests with dexcli dev
        run: ./run-integration-tests.sh
      - name: Upload service logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rust-examples-integration-services-zd
          path: /tmp/test-rust-examples-integration-services.log
          if-no-files-found: ignore
