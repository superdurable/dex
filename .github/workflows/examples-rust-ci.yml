name: Rust examples CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: examples-rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  RUSTUP_TOOLCHAIN: "1.97.1"

jobs:
  quality:
    name: Published SDK, format, Clippy, and tests
    runs-on: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'linux-dind-light' || 'ubuntu-latest' }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: examples/rust
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
      - name: Verify published SDK dependency
        run: |
          cargo tree --locked -p dex-sdk | tee /tmp/dex-examples-rust-sdk-tree.txt
          grep -q '^dex-sdk v0\.1\.10$' /tmp/dex-examples-rust-sdk-tree.txt
          if grep -q '(/' /tmp/dex-examples-rust-sdk-tree.txt; then
            echo "examples/rust must depend on published dex-sdk, not a path dependency"
            exit 1
          fi
      - name: Check formatting
        run: make fmt-check
      - name: Run Clippy
        run: make clippy
      - name: Run catalog integration tests
        run: make test

  integ:
    name: Integration tests with dexcli dev
    runs-on: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'linux-dind-heavy' || 'ubuntu-latest' }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: examples/rust
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: |
            cli/go.sum
            server/go.sum
            web/go.sum
      - name: Install Temporal CLI runtime for dexcli dev
        uses: temporalio/setup-temporal@v0
      - name: Install Rust
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Integration tests with dexcli dev
        run: ./run-integration-tests.sh
      - name: Upload service logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rust-examples-integration-services
          path: /tmp/test-rust-examples-integration-services.log
          if-no-files-found: ignore
