name: Go SDK CI

on:
  push:
    branches: [main]
    paths:
      - "sdk-go/**"
      - "blob-cache-go/**"
      - "protos/**"
      - "server-zd/**"
      - "s3mock/**"
      - "cli/**"
      - "web/**"
      - "go.work"
      - "go.work.sum"
      - "codecov.yml"
      - ".github/workflows/sdk-go-ci.yml"
  pull_request:
    paths:
      - "sdk-go/**"
      - "blob-cache-go/**"
      - "protos/**"
      - "server-zd/**"
      - "s3mock/**"
      - "cli/**"
      - "web/**"
      - "go.work"
      - "go.work.sum"
      - "codecov.yml"
      - ".github/workflows/sdk-go-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-go-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk-go
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache-dependency-path: |
            sdk-go/go.sum
            go.work.sum
      - name: Validate public API documentation
        run: make docsCheck
      - name: Unit tests
        run: make unitTests

  worker-integration:
    name: Worker integration tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk-go
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache-dependency-path: |
            sdk-go/go.sum
            go.work.sum
      - name: Worker integration tests
        run: make workerIntegTests

  client-integration:
    name: Client integration tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk-go
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache-dependency-path: |
            sdk-go/go.sum
            go.work.sum
      - name: Client integration tests
        run: make clientIntegTests

  e2e:
    name: Integration coverage (zd, pull)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
      id-token: write
    env:
      DEX_INTEG_ENGINE: zd
      DEX_SERVER_ZD_BINARY: ${{ github.workspace }}/server-zd/target/debug/dex-server-zd
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      RUST_BACKTRACE: "1"
      RUSTUP_TOOLCHAIN: "1.97.1"
      CARGO_BUILD_JOBS: "4"
    defaults:
      run:
        working-directory: sdk-go
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Install libclang for RocksDB
        run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server-zd
          shared-key: server-zd-paradedb
          save-if: false
      - name: Build dex-server-zd
        working-directory: server-zd
        run: cargo build --locked -p dexzd-server --bin dex-server-zd
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache-dependency-path: |
            sdk-go/go.sum
            cli/go.sum
            go.work.sum
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Run integration coverage with dexcli dev
        run: ./run-e2e-tests.sh --coverage
      - name: Upload Go coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          disable_search: true
          fail_ci_if_error: true
          files: ./sdk-go/coverage/coverage.out
          flags: sdk-go-integration
          name: sdk-go-integration-pull
          use_oidc: true
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sdk-go-integration-coverage-pull
          path: sdk-go/coverage/
          if-no-files-found: ignore
      - name: Upload service logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sdk-go-e2e-services-pull
          path: /tmp/test-go-sdk-phase5-e2e-services.log
          if-no-files-found: ignore
