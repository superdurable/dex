name: Go SDK CI

on:
  push:
    branches: [main]
    paths:
      - "sdk-go/**"
      - "protos/**"
      - "server/**"
      - "cli/**"
      - "web/**"
      - "go.work"
      - "go.work.sum"
      - "codecov.yml"
      - ".github/workflows/sdk-go-ci.yml"
  pull_request:
    paths:
      - "sdk-go/**"
      - "protos/**"
      - "server/**"
      - "cli/**"
      - "web/**"
      - "go.work"
      - "go.work.sum"
      - "codecov.yml"
      - ".github/workflows/sdk-go-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-go-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk-go
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: sdk-go/go.mod
          cache-dependency-path: |
            sdk-go/go.sum
            go.work.sum
      - name: Unit tests
        run: make unitTests

  worker-integration:
    name: Worker integration tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk-go
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: sdk-go/go.mod
          cache-dependency-path: |
            sdk-go/go.sum
            go.work.sum
      - name: Worker integration tests
        run: make workerIntegTests

  client-integration:
    name: Client integration tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk-go
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: sdk-go/go.mod
          cache-dependency-path: |
            sdk-go/go.sum
            go.work.sum
      - name: Client integration tests
        run: make clientIntegTests

  e2e:
    name: Integration coverage
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: sdk-go
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: sdk-go/go.mod
          cache-dependency-path: |
            sdk-go/go.sum
            cli/go.sum
            server/go.sum
            go.work.sum
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Temporal CLI runtime for dexcli dev
        uses: temporalio/setup-temporal@v0
      - name: Run integration coverage with dexcli dev
        run: ./run-e2e-tests.sh --coverage
      - name: Upload Go coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          disable_search: true
          fail_ci_if_error: true
          files: ./sdk-go/coverage/coverage.out
          flags: sdk-go-integration
          name: sdk-go-integration
          use_oidc: true
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sdk-go-integration-coverage
          path: sdk-go/coverage/
          if-no-files-found: ignore
      - name: Upload service logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sdk-go-e2e-services
          path: /tmp/test-go-sdk-phase5-e2e-services.log
          if-no-files-found: ignore
