name: Server ZD build cache

# Saves the server-zd-build cache that every job building dex-server-zd restores. Caches saved on
# main are readable by pull request branches. Run it by hand once after changing the consumers' env.
on:
  schedule:
    - cron: "30 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-zd-build-cache-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build dex-server-zd and save its cache
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # rust-cache hashes CARGO*, RUST*, CC*, and CMAKE* variables into its key, so every job that
    # restores server-zd-build sets exactly these values.
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      RUST_BACKTRACE: "1"
      RUSTUP_TOOLCHAIN: "1.97.1"
      CARGO_BUILD_JOBS: "4"
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Install libclang for RocksDB
        run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - uses: Swatinem/rust-cache@v2
        id: rust-cache
        with:
          workspaces: server-zd
          shared-key: server-zd-build
      # An exact hit means this toolchain, env, and Cargo.lock are already saved.
      - name: Build dex-server-zd
        if: steps.rust-cache.outputs.cache-hit != 'true'
        working-directory: server-zd
        run: cargo build --locked -p dexzd-server --bin dex-server-zd
