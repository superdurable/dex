name: Server ZD Simulation Runner CI

on:
  pull_request:
    paths:
      - "script/server-zd-simulation-run.py"
      - "script/test_server_zd_simulation_run.py"
      - ".github/workflows/server-zd-simulation-nightly.yml"
      - ".github/workflows/server-zd-simulation-runner-ci.yml"
      - "Makefile"
  workflow_dispatch:
  # Main CI (all) and release workflows call this suite on main and release commits.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: server-zd-simulation-runner-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  runner-tests:
    name: Runner integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Test nightly process supervision
        run: make server-zd-simulation-runner-test
