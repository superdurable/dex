name: Java examples CI

on:
  push:
    branches: [main]
    paths:
      - "examples/java/**"
      - ".github/workflows/examples-java-ci.yml"
  pull_request:
    paths:
      - "examples/java/**"
      - ".github/workflows/examples-java-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: "1.97.1"

concurrency:
  group: examples-java-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Build + unit tests (Java ${{ matrix.java-version }})
    runs-on: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'linux-dind-light' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        java-version: ["17", "21", "25", "26"]
    defaults:
      run:
        working-directory: examples/java
    steps:
      - uses: actions/checkout@v7
      # Gradle 9 needs JDK 17+; matrix JDKs are auto-provisioned toolchains.
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "25"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build and unit tests
        run: ./gradlew test --tests 'io.superdurable.dex.products.*' --refresh-dependencies "-PjavaVersion=${{ matrix.java-version }}"
      - name: Verify published SDK coordinate
        run: |
          ./gradlew dependencyInsight --dependency dex-sdk --configuration compileClasspath \
            | tee /tmp/dex-sdk-insight.txt
          # Assert Maven Central coordinate (group:artifact), not a composite/project dep.
          # Version lives only in build.gradle — do not pin it here.
          grep -qE 'io\.superdurable:dex-sdk:[0-9]' /tmp/dex-sdk-insight.txt
          if grep -E 'project :|ProjectDependency' /tmp/dex-sdk-insight.txt; then
            echo "examples/java must depend on published dex-sdk, not a Gradle project"
            exit 1
          fi

  integ:
    name: Integration tests
    runs-on: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'linux-dind-heavy' || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: examples/java
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: |
            cli/go.sum
            server/go.sum
            web/go.sum
      - name: Install Temporal CLI runtime for dexcli dev
        uses: temporalio/setup-temporal@v0
      - name: Install Rust
        run: rustup toolchain install 1.97.1 --profile minimal
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "25"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Integration tests with dexcli dev
        run: ./run-integration-tests.sh
      - name: Upload service logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: java-examples-integration-services
          path: /tmp/test-java-examples-integration-services.log
          if-no-files-found: ignore
