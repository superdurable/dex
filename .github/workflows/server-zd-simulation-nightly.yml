name: Server ZD Simulation Nightly

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      seed_count:
        description: Number of consecutive apply simulation seeds
        required: true
        default: 500
        type: number
      command_count:
        description: Commands per apply simulation seed
        required: true
        default: 1000
        type: number
      engine_seed_count:
        description: Number of consecutive engine simulation seeds
        required: true
        default: 250
        type: number
      engine_active_seconds:
        description: Simulated seconds of client and Worker activity per engine simulation seed
        required: true
        default: 300
        type: number
      redeploy_seed_count:
        description: Number of consecutive engine simulation seeds in the redeploy profile
        required: true
        default: 48
        type: number
      redeploy_active_seconds:
        description: Simulated seconds of activity per redeploy-profile seed
        required: true
        default: 300
        type: number

permissions:
  contents: read

concurrency:
  group: server-zd-simulation-nightly
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "4"
  RUST_BACKTRACE: "1"
  RUSTUP_TOOLCHAIN: "1.97.1"

jobs:
  simulation-refs:
    name: Resolve simulation refs
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Each job runs on the workflow's commit (main when scheduled) and the latest server-zd release.
      - name: Find the latest server-zd release tag
        id: targets
        shell: bash
        run: |
          main_target=$(jq -cn --arg ref "$GITHUB_SHA" '{label: "main", ref: $ref}')
          release_tag=$(git -c versionsort.suffix=- tag --list 'server-zd/v*' --sort=-v:refname | head -n 1)
          if [[ -z "$release_tag" ]]; then
            echo "No server-zd/v* release tag exists yet; skipping the latest-release runs."
            targets="[$main_target]"
          else
            echo "Latest server-zd release tag: $release_tag"
            targets=$(jq -cn --argjson main "$main_target" --arg ref "$release_tag" \
              '[$main, {label: "latest-release", ref: $ref}]')
          fi
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  apply-simulation:
    name: Apply simulation (${{ matrix.target.label }})
    needs: simulation-refs
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.simulation-refs.outputs.targets) }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: server-zd
    env:
      DEXZD_SIMULATION_SEEDS: ${{ inputs.seed_count || 500 }}
      DEXZD_SIMULATION_COMMANDS: ${{ inputs.command_count || 1000 }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.target.ref }}
          fetch-depth: ${{ matrix.target.label == 'main' && 1 || 0 }}
      - name: Install Rust
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Install libclang for the RocksDB bindings
        run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server-zd
          shared-key: server-zd-test
          save-if: false
      - name: Validate apply simulation budget
        shell: bash
        run: |
          if ! [[ "$DEXZD_SIMULATION_SEEDS" =~ ^[1-9][0-9]*$ ]] ||
             ! [[ "$DEXZD_SIMULATION_COMMANDS" =~ ^[1-9][0-9]*$ ]] ||
             (( ${#DEXZD_SIMULATION_SEEDS} > 4 || ${#DEXZD_SIMULATION_COMMANDS} > 4 )) ||
             (( DEXZD_SIMULATION_SEEDS > 1000 || DEXZD_SIMULATION_COMMANDS > 2000 )) ||
             (( DEXZD_SIMULATION_SEEDS * DEXZD_SIMULATION_COMMANDS > 500000 )); then
            echo 'Use 1–1000 seeds, 1–2000 commands per seed, and at most 500000 random commands.' >&2
            exit 1
          fi
      - name: Choose random base seed
        run: |
          base_seed=$(od -An -N4 -tu4 /dev/urandom | tr -d '[:space:]')
          echo "DEXZD_SIMULATION_BASE_SEED=$base_seed" >> "$GITHUB_ENV"
          echo "Base seed: $base_seed"
      - name: Run apply simulation
        id: apply
        shell: bash
        env:
          DEXZD_SIMULATION_FAILURE_DIR: ${{ runner.temp }}/dexzd-simulation-failures
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=1m 50m cargo test -p dexzd-simulation --test apply_invariants apply_keeps_every_invariant_over_random_command_sequences -- --exact --nocapture 2>&1 | tee "$RUNNER_TEMP/dexzd-simulation.log"
      - name: Summarize apply simulation
        if: always()
        shell: bash
        run: |
          {
            echo "## Apply simulation (${{ matrix.target.label }}: ${{ matrix.target.ref }})"
            echo "Base seed: ${DEXZD_SIMULATION_BASE_SEED:-not selected}"
            echo "Seed count: $DEXZD_SIMULATION_SEEDS; commands per seed: $DEXZD_SIMULATION_COMMANDS"
            echo "Result: ${{ steps.apply.outcome }}"
            echo
            if compgen -G "$RUNNER_TEMP/dexzd-simulation-failures/*.txt" > /dev/null; then
              echo "### Failing seeds"
              echo "Run reproduction commands from \`server-zd/\`."
              for report in "$RUNNER_TEMP"/dexzd-simulation-failures/*.txt; do
                seed=${report##*/}
                seed=${seed%.txt}
                reproduction=$(grep -m1 '^reproduce with:' "$report")
                echo "- Seed $seed: \`${reproduction#reproduce with: }\`"
              done
              echo
              echo "Download the failure artifact for each command index and reproduction sequence."
            else
              echo "No invariant failures were recorded."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload apply simulation failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dexzd-apply-simulation-failures-${{ matrix.target.label }}
          path: |
            ${{ runner.temp }}/dexzd-simulation-failures/
            ${{ runner.temp }}/dexzd-simulation.log
          if-no-files-found: warn
          retention-days: 30

  seeded-bug-acceptance:
    name: Seeded bug acceptance (${{ matrix.target.label }})
    needs: simulation-refs
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.simulation-refs.outputs.targets) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.target.ref }}
          fetch-depth: ${{ matrix.target.label == 'main' && 1 || 0 }}
      - name: Install Rust
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Install libclang for the RocksDB bindings
        run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - name: Detect seeded apply and engine bugs
        run: script/server-zd-seeded-bugs.sh

  engine-simulation:
    name: Engine simulation (${{ matrix.target.label }})
    needs: simulation-refs
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.simulation-refs.outputs.targets) }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: server-zd
    env:
      DEXZD_SIMULATION_SEEDS: ${{ inputs.engine_seed_count || 250 }}
      DEXZD_SIMULATION_SECONDS: ${{ inputs.engine_active_seconds || 300 }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.target.ref }}
          fetch-depth: ${{ matrix.target.label == 'main' && 1 || 0 }}
      - name: Install Rust
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Install libclang for the RocksDB bindings
        run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server-zd
          shared-key: server-zd-test
          save-if: false
      - name: Validate engine simulation budget
        shell: bash
        run: |
          if ! [[ "$DEXZD_SIMULATION_SEEDS" =~ ^[1-9][0-9]*$ ]] ||
             ! [[ "$DEXZD_SIMULATION_SECONDS" =~ ^[1-9][0-9]*$ ]] ||
             (( ${#DEXZD_SIMULATION_SEEDS} > 4 || ${#DEXZD_SIMULATION_SECONDS} > 4 )) ||
             (( DEXZD_SIMULATION_SEEDS < 64 || DEXZD_SIMULATION_SEEDS > 1000 )) ||
             (( DEXZD_SIMULATION_SECONDS < 60 || DEXZD_SIMULATION_SECONDS > 1200 )) ||
             (( DEXZD_SIMULATION_SEEDS * DEXZD_SIMULATION_SECONDS > 75000 )); then
            echo 'Use 64–1000 seeds, 60–1200 simulated seconds per seed, and at most 75000 simulated seconds.' >&2
            exit 1
          fi
      - name: Choose random base seed
        run: |
          base_seed=$(od -An -N4 -tu4 /dev/urandom | tr -d '[:space:]')
          echo "DEXZD_SIMULATION_BASE_SEED=$base_seed" >> "$GITHUB_ENV"
          echo "Base seed: $base_seed"
      - name: Run engine simulation
        id: engine
        shell: bash
        env:
          DEXZD_SIMULATION_FAILURE_DIR: ${{ runner.temp }}/dexzd-engine-simulation-failures
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=1m 55m cargo test -p dexzd-simulation --test engine_simulation the_engine_keeps_every_invariant_through_faults_and_crashes -- --exact --nocapture 2>&1 | tee "$RUNNER_TEMP/dexzd-engine-simulation.log"
      - name: Summarize engine simulation
        if: always()
        shell: bash
        run: |
          {
            echo "## Engine simulation (${{ matrix.target.label }}: ${{ matrix.target.ref }})"
            echo "Base seed: ${DEXZD_SIMULATION_BASE_SEED:-not selected}"
            echo "Seed count: $DEXZD_SIMULATION_SEEDS; simulated seconds per seed: $DEXZD_SIMULATION_SECONDS"
            echo "Result: ${{ steps.engine.outcome }}"
            grep -m1 '^twin comparisons:' "$RUNNER_TEMP/dexzd-engine-simulation.log" || true
            echo
            if compgen -G "$RUNNER_TEMP/dexzd-engine-simulation-failures/*.txt" > /dev/null; then
              echo "### Failing seeds"
              echo "Run reproduction commands from \`server-zd/\`."
              for report in "$RUNNER_TEMP"/dexzd-engine-simulation-failures/*.txt; do
                seed=${report##*/}
                seed=${seed%.txt}
                reproduction=$(grep -m1 '^reproduce with:' "$report")
                echo "- Seed $seed: \`${reproduction#reproduce with: }\`"
              done
              echo
              echo "Download the failure artifact for each violation and its last trace events."
            else
              echo "No invariant failures were recorded."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload engine simulation failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dexzd-engine-simulation-failures-${{ matrix.target.label }}
          path: |
            ${{ runner.temp }}/dexzd-engine-simulation-failures/
            ${{ runner.temp }}/dexzd-engine-simulation.log
          if-no-files-found: warn
          retention-days: 30

  engine-simulation-redeploy-profile:
    name: Engine simulation redeploy profile (${{ matrix.target.label }})
    needs: simulation-refs
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.simulation-refs.outputs.targets) }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: server-zd
    env:
      DEXZD_SIMULATION_SEEDS: ${{ inputs.redeploy_seed_count || 48 }}
      DEXZD_SIMULATION_SECONDS: ${{ inputs.redeploy_active_seconds || 300 }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.target.ref }}
          fetch-depth: ${{ matrix.target.label == 'main' && 1 || 0 }}
      - name: Install Rust
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Install libclang for the RocksDB bindings
        run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server-zd
          shared-key: server-zd-test
          save-if: false
      - name: Validate redeploy profile budget
        shell: bash
        run: |
          if ! [[ "$DEXZD_SIMULATION_SEEDS" =~ ^[1-9][0-9]*$ ]] ||
             ! [[ "$DEXZD_SIMULATION_SECONDS" =~ ^[1-9][0-9]*$ ]] ||
             (( ${#DEXZD_SIMULATION_SEEDS} > 4 || ${#DEXZD_SIMULATION_SECONDS} > 4 )) ||
             (( DEXZD_SIMULATION_SEEDS < 16 || DEXZD_SIMULATION_SEEDS > 1000 )) ||
             (( DEXZD_SIMULATION_SECONDS < 60 || DEXZD_SIMULATION_SECONDS > 600 )) ||
             (( DEXZD_SIMULATION_SEEDS * DEXZD_SIMULATION_SECONDS > 20000 )); then
            echo 'Use 16–1000 seeds, 60–600 simulated seconds per seed, and at most 20000 simulated seconds.' >&2
            exit 1
          fi
      - name: Choose random base seed
        run: |
          base_seed=$(od -An -N4 -tu4 /dev/urandom | tr -d '[:space:]')
          echo "DEXZD_SIMULATION_BASE_SEED=$base_seed" >> "$GITHUB_ENV"
          echo "Base seed: $base_seed"
      - name: Check for the redeploy profile
        id: profile
        shell: bash
        run: |
          if grep -q 'fn redeploys_with_a_short_history_window_keep_every_invariant' crates/dexzd-simulation/tests/engine_simulation.rs; then
            echo "is_present=true" >> "$GITHUB_OUTPUT"
          else
            echo "${{ matrix.target.ref }} predates the redeploy profile; skipping it."
            echo "is_present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Run redeploy profile
        id: redeploy
        if: steps.profile.outputs.is_present == 'true'
        shell: bash
        env:
          DEXZD_SIMULATION_FAILURE_DIR: ${{ runner.temp }}/dexzd-redeploy-simulation-failures
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=1m 55m cargo test -p dexzd-simulation --test engine_simulation redeploys_with_a_short_history_window_keep_every_invariant -- --exact --nocapture 2>&1 | tee "$RUNNER_TEMP/dexzd-redeploy-simulation.log"
      - name: Summarize redeploy profile
        if: always()
        shell: bash
        run: |
          {
            echo "## Engine simulation redeploy profile (${{ matrix.target.label }}: ${{ matrix.target.ref }})"
            echo "Base seed: ${DEXZD_SIMULATION_BASE_SEED:-not selected}"
            echo "Seed count: $DEXZD_SIMULATION_SEEDS; simulated seconds per seed: $DEXZD_SIMULATION_SECONDS"
            echo "Result: ${{ steps.redeploy.outcome }}"
            echo
            if compgen -G "$RUNNER_TEMP/dexzd-redeploy-simulation-failures/*.txt" > /dev/null; then
              echo "### Failing seeds"
              echo "Run reproduction commands from \`server-zd/\`."
              for report in "$RUNNER_TEMP"/dexzd-redeploy-simulation-failures/*.txt; do
                seed=${report##*/}
                seed=${seed%.txt}
                reproduction=$(grep -m1 '^reproduce with:' "$report")
                echo "- Seed $seed: \`${reproduction#reproduce with: }\`"
              done
              echo
              echo "Download the failure artifact for each violation and its last trace events."
            else
              echo "No invariant failures were recorded."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload redeploy profile failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dexzd-redeploy-simulation-failures-${{ matrix.target.label }}
          path: |
            ${{ runner.temp }}/dexzd-redeploy-simulation-failures/
            ${{ runner.temp }}/dexzd-redeploy-simulation.log
          if-no-files-found: warn
          retention-days: 30
