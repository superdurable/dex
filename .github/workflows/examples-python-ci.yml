name: Python examples CI

on:
  push:
    branches: [main]
    paths:
      - "examples/python/**"
      - "examples/entity-store/**"
      - ".github/workflows/examples-python-ci.yml"
  pull_request:
    paths:
      - "examples/python/**"
      - "examples/entity-store/**"
      - ".github/workflows/examples-python-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: examples-python-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integ:
    name: Install + integ tests (zd)
    runs-on: ubuntu-latest
    env:
      DEX_INTEG_ENGINE: zd
      DEX_SERVER_ZD_BINARY: ${{ github.workspace }}/server-zd/target/debug/dex-server-zd
      # These CARGO_* and RUST* values match Server ZD CI, so its main cache restores here.
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      RUST_BACKTRACE: "1"
      RUSTUP_TOOLCHAIN: "1.97.1"
      CARGO_BUILD_JOBS: "4"
    defaults:
      run:
        working-directory: examples/python
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Install libclang for RocksDB
        run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server-zd
          shared-key: server-zd-paradedb
          # Restore-only: the Server ZD CI ParadeDB job owns this key.
          save-if: false
      - name: Build dex-server-zd
        working-directory: server-zd
        run: cargo build --locked -p dexzd-server --bin dex-server-zd
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: |
            cli/go.sum
            web/go.sum
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.2"
          python-version: "3.11"
          working-directory: examples/python
          enable-cache: true
      - name: Install dependencies (PyPI dex-python-sdk)
        run: uv sync --locked
      - name: Verify published package
        run: |
          set -euo pipefail
          uv run --frozen python - <<'PY'
          import importlib.metadata as metadata
          import tomllib
          from pathlib import Path

          pyproject = tomllib.loads(Path("pyproject.toml").read_text())
          declared = next(
              (
                  dependency.removeprefix("dex-python-sdk==")
                  for dependency in pyproject["project"]["dependencies"]
                  if dependency.startswith("dex-python-sdk==")
              ),
              None,
          )
          if declared is None:
              raise SystemExit("examples/python must depend on dex-python-sdk")

          package = next(
              package
              for package in tomllib.loads(Path("uv.lock").read_text())["package"]
              if package["name"] == "dex-python-sdk"
          )
          if "registry" not in package.get("source", {}):
              raise SystemExit("examples/python must depend on published dex-python-sdk, not a path dependency")

          installed = metadata.version("dex-python-sdk")
          print(f"dex-python-sdk {installed}")
          if installed != declared or installed != package["version"]:
              raise SystemExit(
                  f"installed {installed}, pyproject.toml {declared}, uv.lock {package['version']}"
              )
          PY
      - name: Integ tests with dexcli dev
        run: ./run-integ-tests.sh
      - name: Upload service logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-examples-integ-services-zd
          path: /tmp/test-python-examples-integ-services.log
          if-no-files-found: ignore
