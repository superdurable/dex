name: Python examples CI

on:
  workflow_dispatch:

jobs:
  integ:
    name: Install + integ tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: |
            cli/go.sum
            server/go.sum
            web/go.sum
      - name: Install Temporal CLI runtime for dexcli dev
        uses: temporalio/setup-temporal@v0
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.2"
          python-version: "3.9"
          working-directory: examples/python
          enable-cache: true
      - name: Install dependencies (PyPI dex-python-sdk)
        run: uv sync --locked
      - name: Verify published package
        run: |
          uv run --frozen python -c "import dex, importlib.metadata as m; print(m.version('dex-python-sdk')); assert m.version('dex-python-sdk') == '0.0.1'"
      - name: Integ tests with dexcli dev
        run: ./run-integ-tests.sh
      - name: Upload service logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-examples-integ-services
          path: /tmp/test-python-examples-integ-services.log
          if-no-files-found: ignore
