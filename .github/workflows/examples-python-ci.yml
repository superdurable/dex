name: Python examples CI

on:
  push:
    branches: [main]
    paths:
      - "examples/python/**"
      - "sdk-python/dex/tests/dex-service-env/**"
      - ".github/scripts/dump-docker-logs.sh"
      - ".github/workflows/examples-python-ci.yml"
  pull_request:
    paths:
      - "examples/python/**"
      - "sdk-python/dex/tests/dex-service-env/**"
      - ".github/scripts/dump-docker-logs.sh"
      - ".github/workflows/examples-python-ci.yml"
  workflow_dispatch:

jobs:
  integ:
    name: Install + integ tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/python
    steps:
      - uses: actions/checkout@v7
      - name: Start Dex environment
        working-directory: sdk-python/dex/tests/dex-service-env
        env:
          DEX_SERVER_IMAGE: superdurable/dex-server:latest
        run: |
          docker pull "$DEX_SERVER_IMAGE"
          docker compose up -d
      - name: Wait for Dex server
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          echo "Waiting for Elasticsearch..."
          for i in $(seq 1 60); do
            if docker exec temporal-elasticsearch-dex curl -fsS http://localhost:9200/_cluster/health >/dev/null 2>&1; then
              echo "Elasticsearch ready (attempt $i)"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "Timed out waiting for Elasticsearch"
              docker logs temporal-elasticsearch-dex 2>&1 | tail -80 || true
              exit 1
            fi
            sleep 5
          done
          echo "Waiting for search attributes..."
          for i in $(seq 1 120); do
            if docker logs temporal-admin-tools-dex 2>&1 | grep -q "All search attributes are registered"; then
              echo "Search attributes ready (attempt $i)"
              break
            fi
            if [ "$i" -eq 120 ]; then
              echo "Timed out waiting for search attributes"
              docker logs temporal-admin-tools-dex 2>&1 | tail -80 || true
              docker logs temporal-dex 2>&1 | tail -80 || true
              exit 1
            fi
            sleep 2
          done
          echo "Waiting for Dex healthcheck..."
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8801/info/healthcheck >/dev/null 2>&1; then
              echo "Dex server healthy (attempt $i)"
              exit 0
            fi
            sleep 2
          done
          echo "Timed out waiting for Dex server"
          docker logs dex-server 2>&1 | tail -80 || true
          exit 1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - name: Install Poetry
        run: pipx install poetry
      - name: Install dependencies (PyPI dex-sdk)
        run: poetry install --no-interaction
      - name: Verify published package
        run: |
          poetry run python -c "import dex, importlib.metadata as m; print(m.version('dex-sdk')); assert m.version('dex-sdk') == '0.0.1'"
      - name: Integ tests
        run: poetry run pytest -vv tests/
      - name: Dump docker logs
        if: always()
        run: bash "$GITHUB_WORKSPACE/.github/scripts/dump-docker-logs.sh"
