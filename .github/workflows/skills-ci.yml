name: Skills CI

on:
  pull_request:
    paths:
      - 'skills/**'
      # The doc-map folders; keep them in step with DOCS_DIRECTORIES in check-doc-map.py.
      - 'docs/content/concepts/**'
      - 'docs/content/components/**'
      - 'docs/content/design-patterns/**'
      - '.github/workflows/skills-ci.yml'
  workflow_dispatch:
  # Main CI (all) and release workflows call this suite on main and release commits.
  workflow_call:

permissions:
  contents: read

# Only pull request runs share a group, so superseded PR commits cancel; main and release runs never do.
concurrency:
  group: skills-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate package, links, and content boundaries
        run: python3 script/check-package.py
      - name: Validate the skills and docs map
        run: python3 script/check-doc-map.py
      - name: Test validators and tools
        run: python3 -m unittest discover -s test -p 'test_*.py'
      - name: Test lifecycle version hook
        run: node --test test/version-check.test.mjs
      # Check Gate CI runs the description checks; this run depends only on the commit.
