name: Skills CI

on:
  pull_request:
    # edited re-runs the checks when the description gains an opt-out line.
    types: [opened, synchronize, reopened, edited]
    paths:
      - 'skills/**'
      # The doc-map folders; keep them in step with DOCS_DIRECTORIES in check-doc-map.py.
      - 'docs/content/primitives/**'
      - 'docs/content/design-patterns/**'
      - '.github/workflows/skills-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'skills/**'
      - 'docs/content/primitives/**'
      - 'docs/content/design-patterns/**'
      - '.github/workflows/skills-ci.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate package, links, and content boundaries
        run: python3 script/check-package.py
      - name: Validate the skills and docs map
        run: python3 script/check-doc-map.py
      - name: Test validators and tools
        run: python3 -m unittest discover -s test -p 'test_*.py'
      - name: Test lifecycle version hook
        run: node --test test/version-check.test.mjs
      - name: Enforce release metadata
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 script/check-package.py --base-ref "$BASE_SHA" --pr-body="$PR_BODY"
      - name: Require skills and docs to change together
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 script/check-doc-map.py --base-ref "$BASE_SHA" --pr-body="$PR_BODY"
