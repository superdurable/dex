codecov:
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  range: "60...100"
  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: true
    patch:
      default:
        target: 90%
        threshold: 1%
        informational: true

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: false

flag_management:
  default_rules:
    carryforward: true

component_management:
  individual_components:
    - component_id: server
      name: Server
      paths:
        - server/**
    - component_id: sdk-go
      name: Go SDK
      paths:
        - sdk-go/**
    - component_id: sdk-rust
      name: Rust Core
      paths:
        - sdk-rust/**
    - component_id: sdk-java
      name: Java SDK
      paths:
        - sdk-java/**
    - component_id: sdk-python
      name: Python SDK
      paths:
        - sdk-python/**
    - component_id: sdk-typescript
      name: TypeScript SDK
      paths:
        - sdk-typescript/**

ignore:
  - "server/gen/**/*"
  - "sdk-go/gen/**/*"
  - "sdk-typescript/src/gen/**/*"
  - "**/*_test.go"
  - "**/mock*.go"
