[workspace]
members = [
    "crates/dex-blob-cache",
    "crates/dex-blob-cache-jni",
    "crates/dex-blob-cache-node",
    "crates/dex-blob-cache-python",
    "crates/dex-protocol",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"
repository = "https://github.com/superdurable/dex"
rust-version = "1.88"

[workspace.dependencies]
crc32c = "0.6"
jni = "0.21"
napi = { version = "3.12.0", default-features = false }
napi-build = "2.4.0"
napi-derive = "3.6.2"
pyo3 = "0.23"
prost = "0.14"
prost-types = "0.14"
protoc-bin-vendored = "3.2"
sha2 = "0.10"
stretto = "0.9"
tempfile = "3"
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
