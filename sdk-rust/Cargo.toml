[workspace]
members = [
    "crates/dex-blob-cache",
    "crates/dex-blob-cache-jni",
    "crates/dex-core",
    "crates/dex-protocol",
    "crates/dex-runtime",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"
repository = "https://github.com/superdurable/dex"
rust-version = "1.88"

[workspace.dependencies]
crc32c = "0.6"
jni = "0.21"
prost = "0.14"
prost-types = "0.14"
protoc-bin-vendored = "3.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
stretto = "0.9"
tempfile = "3"
tokio = { version = "1", features = ["net", "rt-multi-thread", "sync"] }
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
