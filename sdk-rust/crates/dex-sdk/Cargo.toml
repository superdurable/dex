[package]
name = "dex-sdk"
description = "Strongly typed Rust SDK for Dex"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = ["crates-io"]

[dependencies]
bytes = "1"
dex-blob-cache.workspace = true
dex-protocol.workspace = true
gethostname.workspace = true
http-body = "1"
http-body-util = "0.1"
prost.workspace = true
prost-types.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.5"
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
sha2.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
tracing.workspace = true
uuid.workspace = true

[features]
default = ["api-key-credential"]
api-key-credential = ["dep:reqwest"]

[dev-dependencies]
axum = "0.8"
h2 = "0.4"
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tempfile.workspace = true
tonic-prost.workspace = true
trybuild = "1.0"

[lints]
workspace = true
