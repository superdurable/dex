[project]
name = "dex-python-sdk"
version = "0.0.1"
description = "Python SDK for the Dex workflow engine"
authors = [{name = "Super Durable"}]
readme = "README.md"
license = "LicenseRef-Super-Durable-1.0"
license-files = ["LICENSE", "LEGACY_NOTICES.md", "LICENSES/**"]
requires-python = ">=3.11"
dependencies = [
    "grpcio>=1.83.0",
    "httpx==0.28.1",
    "protobuf>=7.35.1",
]

[project.urls]
Homepage = "https://github.com/superdurable/dex/tree/main/sdk-python"
Repository = "https://github.com/superdurable/dex"

[dependency-groups]
dev = [
    "anyio>=4.9,<5",
    "black==24.10.0",
    "flask>=2.3.2,<3",
    "grpcio-tools==1.83.0",
    "isort>=6.0.1,<7",
    "mypy>=1.15,<2",
    "pre-commit>=4.2,<5",
    "pyright>=1.1.403,<2",
    "pytest>=8.3.5,<9",
    "pytest-cov>=6.1.1,<7",
    "pytest-env>=1.1.5,<2",
    "ruff==0.8.1",
    "wemake-python-styleguide>=0.19.2,<0.20",
]

[tool.uv]
required-version = "==0.12.2"

[tool.uv.build-backend]
module-name = "dex"
module-root = ""
source-include = ["LEGACY_NOTICES.md", "LICENSES/**"]

[tool.ruff]
lint.ignore = ["E501"]

[tool.isort]
profile = "black"
multi_line_output = 3
src_paths = ["dex",]

[tool.mypy]
ignore_missing_imports = true
allow_subclassing_any = true
allow_untyped_calls = true
pretty = true
show_error_codes = true
implicit_reexport = true
allow_untyped_decorators = true
warn_unused_ignores = false
warn_return_any = false
namespace_packages = true

[build-system]
requires = ["uv_build>=0.11.32,<0.13"]
build-backend = "uv_build"
