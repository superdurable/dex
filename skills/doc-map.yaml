# Maps each skills file to the docs pages that hold the same stable knowledge.
# Skills are the coding-agent copy of the docs Primitives, Components, and
# Design patterns. A pull request that changes a file on one side must change
# a mapped file on the other side, or its description must contain a line
# 'doc-map: no change needed: <reason>'. script/check-doc-map.py enforces it.
#
# Format: a list of entries. 'skill' is relative to skills/; each 'docs' path
# is relative to the repository root and lives under docs/content/primitives/
# or docs/content/design-patterns/, the folders that trigger Skills CI. Only the
# English docs pages are listed. Skills files with no docs counterpart are left
# out: dex-app-builder/SKILL.md, product-discovery.md, workflow-import.md,
# n8n-semantics.md, and dex-connector-contributor/SKILL.md.

