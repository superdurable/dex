# Maps each skills file to the docs pages that hold the same stable knowledge.
# Skills are the coding-agent copy of the docs Concepts, Components, and
# Design patterns. A pull request that changes a file on one side must change
# a mapped file on the other side, or its description must contain a line
# 'doc-map: no change needed: <reason>'. script/check-doc-map.py enforces it.
#
# Format: 'mappings' lists entries. 'skill' is relative to skills/; each 'docs'
# path is relative to the repository root and lives under
# docs/content/concepts/, docs/content/components/, or
# docs/content/design-patterns/, the folders that trigger Skills CI. Only the English docs pages are listed.
#
# 'unmapped' classifies files with no counterpart, by repository path or
# fnmatch pattern. Every Markdown file in the three skills and every page in
# the two docs folders must be mapped or unmapped, so a new file needs a
# decision.

