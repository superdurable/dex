[package]
name = "dexzd-simulation"
description = "Deterministic simulation tests that run the server-zd engine against simulated object storage, clocks, Workers, and crashes"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
bytes.workspace = true
dexzd-api.workspace = true
# The apply checker stages time travel the way an owner does, through the test-util entry point.
dexzd-apply = { workspace = true, features = ["test-util"] }
dexzd-clock.workspace = true
dexzd-cluster-metadata.workspace = true
dexzd-engine = { workspace = true, features = ["test-util"] }
dexzd-history-segment.workspace = true
dexzd-keyspace.workspace = true
dexzd-log.workspace = true
dexzd-metrics.workspace = true
# The versioned storage semantics reproduce through seeded version IDs.
dexzd-object-store = { workspace = true, features = ["test-util"] }
dexzd-protocol.workspace = true
dexzd-request-validation.workspace = true
dexzd-storage.workspace = true
dexzd-stream-store.workspace = true
dexzd-worker-dispatch.workspace = true
futures.workspace = true
prost.workspace = true
rand.workspace = true
rand_chacha.workspace = true
thiserror.workspace = true
# The engine simulation runs its own current-thread runtime with paused time.
tokio = { workspace = true, features = ["test-util"] }
tracing.workspace = true
xxhash-rust.workspace = true

[dev-dependencies]
# Time travel target resolution tests compare apply's resolutions through its test-util oracles.
dexzd-apply = { workspace = true, features = ["test-util"] }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
