[package]
name = "dexzd-object-store"
description = "Object storage interface used by server-zd, with S3 and db9 implementations and a fault-injecting in-memory implementation for tests"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
db9-integration = []
# Exposes deterministic constructors for simulations.
test-util = []

[dependencies]
dexzd-postgres-connection.workspace = true
tokio-postgres.workspace = true
uuid.workspace = true
dexzd-metrics.workspace = true
async-trait.workspace = true
aws-config.workspace = true
aws-lc-rs.workspace = true
aws-sdk-s3.workspace = true
aws-sigv4.workspace = true
base64.workspace = true
bytes.workspace = true
dexzd-clock = { path = "../dexzd-clock" }
md-5.workspace = true
object_store.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
http.workspace = true
time.workspace = true
url.workspace = true
# Streams create-only file bodies of the Tencent COS dialect.
reqwest = { workspace = true, features = ["stream"] }
humantime.workspace = true
rand.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
# Enables test-util for this crate's own integration tests.
dexzd-object-store = { workspace = true, features = ["test-util"] }
rand_chacha.workspace = true
s3local.workspace = true
s3local-server.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
