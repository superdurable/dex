// Persistent format of server-zd Flow state rows in the local store. Keys are defined in
// dexzd-keyspace (key_layout.rs); each message below names its table.
// Compatibility: additive changes only; never renumber, reuse, or retype a field.
syntax = "proto3";

package dexzd.v1;

import "dex.proto";
import "dexzd/v1/command.proto";

// ---------------------------------------------------------------------------------------------
// Values
// ---------------------------------------------------------------------------------------------

// Identity of a value stored in the run's value table.
message StoredValueId {
  uint64 run_seq = 1;
  uint32 index_in_command = 2;
}

// A value as kept in state rows: inline when small, otherwise a reference to the value table,
// or a hard-delete Attribute object.
message StoredValue {
  oneof kind {
    // Complete value no larger than the run's wire inline threshold.
    dex.Value inline_value = 1;
    StoredValueReference table_value = 2;
    HardDeleteObjectReference hard_delete_object = 3;
  }
}

// Reference to a value-table row.
message StoredValueReference {
  StoredValueId value_id = 1;
  uint64 size_bytes = 2;
  // Whether the value is a string (true) or an object; selects the wire reference field.
  bool is_string_value = 3;
}

// Row of RunTable::Value (column family `value`): the complete value.
message ValueRecord {
  dex.Value value = 1;
}

// Row of RunTable::ValueBirth (table B): size and the seq of the command that wrote it.
message ValueBirthRecord {
  uint64 size_bytes = 1;
  uint64 written_seq = 2;
  // Seq at which the value lost its last holder (its key in table G); zero while held.
  uint64 garbage_seq = 3;
  // The value row was deleted after its history segment was uploaded. The superseded value is
  // then read from the uploaded segment that covers garbage_seq, and the row has no G row.
  bool is_offloaded = 4;
}

// Row of RunTable::ValueGarbage (table G), keyed by (lost_last_holder_seq, value ID).
message ValueGarbageRecord {
  uint64 size_bytes = 1;
  // Proposal time of the command that superseded the value; zero in rows written before the
  // field existed.
  int64 superseded_at_micros = 2;
}

// A key-value pair whose value is stored.
message StoredKeyValue {
  string key = 1;
  StoredValue value = 2;
}

// ---------------------------------------------------------------------------------------------
// Flow directory and run records
// ---------------------------------------------------------------------------------------------

// Row of the Flow directory: every retained run of (tenant ID, Flow ID), oldest first.
message FlowDirectoryRecord {
  repeated FlowDirectoryRun runs = 1;
}

message FlowDirectoryRun {
  bytes run_id = 1;
  dex.FlowStatus status = 2;
  int64 started_at_micros = 3;
  int64 closed_at_micros = 4;
  string start_request_id = 5;
}

// Row of RunTable::RunRecord: run-scoped state that time travel never rolls back, plus the
// current attempt's status for fast reads.
message RunRecord {
  uint64 tenant_id = 1;
  string flow_id = 2;
  bytes run_id = 3;
  string flow_type = 4;
  string start_request_id = 5;
  int64 started_at_micros = 6;
  RunSettings settings = 7;
  // Status and close details of the current attempt.
  dex.FlowStatus status = 8;
  int64 closed_at_micros = 9;
  FlowCloseRecord close = 10;
  uint32 current_attempt = 11;
  // Seq assigned to the next command applied to the run (starts at 1).
  uint64 next_run_seq = 12;
  // Event ID assigned to the next projected history event (starts at 1).
  int64 next_event_id = 13;
  // Run-scoped FlowConfig, including the normalized Worker target.
  dex.FlowConfig flow_config = 14;
  // Flow timeout: absolute deadline, policy, and handler options. Zero deadline means none.
  int64 timeout_deadline_micros = 15;
  dex.FlowTimeoutPolicy timeout_policy = 16;
  dex.FlowTimeoutHandlerOptions timeout_handler_options = 17;
  // Set for child Flows.
  ParentFlowReference parent = 18;
  string sticky_app_worker_id = 19;
  // First seq inside the time travel window (W).
  uint64 window_start_seq = 20;
  // Largest seq of a pruned command that carried external input; see D12 in the plan.
  uint64 max_pruned_external_input_seq = 21;
  RunStorageUsage storage = 22;
  // Semantic events recorded so far, for window accounting.
  uint64 semantic_event_count = 23;
  // Seq of the latest checkpoint of the current attempt and the attempt-scoped row bytes written
  // since, summed per write; see RunSettings.checkpoint_row_write_bytes_threshold.
  uint64 last_checkpoint_seq = 24;
  uint64 row_write_bytes_since_checkpoint = 25;
  uint32 commands_since_checkpoint = 26;
  // Renamed field; this name must never be used again.
  reserved "written_bytes_since_checkpoint";
  // True after retention expired and the prefix purge started.
  // Retention sets it only once no outbox item awaits acknowledgment; it never becomes false again.
  bool is_purging = 27;
  int64 retention_deadline_micros = 28;
  // A Step returned GracefulComplete; the attempt completes once no user Step is active.
  bool is_graceful_completion_requested = 29;
  // Semantic events that left the window; the window holds semantic_event_count minus this.
  uint64 pruned_semantic_event_count = 30;
  // Size of the latest checkpoint's rows; the checkpoint rule's attempt state size.
  uint64 last_checkpoint_state_bytes = 31;
  // Next history seq to inspect when window advancement crosses a long bookkeeping span.
  uint64 window_scan_seq = 32;
  // Additional parents attached to this child run through SubFlow reuse.
  repeated ParentFlowReference attached_parents = 40;
  // Largest timestamp of a pruned semantic point; earlier reset times target a pruned point.
  int64 last_pruned_semantic_timestamp_micros = 55;
  // Set while a natural close waits for the Attribute Sync outbox; the status stays RUNNING.
  PendingFlowClose pending_close = 56;
  // Newest event ID before the window start, which reads hide after FlowStart; 0 means unknown and
  // reads scan from the window start.
  int64 max_pruned_event_id = 57;
  // Window events recorded so far: each history record adds its event count, or one when it is
  // semantic without events. Unset in runs recorded before the window counted events; their next
  // command starts it at semantic_event_count.
  optional uint64 window_event_count = 58;
  // Window events of the records before the window start; the window holds window_event_count
  // minus this.
  uint64 pruned_window_event_count = 59;
  // First seq of the open history segment; zero means the run has no segment state, as in runs
  // that started while their partition did not offload history.
  uint64 history_open_segment_first_seq = 60;
  // Bytes of history records, checkpoints, and superseded values in the open segment.
  uint64 history_open_segment_bytes = 61;
  // Values superseded inside the open segment.
  uint64 history_open_segment_superseded_value_count = 62;
  // Last seq of the newest uploaded history segment (U); zero before the first upload.
  uint64 history_uploaded_through_seq = 63;
  // Seq that started migrating older history; zero when not migrating. The open segment then
  // tracks no bytes.
  uint64 history_migration_started_seq = 64;
  // First event ID the open history segment can hold: the run's next event ID when it opened.
  int64 history_open_segment_first_event_id = 66;
  // The run's staged TimeTravel result, whose chunks are RunTable::TimeTravelStaging rows; unset
  // when the run has none.
  TimeTravelStagingState time_travel_staging = 65;
  // Last seq through which the history records and checkpoints of uploaded segments were deleted
  // locally; zero before the first deletion. Rows of seqs no uploaded segment covers stay.
  uint64 history_local_rows_deleted_through_seq = 67;
  // Last superseded seq through which the values of uploaded segments were offloaded or passed
  // over; zero before the first offload.
  uint64 history_values_offloaded_through_seq = 68;
  // Last seq after genesis through which window pruning deleted history; reads of uploaded
  // history show no seq between genesis and it. Zero in runs that have not recorded it, whose
  // readers take the seq before the first kept HistoryRecord metadata row instead.
  uint64 history_window_pruned_through_seq = 69;
  // Last seq of the newest history segment that expired because window pruning passed it; zero
  // before the first expiry. Every segment that starts after genesis and ends at or before it is
  // EXPIRED or deleted; the segment that holds genesis never expires.
  uint64 history_expired_through_seq = 70;
  // Last seq of the newest expired history segment whose object the owner deleted and whose
  // catalog row is gone; zero before the first deletion. Objects are deleted oldest first.
  uint64 history_objects_deleted_through_seq = 71;
}

// A staged TimeTravel result of a run; see TimeTravelStageCommand.
message TimeTravelStagingState {
  bytes staging_id = 1;
  // Chunks staged so far; chunk i is the row with key i.
  uint32 chunk_count = 2;
  // True once the last chunk is staged.
  bool is_complete = 3;
  // Proposal time of the latest chunk's command; a later command deletes a staging idle for
  // 10 minutes.
  int64 staged_at_micros = 4;
}

// A natural close waiting for the run's Attribute Sync outbox; its Steps are canceled already.
message PendingFlowClose {
  dex.FlowStatus status = 1;
  dex.FlowErrorType error_type = 2;
  // Message of the Flow result.
  string error_message = 3;
  // Message of the FlowClosed history event.
  string history_message = 4;
}

// Close details of a closed attempt.
message FlowCloseRecord {
  dex.FlowErrorType error_type = 1;
  string error_message = 2;
  repeated StoredStepCompletionOutput results = 3;
  // True when a child already reported this close to its parent.
  bool is_reported_to_parent = 4;
  // True when the close skipped the Attribute Sync barrier (StopFlow or termination); absent in
  // older records.
  optional bool is_closed_at_once = 5;
  // FlowClosed message when it differs from the result message.
  optional string history_message = 6;
}

message StoredStepCompletionOutput {
  string completed_step_type = 1;
  string completed_step_execution_id = 2;
  StoredValue completed_step_output = 3;
}

// Storage bytes of the run, maintained by apply (plan 5.9 rule 2).
message RunStorageUsage {
  uint64 state_row_bytes = 1;
  uint64 live_value_bytes = 2;
  uint64 superseded_value_bytes = 3;
  uint64 history_bytes = 4;
  // Part of state_row_bytes held by started or retrying attempts; zero in older records.
  uint64 attempt_state_bytes = 5;
}

// Small Flow row indexed by history seq, kind, and attempt for bounded window scans and accounting.
message HistoryRowMetadata {
  uint64 row_size_bytes = 1;
  bool is_semantic = 2;
  bool is_external_input = 3;
  uint32 attempt = 4;
  int64 timestamp_micros = 5;
  // Run's newest event ID when this record was written; zero for checkpoints and older rows.
  int64 last_assigned_event_id = 6;
  // The record's pending_step_methods; empty for checkpoints and older rows.
  repeated HistoryStepMethodPending pending_step_methods = 7;
  // Largest event ID in the record; zero when it has no events, for checkpoints, and older rows.
  int64 max_event_id = 8;
  // Error message of the record's FlowClosed event; unset without one and in older rows.
  optional string flow_closed_message = 9;
  // RunRecord.window_event_count before this record was written. Unset for checkpoints and rows
  // written before the window counted events; such a row counts one event when it is semantic.
  optional uint64 window_event_count_before = 10;
}

// Row of RunTable::AttemptRecord, keyed by attempt (4 bytes big-endian).
message AttemptRecord {
  uint32 attempt = 1;
  // Point this attempt was forked from; zero for attempt 1.
  uint32 parent_attempt = 2;
  uint64 parent_seq = 3;
  // Seq of the command that created the attempt (FlowStart or TimeTravel).
  uint64 start_seq = 4;
  int64 created_at_micros = 5;
  string reason = 6;
  // Seqs of the retained checkpoints of this attempt, ascending. The first is the start
  // checkpoint.
  repeated uint64 checkpoint_seqs = 7;
}

// ---------------------------------------------------------------------------------------------
// Attribute, Channel, and permission state of the current attempt
// ---------------------------------------------------------------------------------------------

// Row of RunTable::Attribute, keyed by the Attribute key.
message AttributeRecord {
  StoredValue value = 1;
  dex.IndexConfig index_config = 2;
  dex.AttributeSyncConfig sync_config = 3;
  uint64 written_seq = 4;
  bool is_hard_delete_on_null = 5;
}

// Row of RunTable::ChannelMessage, keyed by channel name, 0x00, and enqueue seq (8 bytes).
message ChannelMessageRecord {
  string channel_name = 1;
  string message_id = 2;
  StoredValue value = 3;
  uint64 enqueued_seq = 4;
}

// Row of RunTable::ChannelMeta, keyed by channel name.
message ChannelMetaRecord {
  uint64 pending_count = 1;
  // Messages consumed into condition results whose Execute has not finished.
  uint64 claimed_count = 2;
}

// Row of RunTable::PermissionSet (single row): work queue permissions, sorted, only growing.
message PermissionSetRecord {
  repeated string permissions = 1;
}

// ---------------------------------------------------------------------------------------------
// Step executions, invocations, locks, timers, waiters
// ---------------------------------------------------------------------------------------------

// Lifecycle phase of a Step execution.
enum StepExecutionPhase {
  STEP_EXECUTION_PHASE_UNSPECIFIED = 0;
  // WaitFor is pending or running.
  STEP_EXECUTION_PHASE_WAIT_FOR = 1;
  // WaitFor completed; waiting for its condition.
  STEP_EXECUTION_PHASE_WAITING = 2;
  // Execute is pending or running.
  STEP_EXECUTION_PHASE_EXECUTE = 3;
  STEP_EXECUTION_PHASE_COMPLETED = 4;
  STEP_EXECUTION_PHASE_CANCELED = 5;
  // A method exhausted its retries; the Flow failed.
  STEP_EXECUTION_PHASE_FAILED = 6;
}

// Row of RunTable::StepExecution, keyed by Step execution ID.
message StepExecutionRecord {
  string step_execution_id = 1;
  string step_type = 2;
  uint32 step_number = 3;
  StoredValue input = 4;
  dex.StepOptions options = 5;
  string from_step_execution_id = 6;
  StepExecutionPhase phase = 7;
  uint64 created_seq = 8;
  int64 created_at_micros = 9;
  repeated StoredKeyValue locals = 10;
  // Set only while the Step is WAITING.
  WaitStateRecord wait = 11;
  // Set when the wait completes; released when the Step ends.
  ConditionResultsRecord condition_results = 12;
  // The method call of the current phase, when one exists.
  StepInvocationRecord invocation = 13;
  // True for the Flow timeout handler `sys:timeout_handler-1`.
  bool is_timeout_handler = 14;
  uint64 completed_seq = 15;
  // Retained through Execute until the Step finishes or is canceled.
  dex.PullRouting wait_for_pull_routing = 16;
  dex.RecoveryErrorInfo recovery_error = 17;
  // Timer indexes skipped through SkipTimer, retained through Execute.
  repeated uint32 skipped_timer_indexes = 18;
  // Event ID of the history event that started this execution; zero when none or in older rows.
  int64 from_event_id = 19;
  // Event ID of the StepWaitForCompleted event; zero before it and in older rows.
  int64 wait_for_completed_event_id = 20;
  // Event time of the StepWaitForCompleted event in microseconds; zero whenever field 20 is zero.
  int64 wait_for_completed_at_micros = 21;
  // Set on cancel: true when the canceling command recorded FlowClosed.
  // Unset for other phases and in older rows.
  optional bool is_canceled_by_flow_close = 22;
}

// Phase of one logical method call.
enum StepInvocationPhase {
  STEP_INVOCATION_PHASE_UNSPECIFIED = 0;
  // Waiting for locks or for dispatch.
  STEP_INVOCATION_PHASE_PENDING = 1;
  // An attempt is running on a Worker.
  STEP_INVOCATION_PHASE_RUNNING = 2;
  // The last attempt failed; a retry backoff timer is armed.
  STEP_INVOCATION_PHASE_BACKOFF = 3;
}

message StepInvocationRecord {
  StepMethod method = 1;
  StepInvocationPhase phase = 2;
  // Attempt that is pending, running, or (in backoff) the next one.
  uint32 attempt = 3;
  int64 first_attempt_at_micros = 4;
  // Seq at which the current attempt became pending; orders the per-key lock queue.
  uint64 pending_since_seq = 5;
  bytes task_id = 6;
  int64 attempt_started_at_micros = 7;
  // Lock keys this method needs; held only while RUNNING.
  repeated string lock_keys = 8;
  // Snapshot of the running attempt.
  MethodSnapshotRecord snapshot = 9;
  dex.StepMethodFailure last_failure = 10;
  StoredValue heartbeat_checkpoint = 11;
  int64 backoff_fires_at_micros = 12;
  dex.PullRouting pull_routing = 13;
  // Resolved at method scheduling and kept across retries.
  dex.StepDurability effective_durability = 15;
  // Start of the retry total duration: when attempt 1 started, after its locks.
  // Zero on older records.
  int64 retry_started_at_micros = 16;
  // Furthest progress across ended attempts of this method call. Zero on older records.
  dex.StepAttemptProgress furthest_attempt_progress = 17;
  // When the current attempt became pending: the command that made it pending, or the
  // TimeTravel that restored it. Returns keep it. Zero on older records, which use
  // first_attempt_at_micros. It orders the DispatchQueue index.
  int64 pending_since_micros = 19;
}

// Row of IndexKind::DispatchQueue: a pending Step attempt that waits for a Worker.
message DispatchQueueRecord {
  // Attempt number, also in the key.
  uint32 attempt = 1;
  // Run attempt of the pending attempt; a Claim of an older run attempt is stale.
  uint32 run_attempt = 2;
}

// Exactly what a Worker receives for one attempt, with values kept as stored values.
message MethodSnapshotRecord {
  repeated StoredKeyValue attributes = 1;
  map<string, dex.ChannelInfo> channel_infos = 2;
  repeated LoadedChannelMessagesRecord loaded_channel_messages = 3;
  repeated string loaded_attribute_map_instances = 4;
  repeated string loaded_channel_names = 5;
  repeated string loaded_channel_map_instances = 6;
  // Execute only: the Step's condition results, unchanged across attempts and held by
  // ConditionResult holders until the Step ends. The dispatcher builds
  // InvokeExecuteMethodRequest.condition_results from it: values only, through wire references.
  ConditionResultsRecord condition_results = 7;
}

message LoadedChannelMessagesRecord {
  string channel_name = 1;
  repeated ChannelMessageRecord messages = 2;
}

// A registered wait condition.
message WaitStateRecord {
  dex.WaitingCondition condition = 1;
  // Absolute fire times of the timer conditions, in declaration order.
  repeated int64 timer_fire_at_micros = 2;
  repeated dex.ConditionStatus timer_statuses = 3;
  // Child Flow IDs started for the SubFlow conditions, in declaration order.
  repeated string sub_flow_child_ids = 4;
  uint64 started_waiting_seq = 5;
  // Attempt that registered these SubFlow conditions, retained across time travel.
  uint32 sub_flow_registration_attempt = 6;
}

// Condition results consumed when the wait completed.
message ConditionResultsRecord {
  repeated ChannelResultRecord channel_results = 1;
  repeated dex.TimerResult timer_results = 2;
  bool wait_for_failed = 3;
  repeated StoredFlowResult sub_flow_results = 4;
}

message ChannelResultRecord {
  string condition_id = 1;
  dex.ConditionStatus condition_status = 2;
  string channel_name = 3;
  repeated ChannelMessageRecord messages = 4;
}

message StoredFlowResult {
  dex.FlowStatus flow_status = 1;
  repeated StoredStepCompletionOutput results = 2;
  dex.FlowErrorType error_type = 3;
  string error_message = 4;
}

// Row of RunTable::StepCounter, keyed by Step type.
message StepCounterRecord {
  uint32 last_step_number = 1;
}

// Row of RunTable::LockTable, keyed by lock key (Attribute key or `map/instance`).
message LockRecord {
  // Running invocation that holds the lock; empty when free.
  StepInvocationKey holder = 1;
  uint32 holder_attempt = 2;
  // Pending invocations waiting for this key, in FIFO order of pending_since_seq.
  repeated LockWaiterRecord waiters = 3;
}

message LockWaiterRecord {
  StepInvocationKey invocation = 1;
  uint64 pending_since_seq = 2;
}

// Row of RunTable::Timer, keyed by the encoded TimerId.
message TimerRecord {
  TimerId timer_id = 1;
  int64 fire_at_micros = 2;
}

// Row of RunTable::Waiter, keyed by channel name, 0x00, and Step execution ID: Steps whose
// condition depends on the channel.
message ChannelWaiterRecord {
  uint64 started_waiting_seq = 1;
}

// ---------------------------------------------------------------------------------------------
// Cross-Flow messages, deduplication, child results
// ---------------------------------------------------------------------------------------------

// Row of RunTable::Outbox, keyed by message ID.
message OutboxRecord {
  bytes message_id = 1;
  CrossFlowEndpoint target = 2;
  oneof payload {
    ChildFlowStartMessage child_start = 3;
    ChildFlowCompletedMessage child_completed = 4;
  }
  uint64 written_seq = 5;
  // Set when the receiver acknowledged; the row is deleted when its retention timer fires.
  int64 acknowledged_at_micros = 6;
  // Values pinned while this message is retained.
  repeated StoredValue held_values = 7;
}

// Row of RunTable::AttributeSyncOutbox, keyed by length-prefixed store name and Attribute key.
message AttributeSyncOutboxRecord {
  string store_name = 1;
  string attribute_key = 2;
  // Run seq of the latest command that marked this entry.
  uint64 written_seq = 3;
  // Start of the retry window: the first marking, or the last ack that left a newer marking
  // pending.
  int64 retry_window_started_at_micros = 4;
  // The latest synced value, or a store deletion; absent only on legacy rows.
  oneof sync_item {
    dex.Value value = 5;
    bool is_delete = 6;
  }
}

// Row of RunTable::InboxDedup, keyed by source run ID (16 bytes) and message ID (16 bytes).
message InboxDedupRecord {
  uint64 received_seq = 1;
}

// Row of RunTable::RequestDedup, keyed by request kind (1 byte) and request ID.
message RequestDedupRecord {
  bytes request_fingerprint = 1;
  CommandReply reply = 2;
  uint64 recorded_seq = 3;
}

// Row of RunTable::SubFlowResult, keyed by registration attempt and child Flow ID.
message SubFlowResultRecord {
  bytes child_run_id = 1;
  uint32 child_run_attempt = 2;
  StoredFlowResult result = 3;
  uint64 received_seq = 4;
  uint32 parent_registration_attempt = 5;
}

// Row of RunTable::HardDeleteObject: key 0x00 + Attribute key is the current object; key 0x01 +
// object ID is an object waiting for deletion.
message HardDeleteObjectRecord {
  HardDeleteObjectReference object = 1;
  uint64 written_seq = 2;
}

// ---------------------------------------------------------------------------------------------
// Replies
// ---------------------------------------------------------------------------------------------

// Result of applying a command, returned to the proposer and remembered for request IDs.
message CommandReply {
  oneof reply {
    CommandErrorReply error = 1;
    StartFlowReply start_flow = 2;
    RpcReply rpc = 3;
    TimeTravelReply time_travel = 4;
    EmptyReply ok = 5;
  }
}

// A rejected command. Apply wrote nothing except, where noted, deduplication records.
message CommandErrorReply {
  // gRPC status code.
  int32 grpc_code = 1;
  dex.ErrorSubStatus sub_status = 2;
  string message = 3;
}

message StartFlowReply {
  bytes run_id = 1;
  // True when the run already existed (same request ID, or ignore_already_started_error).
  bool is_existing_run = 2;
}

message RpcReply {
  StoredValue output = 1;
}

message TimeTravelReply {
  uint32 run_attempt = 1;
}

message EmptyReply {}

// ---------------------------------------------------------------------------------------------
// History and checkpoints
// ---------------------------------------------------------------------------------------------

// Row of RunTable::HistoryRecord (column family `history`), keyed by run seq (8 bytes).
message HistoryRecord {
  uint64 seq = 1;
  uint32 attempt = 2;
  int64 timestamp_micros = 3;
  // Semantic events are time travel targets and count toward the window.
  bool is_semantic = 4;
  // True when the command carried external input that time travel may reapply.
  bool is_external_input = 5;
  // The command with every value larger than the inline threshold replaced by a reference.
  // During the MVP, apply stores the complete command; readers must accept both forms.
  FlowCommand command = 6;
  // History events projected from this command, with their event IDs.
  repeated dex.FlowHistoryEvent events = 7;
  // Debug builds only: hash of the attempt state after this command.
  bytes state_hash = 8;
  // Method calls whose first attempt became pending; time travel targets use them.
  repeated HistoryStepMethodPending pending_step_methods = 9;
  // TimeTravel only: external input it reapplied, in order, so later travels before it reapply it.
  repeated FlowCommand reapplied_inputs = 10;
}

// A Step method call whose first attempt became pending.
message HistoryStepMethodPending {
  string step_execution_id = 1;
  string step_type = 2;
  StepMethod method = 3;
  // True when the same command created the Step execution.
  bool is_step_created = 4;
}

// Row of RunTable::Checkpoint (column family `history`), keyed by attempt (4 bytes) and seq
// (8 bytes): the attempt-scoped state right after the command at `seq`.
message CheckpointRecord {
  uint32 attempt = 1;
  uint64 seq = 2;
  repeated CheckpointRow rows = 3;
  // Attempt-scoped fields of the run record at this point.
  CheckpointRunStatus run_status = 4;
}

// The attempt-scoped part of a RunRecord: status, close details, graceful completion, and a
// pending close.
message CheckpointRunStatus {
  dex.FlowStatus status = 1;
  int64 closed_at_micros = 2;
  FlowCloseRecord close = 3;
  bool is_graceful_completion_requested = 4;
  // The natural close that waits for the Attribute Sync outbox at this point.
  PendingFlowClose pending_close = 5;
}

// One attempt-scoped state row: its table byte, key suffix, and encoded value.
message CheckpointRow {
  uint32 table = 1;
  bytes key_suffix = 2;
  bytes value = 3;
}

// Row of RunTable::TimeTravelStaging (column family `value`), keyed by chunk index (4 bytes
// big-endian).
//
// The parts of all chunks, in chunk order, form the staged result.
message TimeTravelStagedChunk {
  // Set only in chunk 0.
  TimeTravelStagedTarget target = 1;
  // Attempt-scoped rows of the target point.
  repeated CheckpointRow rows = 2;
  // Values the rows hold that the run's local store did not hold when the owner computed them.
  repeated TimeTravelStagedValue values = 3;
  // External input after the target point through the command's computed_through_seq, in
  // (run_seq, index_in_record) order.
  repeated TimeTravelStagedInput reapplied_inputs = 4;
}

// The point a staged TimeTravel result returns to, and what the result was computed for.
message TimeTravelStagedTarget {
  // Attempt whose lineage the request selected.
  uint32 selected_run_attempt = 1;
  // Attempt and run seq of the target point.
  uint32 run_attempt = 2;
  uint64 run_seq = 3;
  // Largest history event ID at the target point, for the fork event.
  int64 last_event_id = 4;
  // FlowClosed message of the target point's history, for closes recorded without one.
  optional string close_history_message = 5;
  // Attempt-scoped run status at the target point.
  CheckpointRunStatus run_status = 6;
  // ResetFlow request the result answers; the TimeTravel command carries the same request.
  dex.ResetFlowRequest request = 7;
  // Run attempt when the owner computed the result; the TimeTravel command expects it.
  uint32 expected_run_attempt = 8;
  // Last run seq the result covers; the TimeTravel command names the same seq.
  uint64 computed_through_seq = 9;
}

// A value that a staged TimeTravel result needs and the run's local store no longer held.
//
// Apply restores it only over the run's birth record of the value, whose size must match.
message TimeTravelStagedValue {
  StoredValueId value_id = 1;
  dex.Value value = 2;
}

// One external input a staged TimeTravel result reapplies.
message TimeTravelStagedInput {
  // Run seq of the history record that holds the input.
  uint64 run_seq = 1;
  // Position among that record's inputs; a TimeTravel record holds several.
  uint32 index_in_record = 2;
  FlowCommand command = 3;
}

// ---------------------------------------------------------------------------------------------
// Search
// ---------------------------------------------------------------------------------------------

// Row of RunTable::SearchDocument: what SearchFlows indexes for the run.
message SearchDocumentRecord {
  // Run seq of the last change; projections upsert only newer versions.
  uint64 version = 1;
  uint64 tenant_id = 2;
  string flow_id = 3;
  bytes run_id = 4;
  string flow_type = 5;
  dex.FlowStatus status = 6;
  int64 started_at_micros = 7;
  int64 closed_at_micros = 8;
  string parent_flow_id = 9;
  repeated string active_step_types = 10;
  repeated string work_queue_permissions = 11;
  repeated SearchAttributeValue attributes = 12;
}

message SearchAttributeValue {
  string index_key = 1;
  dex.IndexType index_type = 2;
  dex.Value value = 3;
}

// SearchOutbox index row keyed by seq, Flow hash, and run ID; seq is the command's
// proposed_at_micros.
message SearchOutboxRecord {
  uint64 tenant_id = 1;
  // The run was purged or is being purged; the projection deletes its row.
  bool is_purge = 2;
}

// Singleton of the SearchProjectionMode partition index. Absent means disabled.
message SearchProjectionModeRecord {
  // Apply appends SearchOutbox entries only while enabled.
  bool enabled = 1;
  // Highest sequence a SearchOutboxAckCommand deleted through; lower acks change nothing.
  uint64 acked_through_seq = 2;
  // Seq of the command that last enabled the mode; older SQL progress misses later changes.
  uint64 enabled_at_seq = 3;
}

// Singleton of the HistoryOffloadMode partition index. Absent means disabled.
message HistoryOffloadModeRecord {
  // The partition offloads run history to object storage while enabled.
  bool enabled = 1;
}

// State of a row of RunTable::HistorySegment.
enum HistorySegmentState {
  HISTORY_SEGMENT_STATE_UNSPECIFIED = 0;
  // Sealed by apply and waiting for upload; the HistoryUploadPending index names its run.
  HISTORY_SEGMENT_STATE_SEALED = 1;
  // Its object exists in object storage, and last_seq is at most the run's uploaded seq.
  HISTORY_SEGMENT_STATE_UPLOADED = 2;
  // Window pruning passed the whole segment, so no read uses it. Its object stays until the
  // owner deletes it or the run is purged.
  HISTORY_SEGMENT_STATE_EXPIRED = 3;
}

// Row of RunTable::HistorySegment, keyed by first_seq (8 bytes big-endian): the contiguous seq
// range [first_seq, last_seq] of one run's history that apply sealed for upload.
message HistorySegmentRecord {
  uint64 first_seq = 1;
  uint64 last_seq = 2;
  // Event IDs assigned inside the seq range; the range is empty when first_event_id is larger.
  int64 first_event_id = 3;
  int64 last_event_id = 4;
  HistorySegmentState state = 5;
  // Proposal time of the command that sealed the segment.
  int64 sealed_at_micros = 6;
  // Number of the segment's RunTable::HistorySegmentValue rows.
  uint64 superseded_value_count = 7;
  // Set by the upload acknowledgment: xxh3-128 of the object's uncompressed content.
  bytes content_checksum = 8;
  // Set by the upload acknowledgment: size of the uploaded object.
  uint64 object_size_bytes = 9;
  // Set at expiry: proposal time of the command that marked the segment EXPIRED.
  int64 expired_at_micros = 10;
}

// Row of RunTable::HistorySegmentValue, keyed by the segment's first_seq (8 bytes big-endian)
// and the value ID: a value that was superseded inside the segment when apply sealed it. A later
// revival of the value leaves the row unchanged. The segment's expiry deletes the row.
message HistorySegmentValueRecord {
  // Seq at which the value lost its last holder; inside the segment's seq range.
  uint64 superseded_seq = 1;
  uint64 size_bytes = 2;
}
