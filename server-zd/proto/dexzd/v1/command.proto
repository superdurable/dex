// Persistent format of server-zd commands: the records inside log batch frames.
// A command records what happened and all of its inputs; apply derives the result.
// Compatibility: additive changes only; never renumber, reuse, or retype a field.
syntax = "proto3";

package dexzd.v1;

import "dex.proto";

// One record in a partition frame of a log batch.
message LogRecord {
  uint32 partition = 1;
  // Field 2 is kept free for node-level commands of a later multi-node release.
  oneof body {
    FlowCommand flow = 3;
  }
}

// A command that changes the state of one Flow (its directory entry and its runs).
message FlowCommand {
  string flow_id = 1;
  // 16-byte run ID the command targets. Empty only for commands that may create a run
  // (FlowStart, and InboxMessage carrying a child start).
  bytes run_id = 2;
  // When non-zero, apply rejects the command unless the run's current attempt equals it.
  uint32 expected_run_attempt = 3;
  // Epoch of the owner that proposed the command.
  uint64 epoch = 4;
  // Behavior version that apply must use for this command.
  uint32 behavior_version = 5;
  // Owner wall clock, strictly increasing per partition. Apply uses only this time.
  int64 proposed_at_micros = 6;
  // 16-byte UUIDv7 for tracing from the API request to apply and its effects.
  bytes command_id = 7;
  // Tenant of the Flow; 0 for the single tenant.
  uint64 tenant_id = 8;
  // Owner stamp: an admitted transactional RPC is in flight, so a natural close waits for it.
  bool is_transactional_rpc_in_flight = 9;

  oneof command {
    FlowStartCommand flow_start = 20;
    FlowStopCommand flow_stop = 21;
    FlowConfigUpdateCommand flow_config_update = 22;
    AttributesSetCommand attributes_set = 23;
    ChannelPublishCommand channel_publish = 24;
    ChannelMessageDeleteCommand channel_message_delete = 25;
    StepAttemptStartedCommand step_attempt_started = 30;
    StepAttemptHeartbeatCommand step_attempt_heartbeat = 31;
    StepAttemptFailedCommand step_attempt_failed = 32;
    StepMethodCompletedCommand step_method_completed = 33;
    StepAttemptReturnedCommand step_attempt_returned = 34;
    StepAttemptQueuedCommand step_attempt_queued = 35;
    RpcCommittedCommand rpc_committed = 40;
    TimersFiredCommand timers_fired = 50;
    TimerSkipCommand timer_skip = 51;
    TimeTravelCommand time_travel = 60;
    TimeTravelStageCommand time_travel_stage = 61;
    InboxMessageCommand inbox_message = 70;
    OutboxAckCommand outbox_ack = 71;
    AttributeSyncAckCommand attribute_sync_ack = 72;
    PendingCloseCheckCommand pending_close_check = 73;
    SearchOutboxAckCommand search_outbox_ack = 74;
    SetSearchProjectionModeCommand set_search_projection_mode = 75;
    SetHistoryOffloadModeCommand set_history_offload_mode = 76;
    HardDeleteObjectsDeletedCommand hard_delete_objects_deleted = 80;
    RunPurgeCommand run_purge = 81;
    HistorySegmentUploadedCommand history_segment_uploaded = 82;
    HistorySegmentObjectsDeletedCommand history_segment_objects_deleted = 83;
    ValueReviveCommand value_revive = 84;
    HistoryLocalCleanupCommand history_local_cleanup = 85;
  }
}

// Limits and defaults that the owner resolved from configuration when the run started.
// Apply never reads configuration, so these travel in the command and live in the RunRecord.
message RunSettings {
  // Approximate number of history events in the time travel window (default 10000). A history
  // record without events counts as one event when it is semantic. A run's
  // FlowConfig.history_window_events overrides it. Runs that started before the window counted
  // events recorded their semantic window size here, which now counts events. Zero never prunes.
  uint32 history_window_events = 1;
  // Largest number of history events pruned at once when the window overflows (default 1000).
  // Apply prunes at most max(1, window / 10) events at once when that is smaller.
  uint32 history_prune_chunk_events = 2;
  // Renamed fields; these names must never be used again.
  reserved "history_window_semantic_events", "history_prune_chunk_semantic_events";
  // Bytes of superseded values the window may retain before it shrinks (default 256 MiB).
  uint64 max_retained_superseded_bytes = 3;
  // Time after close before the run is deleted (default 7 days).
  int64 retention_after_close_micros = 4;
  // Values up to this size are inline on the wire and in state rows (default 100).
  uint32 wire_inline_threshold_bytes = 5;
  // Largest accepted value (default 16 MiB).
  uint64 max_value_bytes = 6;
  // A checkpoint is written once the attempt-scoped row bytes written since the last checkpoint
  // reach max(this, min(the run's current state row bytes, the row bytes of the last
  // checkpoint)) (default 1 MiB). Attempt-scoped rows are Attribute, ChannelMessage, ChannelMeta,
  // StepExecution, StepCounter, Lock, Waiter, and Timer rows. Every write of such a row adds its
  // encoded size, and a large value counts only as its reference.
  uint64 checkpoint_row_write_bytes_threshold = 7;
  // A checkpoint is also written once this many commands have been applied to the run since the
  // last checkpoint, counting every command including bookkeeping (default 1000).
  uint32 checkpoint_command_threshold = 8;
  // Renamed fields; these names must never be used again.
  reserved "checkpoint_min_written_bytes", "checkpoint_max_commands";
  // Request IDs remembered per run for deduplication (default 1000).
  uint32 request_dedup_capacity = 9;
  // Largest active state of the run: current rows and the values they hold, without history
  // records, checkpoints, or superseded values (default 64 MiB).
  uint64 max_run_state_bytes = 10;
  // Largest number of Step executions in the current attempt (default 10000).
  uint32 max_active_step_executions = 11;
  // Largest total size of the result outputs a child Flow delivers to its parent (default
  // 16 MiB). Zero, as in records of older binaries, means no limit.
  uint64 max_child_flow_result_bytes = 12;
  // A history segment is sealed once its history records, checkpoints, and superseded values
  // reach this many bytes (default 4 MiB). Zero, as in records of older binaries, means 4 MiB.
  uint64 history_segment_target_bytes = 13;
  // Whether the owner deletes the objects of the run's expired history segments (default false;
  // true in dev and local). A run's FlowConfig.delete_expired_history_objects overrides it.
  bool delete_expired_history_objects = 14;
  // Command time a superseded value stays local before offload may delete it (default 10
  // minutes). Zero means 10 minutes.
  int64 superseded_value_grace_micros = 15;
}

// A hard-delete Attribute value that the owner uploaded as its own object before proposing.
message HardDeleteObjectReference {
  // Index of the AttributeWrite in the command's write list.
  uint32 write_index = 1;
  // Object ID (UUIDv7 text); the key is hard-delete/<tenant>/<flow hash>/<run ID>/<object ID>.
  string object_id = 2;
  uint64 size_bytes = 3;
  // Whether the value was a string or an object, to rebuild the right Value kind on read.
  bool is_string_value = 4;
}

// Client StartFlow, after validation. Values in the request are complete (never references).
message FlowStartCommand {
  // Run ID the owner generated for the new run.
  bytes new_run_id = 1;
  dex.StartFlowRequest request = 2;
  RunSettings settings = 3;
  // Timeout policy after applying the protocol default (UNSPECIFIED with a timeout is FAIL).
  dex.FlowTimeoutPolicy resolved_timeout_policy = 4;
  // Normalized Worker target (always pull mode on server-zd).
  dex.WorkerTarget worker_target = 5;
  repeated HardDeleteObjectReference hard_delete_objects = 6;
  // xxh3-128 of the canonical request encoding, for request ID deduplication.
  bytes request_fingerprint = 7;
  // Flow configuration after applying server defaults and request overrides.
  dex.FlowConfig effective_flow_config = 8;
}

message FlowStopCommand {
  dex.StopFlowRequest request = 1;
}

message FlowConfigUpdateCommand {
  dex.UpdateFlowConfigRequest request = 1;
}

message AttributesSetCommand {
  dex.SetAttributesRequest request = 1;
  repeated HardDeleteObjectReference hard_delete_objects = 2;
  bytes request_fingerprint = 3;
}

// PublishToChannel. The owner replaced every message ID with a new UUIDv7.
message ChannelPublishCommand {
  dex.PublishToChannelRequest request = 1;
}

message ChannelMessageDeleteCommand {
  dex.DeleteChannelMessageRequest request = 1;
  bytes request_fingerprint = 2;
}

// Step method of a Step execution.
enum StepMethod {
  STEP_METHOD_UNSPECIFIED = 0;
  STEP_METHOD_WAIT_FOR = 1;
  STEP_METHOD_EXECUTE = 2;
}

// Identifies one logical method call of a Step execution in the current run attempt.
message StepInvocationKey {
  // `StepType-N`, or `sys:timeout_handler-1` for the Flow timeout handler.
  string step_execution_id = 1;
  StepMethod method = 2;
}

// The owner dispatched attempt `attempt` of a method call. Apply takes the locks and computes
// the attempt's snapshot from state.
message StepAttemptStartedCommand {
  StepInvocationKey invocation = 1;
  uint32 attempt = 2;
  // 16-byte UUIDv7 of the dispatch.
  bytes task_id = 3;
  // Routing of the dispatch, with no serving Worker yet; reported while the attempt runs.
  dex.PullRouting pull_routing = 4;
}

// A heartbeat that changed the attempt's checkpoint value.
message StepAttemptHeartbeatCommand {
  StepInvocationKey invocation = 1;
  uint32 attempt = 2;
  oneof checkpoint {
    // New checkpoint value (complete, never a reference).
    dex.Value value = 3;
    // An explicit heartbeat without a value clears the checkpoint.
    bool is_cleared = 4;
  }
  // Task ID of the running attempt; apply ignores a mismatch. Empty in older logs skips the check.
  bytes task_id = 5;
}

// Why an attempt failed.
enum StepAttemptFailureKind {
  STEP_ATTEMPT_FAILURE_KIND_UNSPECIFIED = 0;
  // The Worker returned an error response.
  STEP_ATTEMPT_FAILURE_KIND_WORKER_ERROR = 1;
  // The method timeout expired.
  STEP_ATTEMPT_FAILURE_KIND_METHOD_TIMEOUT = 2;
  // No heartbeat arrived within the heartbeat timeout.
  STEP_ATTEMPT_FAILURE_KIND_HEARTBEAT_TIMEOUT = 3;
  // Dispatch failed: no Worker, Worker disconnected, or unknown Step type.
  STEP_ATTEMPT_FAILURE_KIND_DISPATCH_ERROR = 4;
  // The Worker's response failed validation.
  STEP_ATTEMPT_FAILURE_KIND_INVALID_RESPONSE = 5;
  // The Worker's response uses a feature server-zd does not support.
  STEP_ATTEMPT_FAILURE_KIND_UNSUPPORTED_FEATURE = 6;
  // The Worker's response contains a value larger than the run's max_value_bytes.
  STEP_ATTEMPT_FAILURE_KIND_VALUE_TOO_LARGE = 7;
  // The snapshot of the attempt is larger than the gRPC message limit.
  STEP_ATTEMPT_FAILURE_KIND_REQUEST_TOO_LARGE = 8;
  // The retry policy's total duration expired during an attempt. Only older logs record it.
  STEP_ATTEMPT_FAILURE_KIND_RETRY_DEADLINE = 9;
  // The attempt was handed to a Worker, then a server restart or failover interrupted it.
  STEP_ATTEMPT_FAILURE_KIND_STARTED_ATTEMPT_INTERRUPTED = 10;
}

message StepAttemptFailedCommand {
  StepInvocationKey invocation = 1;
  uint32 attempt = 2;
  StepAttemptFailureKind kind = 3;
  dex.WorkerErrorResponse worker_error = 4;
  // Server-side description of the failure.
  string server_detail = 5;
  // When true, the call fails without further retries (server-zd decided it cannot succeed).
  bool is_non_retryable = 6;
  dex.PullRouting pull_routing = 7;
  // When true, apply requires the attempt to be pending: it failed before any start.
  bool is_before_start = 8;
  // When set, apply requires the attempt to be running with this task ID.
  bytes expected_task_id = 9;
  // With expected_task_id: the Worker never ran the handler, such as an unbuildable request.
  bool is_not_run = 10;
}

// Why a started attempt returns to pending with the same attempt number.
enum StepAttemptReturnReason {
  STEP_ATTEMPT_RETURN_REASON_UNSPECIFIED = 0;
  // The Worker declined the Step type before running it.
  STEP_ATTEMPT_RETURN_REASON_UNSUPPORTED = 1;
  // A Worker without reserved-slot dispatch declined the task for capacity.
  STEP_ATTEMPT_RETURN_REASON_LEGACY_NO_CAPACITY = 2;
  // The task frame never reached the Worker, or the Worker cleanly closed before any output.
  STEP_ATTEMPT_RETURN_REASON_NOT_DELIVERED = 3;
}

// The Worker never ran the started attempt; it becomes pending again without consuming a retry.
// Apply keeps its snapshot, locks, and progress.
message StepAttemptReturnedCommand {
  StepInvocationKey invocation = 1;
  uint32 attempt = 2;
  // Task ID of the started attempt; apply ignores the command unless it still runs with it.
  bytes expected_task_id = 3;
  StepAttemptReturnReason reason = 4;
}

// No Worker took the pending attempt at once; it waits in the DispatchQueue index. Apply
// writes only the index row: no history, run seq, or Flow row changes.
message StepAttemptQueuedCommand {
  StepInvocationKey invocation = 1;
  uint32 attempt = 2;
  // The attempt's pending_since_micros; apply ignores the command when it differs.
  int64 pending_since_micros = 3;
}

// A Worker result for attempt `attempt`. Values are complete or references to values of this
// run that the Worker echoed back; apply validates references.
message StepMethodCompletedCommand {
  StepInvocationKey invocation = 1;
  uint32 attempt = 2;
  oneof response {
    dex.InvokeWaitForMethodResponse wait_for = 3;
    dex.InvokeExecuteMethodResponse execute = 4;
  }
  // Worker that produced the result; becomes the run's sticky Worker.
  string app_worker_id = 5;
  // Write indices span response Attributes, then each SubFlow's initial Attributes in order.
  repeated HardDeleteObjectReference hard_delete_objects = 6;
  dex.PullRouting pull_routing = 7;
  // Task ID of the running attempt; apply ignores a mismatch. Empty in older logs skips the check.
  bytes task_id = 8;
}

// An RPC that ran on a Worker and whose effects must be committed.
message RpcCommittedCommand {
  dex.InvokeRPCRequest request = 1;
  dex.InvokeWorkerRPCResponse response = 2;
  string app_worker_id = 3;
  repeated HardDeleteObjectReference hard_delete_objects = 4;
  bytes request_fingerprint = 5;
  dex.PullRouting pull_routing = 6;
  // Owner-resolved RPC mode, including locks and server configuration.
  bool is_transactional = 7;
}

// Identifies a timer. Timers of an abandoned run attempt never fire.
message TimerId {
  uint32 run_attempt = 1;
  oneof kind {
    WaitConditionTimerId wait_condition = 2;
    RetryBackoffTimerId retry_backoff = 3;
    FlowTimeoutTimerId flow_timeout = 4;
    RetentionTimerId retention = 5;
    OutboxRetentionTimerId outbox_retention = 6;
  }
}

message WaitConditionTimerId {
  string step_execution_id = 1;
  // Index among the Step's timer conditions.
  uint32 timer_index = 2;
}

message RetryBackoffTimerId {
  StepInvocationKey invocation = 1;
  // The attempt that becomes pending when the timer fires.
  uint32 next_attempt = 2;
}

message FlowTimeoutTimerId {}

message RetentionTimerId {}

message OutboxRetentionTimerId {
  // 16-byte outbox message ID.
  bytes message_id = 1;
}

// Timers whose fire time passed by the owner's clock.
message TimersFiredCommand {
  repeated TimerId timers = 1;
}

message TimerSkipCommand {
  dex.SkipTimerRequest request = 1;
}

message TimeTravelCommand {
  dex.ResetFlowRequest request = 1;
  // When true, a restored running attempt becomes pending with the same attempt number.
  // Older logs leave it false and restore it as running.
  bool should_restore_running_as_pending = 2;
  // ID of the staged result this command applies. Empty in older logs: apply computes the
  // result from local history.
  bytes staging_id = 3;
  // Last run seq that the staged result covers. Apply reapplies the external input recorded
  // after it.
  uint64 computed_through_seq = 4;
  // Target point of the staged result: its run attempt and run seq. Apply checks them against
  // the staging.
  uint32 target_run_attempt = 5;
  uint64 target_run_seq = 6;
}

// One chunk of a TimeTravel result the owner computed. It records no history and takes no run seq.
//
// Chunk 0 starts a staging and drops any other; later chunks follow in order.
message TimeTravelStageCommand {
  // ID of the staging, unique per computation; the TimeTravel command names it.
  bytes staging_id = 1;
  uint32 chunk_index = 2;
  // True for the last chunk; the staging is then complete.
  bool is_last_chunk = 3;
  // Encoded TimeTravelStagedChunk (state.proto), which also becomes the staging row's value.
  bytes chunk = 4;
}

// Identifies the Flow run that sent or receives a cross-Flow message.
message CrossFlowEndpoint {
  uint64 tenant_id = 1;
  string flow_id = 2;
  bytes run_id = 3;
  uint32 run_attempt = 4;
}

// Where a child Flow reports its completion.
message ParentFlowReference {
  CrossFlowEndpoint parent = 1;
  string step_execution_id = 2;
  int32 sub_flow_index = 3;
  string condition_id = 4;
}

// Start of a child Flow, written into the parent's outbox by apply. Values are complete except staged hard-delete Attributes.
message ChildFlowStartMessage {
  string child_flow_id = 1;
  dex.SubFlowCondition condition = 2;
  // Effective FlowConfig: the parent's config with the SubFlow overrides applied.
  dex.FlowConfig flow_config = 3;
  string request_id = 4;
  ParentFlowReference parent = 5;
  // Parent-owned staging objects in outbox; child-owned objects in inbox.
  repeated HardDeleteObjectReference hard_delete_objects = 6;
}

// Completion report of a child Flow, written into the child's outbox by apply.
message ChildFlowCompletedMessage {
  string child_flow_id = 1;
  bytes child_run_id = 2;
  uint32 child_run_attempt = 3;
  dex.FlowResult result = 4;
  ParentFlowReference parent = 5;
}

// A cross-Flow message delivered to the receiving Flow's owner.
message InboxMessageCommand {
  // 16-byte outbox message ID; with the source it deduplicates redeliveries.
  bytes message_id = 1;
  CrossFlowEndpoint source = 2;
  oneof payload {
    ChildFlowStartMessage child_start = 3;
    ChildFlowCompletedMessage child_completed = 4;
  }
  // For child starts: run ID the receiving owner generated, and its resolved settings.
  bytes new_run_id = 5;
  RunSettings settings = 6;
}

// The receiver committed these outbox messages; the sender stops redelivering them.
message OutboxAckCommand {
  repeated bytes message_ids = 1;
}

// The projector wrote, or dropped, a run's Attribute Sync entries of one store.
message AttributeSyncAckCommand {
  string store_name = 1;
  // Entries whose written_seq is at most this are deleted; later markings stay pending.
  uint64 acked_seq = 2;
  // Restricts the ack to these Attribute keys; empty means every entry of the store.
  repeated string attribute_keys = 3;
  // True when retries were exhausted and the entries were dropped without being written.
  bool is_dropped = 4;
}

// The owner saw every transactional RPC of the run end; a pending close with no outbox entry
// is recorded now.
message PendingCloseCheckCommand {}

// The owner deleted these hard-delete objects from object storage.
message HardDeleteObjectsDeletedCommand {
  repeated string object_ids = 1;
}

// Retention expired and the owner deleted the run's hard-delete object prefix; apply deletes
// every key of the run.
message RunPurgeCommand {}

// Sets whether apply appends SearchOutbox entries in this partition.
message SetSearchProjectionModeCommand {
  bool enabled = 1;
}

// The owner uploaded the run's history segment [first_seq, last_seq]. Apply marks the segment
// uploaded only when it is the run's oldest sealed segment; any other acknowledgment changes
// nothing. The command records no history and takes no run seq.
message HistorySegmentUploadedCommand {
  uint64 first_seq = 1;
  uint64 last_seq = 2;
  // xxh3-128 of the object's uncompressed content, 16 bytes big-endian.
  bytes content_checksum = 3;
  uint64 object_size_bytes = 4;
}

// The owner read an offloaded value of the run from its uploaded history segment, so a command
// that references it can commit. Apply restores the value locally, unheld, when the run's birth
// record still marks it offloaded inside the window; otherwise it changes nothing. The command
// records no history, takes no run seq, and is not bound to an attempt.
message ValueReviveCommand {
  // ID of the value: the run seq of the command that stored it and its index in that command.
  uint64 value_run_seq = 1;
  uint32 value_index_in_command = 2;
  // The complete value, as the segment stores it.
  dex.Value value = 3;
}

// The owner deleted the objects of these EXPIRED history segments of the run, named by first
// seq. Apply deletes each named catalog row that is EXPIRED; other names change nothing. The
// command records no history and takes no run seq.
message HistorySegmentObjectsDeletedCommand {
  repeated uint64 first_seqs = 1;
}

// The owner's local history cleanup of a run, applied only once due. Records no history, takes no
// run seq.
message HistoryLocalCleanupCommand {}

// Sets whether this partition offloads run history to object storage.
message SetHistoryOffloadModeCommand {
  bool enabled = 1;
  // Partition the owner routed the command to; apply rejects a command applied elsewhere.
  uint32 partition = 2;
}

// The external search projection wrote this partition's outbox through through_seq; apply deletes
// those entries.
message SearchOutboxAckCommand {
  uint32 partition = 1;
  uint64 through_seq = 2;
}
