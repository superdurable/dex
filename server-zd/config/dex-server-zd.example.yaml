# Run a node with: dex-server-zd serve --config <this file>
# Set cluster.nodeId, objectStore.bucket, and localStorage.directory for production; dev flags supply local values.
cluster:
  nodeId: ""
  partitionCount: 1024
objectStore:
  endpoint: ""
  region: us-east-1
  bucket: ""
  prefix: ""
  forcePathStyle: false
  credentialsSource: defaultChain
  hardDeleteStore: null
localStorage:
  directory: ""
  blockCacheBytes: 268435456
  # Caps RocksDB write-ahead log files; the store stays near live data plus this cap.
  maxWalBytes: 268435456
  # Memtable size of each of the 6 column families, 2 memtables each; raise maxWalBytes with it.
  writeBufferBytes: 67108864
  # null uses half the available CPUs, from 2 to 1024.
  maxBackgroundJobs: null
  maxSubcompactions: 1
  # Compacts the store in the background after startup replays this many log record bytes.
  compactAfterReplayBytes: 16777216
  # Keeps this many local stores set aside as <directory>.discarded-<uuidv7>; recovery deletes older ones.
  retainedSetAsideStoreCount: 1
commit:
  # null enables the build default: true in debug builds, false in release builds.
  debugReplayChecks: null
  batchWindow: 20ms
  maxInFlight: 4
  sealAtBytes: 4194304
  multipartThresholdBytes: 8388608
  maxBatchRecords: 10000
  # Encoded command bytes awaiting local apply; submissions beyond it fail with UNAVAILABLE.
  # Must be at least the smaller of api.grpcMaxMessageBytes and 32 MiB.
  maxUnappliedBytes: 67108864
  # null uses the larger of 8 and the available CPUs, at most cluster.partitionCount and 1024.
  applierLanes: null
  applierQueueFrames: 64
lease:
  duration: 10s
  failIfHeld: false
snapshot:
  logThresholdBytes: 268435456
  interval: 10min
  retainedCount: 3
  logDeletionDelay: 24h
recovery:
  # Wall-clock retry window per startup read, starting at its first transient or unknown-outcome failure.
  startupReadRetryBudget: 30s
  # Log batches read ahead while startup replays the log.
  readAheadBatches: 64
  readAheadBytes: 67108864
history:
  windowSemanticEvents: 10000
  pruneChunkSize: 1000
  checkpointMinWrittenBytes: 1048576
  checkpointCommandInterval: 10000
  maxRetainedSupersededBytes: 268435456
values:
  wireInlineThresholdBytes: 100
  maxValueBytes: 16777216
  hydrateBeforeDispatch: false
  blobDbMinValueBytes: 65536
retention:
  closedFlowDuration: 7days
api:
  listen: "0.0.0.0:8801"
  grpcMaxMessageBytes: 33554432
  maxWaitSeconds: 60
  defaultRpcTimeout: 60s
auth:
  # Empty disables public API authentication. Authenticators are tried in order, for example:
  #   - kind: jwt
  #     issuer: https://issuer.example.com  # exact iss claim; https unless loopback
  #     audiences: ["dex"]                  # aud must name at least one
  #     jwksURL: ""                         # empty discovers keys through the issuer's OpenID configuration
  #     allowInsecureJWKSURL: false         # true permits an http:// jwksURL on a trusted network
  #     caFile: ""                          # PEM bundle added to the system roots
  #   - kind: staticTokens
  #     file: /etc/dex-server-zd/tokens.yaml  # tokens: [{sha256: <64 hex>}]; reloaded on change
  authenticators: []
metrics:
  # Empty disables the unauthenticated HTTP GET /metrics endpoint. Never expose it publicly.
  listen: ""
matching:
  dispatchWait: 10s
  stickyWait: 5s
  maxConcurrentTasksCap: 256
  maxStreams: 100000
  maxQueueLength: 256
  maxFlowTypes: 256
  maxFlowTypeLength: 256
  pingInterval: 20s
streamStore:
  backend: disabled
  maxMessageBytes: 102400
  maxReadMessages: 1000
  estimatedMessageOverheadBytes: 512
  trimTriggerPercent: 90
  trimTargetPercent: 80
  backgroundTrimBatchSize: 256
  trimBatchYieldTime: 1ms
  trimWorkers: 4
search:
  backend: builtin
  builtinScanBudgetDocuments: 100000
  # PostgreSQL DSN; TLS: sslmode, sslrootcert, sslsni, sslnegotiation, connect_timeout.
  # Example: postgres://role:pw@host:5432/db?sslmode=require&sslnegotiation=direct
  paradeDbConnectionString: ""
  paradeDbConnectionPoolSize: 10
  paradeDbSchema: public
  # PostgreSQL 15+ without extensions; empty DSN reads DEX_ZD_POSTGRES_CONNECTION_STRING.
  postgresConnectionString: ""
  postgresConnectionPoolSize: 10
  postgresSchema: public
  readYourWritesWait: 2s
  projectionQueue:
    softFrames: 4096
    softBytes: 67108864
    hardFrames: 8192
    hardBytes: 134217728
limits:
  maxFlowStateBytes: 67108864
  maxChannelMessages: 10000
  maxConcurrentStepsPerFlow: 1000
  maxSpeculativeCommandsPerFlow: 256
  maxSpeculativeBytesPerNode: 67108864
  # Node-wide blocking read cap; shutdown waits for active reads within its budget.
  maxBlockingStateReads: 64
  maxLongPollWaitersPerNode: 100000
  maxLongPollWaitersPerFlow: 1000
  maxInFlightRpcsPerNode: 1000
  maxRequestIdsPerRun: 1000
  maxFlowIdBytes: 1000
attributeStore:
  # Empty disables Attribute synchronization. Keys match the Go Dex Server; only type postgres is supported:
  #   orders:
  #     type: postgres
  #     dsn: ""                       # empty reads DEX_ZD_ATTRIBUTE_STORE_DSN_ORDERS
  #     tableName: public.orders      # primary key: the Flow ID, or the rowKey columns
  #     rowKey: ""                    # such as order-{order_id}
  #     columnNaming: ""              # "" uses Attribute names exactly; snake_case converts them
  #     attributeMaps:
  #       Items: {tableName: public.order_items, instanceKeyColumn: item_key}
  #     fencingTableName: dexzd_attribute_sync_fencing  # create it before startup; see the docs
  stores: {}
  schemaSyncInterval: 1m
  syncBatchSize: 100
  # The effective transaction timeout is also capped at a quarter of lease.duration.
  syncAttemptTimeout: 30s
  syncRetryPolicy:
    initialInterval: 100ms
    backoffCoefficient: 2.0
    maximumInterval: 30s
    maximumAttempts: 0
    totalDuration: 1h
dev:
  dataDirectory: ""
  s3DataDirectory: ""
  durabilityMode: processCrashSafe
  logDirectory: null
