<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dex Server Benchmark</title>
<style>
:root { color-scheme: light; --bg: #fcfcfb; --panel: #f3f3f1; --fg: #0b0b0b; --muted: #52514e; --grid: #e2e1dc; --zd: #eb6834; --other: #2a78d6; }
@media (prefers-color-scheme: dark) { :root:where(:not([data-theme="light"])) { color-scheme: dark; --bg: #1a1a19; --panel: #242423; --fg: #f0efec; --muted: #c3c2b7; --grid: #34342f; --zd: #d95926; --other: #3987e5; } }
:root[data-theme="dark"] { color-scheme: dark; --bg: #1a1a19; --panel: #242423; --fg: #f0efec; --muted: #c3c2b7; --grid: #34342f; --zd: #d95926; --other: #3987e5; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 system-ui, sans-serif; }
main { max-width: 1200px; margin: 0 auto; padding: 24px 16px 48px; }
h1 { font-size: 26px; margin: 0 0 4px; } h2.part { font-size: 19px; margin: 40px 0 8px; } h3 { font-size: 16px; margin: 24px 0 4px; }
.meta { color: var(--muted); margin: 4px 0 12px; }
.swatch { display: inline-block; width: 14px; height: 4px; margin-right: 6px; vertical-align: middle; border-radius: 2px; }
.swatch.zd { background: var(--zd); } .swatch.other { background: var(--other); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
figure { margin: 0; } svg { width: 100%; height: auto; }
svg .title { fill: var(--fg); font-size: 12px; font-weight: 600; } svg .tick { fill: var(--muted); font-size: 11px; }
svg .grid { stroke: var(--grid); stroke-width: 1; }
svg .line { fill: none; stroke-width: 2; } svg .line.zd { stroke: var(--zd); } svg .line.other { stroke: var(--other); }
svg .dot { stroke: var(--bg); stroke-width: 2; } svg .dot.zd { fill: var(--zd); } svg .dot.other { fill: var(--other); }
[data-tip] { cursor: default; } [data-tip]:hover { opacity: 0.85; }
#tip { position: fixed; pointer-events: none; background: var(--fg); color: var(--bg); padding: 6px 8px; border-radius: 6px; font-size: 12px; display: none; max-width: 320px; }
.table-wrap { overflow-x: auto; } table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 5px 10px; border-bottom: 1px solid var(--grid); white-space: nowrap; } th { color: var(--muted); font-weight: 600; }
</style></head><body><main>
<h1>server-zd benchmark</h1>
<p class="meta">Mode aws · , 32 cores, 62 GiB RAM<br>server-zd: dex-server-zd 0.1.0</p>
<h2 class="part">Details by scenario</h2><section><h3>rpc-plain</h3><div class="grid">
<figure><svg viewBox="0 0 320 200" role="img" aria-label="Throughput"><text class="title" x="48" y="16">Throughput (rpcs/s)</text><line class="grid" x1="48.0" x2="308.0" y1="164.0" y2="164.0"/><text class="tick" x="42.0" y="168.0" text-anchor="end">0.00</text><line class="grid" x1="48.0" x2="308.0" y1="130.0" y2="130.0"/><text class="tick" x="42.0" y="134.0" text-anchor="end">12500</text><line class="grid" x1="48.0" x2="308.0" y1="96.0" y2="96.0"/><text class="tick" x="42.0" y="100.0" text-anchor="end">25000</text><line class="grid" x1="48.0" x2="308.0" y1="62.0" y2="62.0"/><text class="tick" x="42.0" y="66.0" text-anchor="end">37500</text><line class="grid" x1="48.0" x2="308.0" y1="28.0" y2="28.0"/><text class="tick" x="42.0" y="32.0" text-anchor="end">50000</text><text class="tick" x="48.0" y="180.0" text-anchor="middle">32</text><text class="tick" x="308.0" y="180.0" text-anchor="middle">48</text><text class="tick" x="178.0" y="196.0" text-anchor="middle">concurrency</text><polyline class="line zd" points="48.0,75.4 308.0,69.9"/><circle class="dot zd" cx="48.0" cy="75.4" r="4" data-tip="server-zd, concurrency 32: 32559 rpcs/s"/><circle class="dot zd" cx="308.0" cy="69.9" r="4" data-tip="server-zd, concurrency 48: 34611 rpcs/s"/></svg></figure>
<figure><svg viewBox="0 0 320 200" role="img" aria-label="p50 latency"><text class="title" x="48" y="16">p50 latency (ms)</text><line class="grid" x1="48.0" x2="308.0" y1="164.0" y2="164.0"/><text class="tick" x="42.0" y="168.0" text-anchor="end">0.00</text><line class="grid" x1="48.0" x2="308.0" y1="130.0" y2="130.0"/><text class="tick" x="42.0" y="134.0" text-anchor="end">0.50</text><line class="grid" x1="48.0" x2="308.0" y1="96.0" y2="96.0"/><text class="tick" x="42.0" y="100.0" text-anchor="end">1.00</text><line class="grid" x1="48.0" x2="308.0" y1="62.0" y2="62.0"/><text class="tick" x="42.0" y="66.0" text-anchor="end">1.50</text><line class="grid" x1="48.0" x2="308.0" y1="28.0" y2="28.0"/><text class="tick" x="42.0" y="32.0" text-anchor="end">2.00</text><text class="tick" x="48.0" y="180.0" text-anchor="middle">32</text><text class="tick" x="308.0" y="180.0" text-anchor="middle">48</text><text class="tick" x="178.0" y="196.0" text-anchor="middle">concurrency</text><polyline class="line zd" points="48.0,104.8 308.0,85.2"/><circle class="dot zd" cx="48.0" cy="104.8" r="4" data-tip="server-zd, concurrency 32: 0.87 ms"/><circle class="dot zd" cx="308.0" cy="85.2" r="4" data-tip="server-zd, concurrency 48: 1.16 ms"/></svg></figure>
<figure><svg viewBox="0 0 320 200" role="img" aria-label="p99 latency"><text class="title" x="48" y="16">p99 latency (ms)</text><line class="grid" x1="48.0" x2="308.0" y1="164.0" y2="164.0"/><text class="tick" x="42.0" y="168.0" text-anchor="end">0.00</text><line class="grid" x1="48.0" x2="308.0" y1="130.0" y2="130.0"/><text class="tick" x="42.0" y="134.0" text-anchor="end">1.25</text><line class="grid" x1="48.0" x2="308.0" y1="96.0" y2="96.0"/><text class="tick" x="42.0" y="100.0" text-anchor="end">2.50</text><line class="grid" x1="48.0" x2="308.0" y1="62.0" y2="62.0"/><text class="tick" x="42.0" y="66.0" text-anchor="end">3.75</text><line class="grid" x1="48.0" x2="308.0" y1="28.0" y2="28.0"/><text class="tick" x="42.0" y="32.0" text-anchor="end">5.00</text><text class="tick" x="48.0" y="180.0" text-anchor="middle">32</text><text class="tick" x="308.0" y="180.0" text-anchor="middle">48</text><text class="tick" x="178.0" y="196.0" text-anchor="middle">concurrency</text><polyline class="line zd" points="48.0,98.3 308.0,53.4"/><circle class="dot zd" cx="48.0" cy="98.3" r="4" data-tip="server-zd, concurrency 32: 2.41 ms"/><circle class="dot zd" cx="308.0" cy="53.4" r="4" data-tip="server-zd, concurrency 48: 4.07 ms"/></svg></figure>
<figure><svg viewBox="0 0 320 200" role="img" aria-label="Mean server CPU"><text class="title" x="48" y="16">Mean server CPU (%)</text><line class="grid" x1="48.0" x2="308.0" y1="164.0" y2="164.0"/><text class="tick" x="42.0" y="168.0" text-anchor="end">0.00</text><line class="grid" x1="48.0" x2="308.0" y1="130.0" y2="130.0"/><text class="tick" x="42.0" y="134.0" text-anchor="end">250</text><line class="grid" x1="48.0" x2="308.0" y1="96.0" y2="96.0"/><text class="tick" x="42.0" y="100.0" text-anchor="end">500</text><line class="grid" x1="48.0" x2="308.0" y1="62.0" y2="62.0"/><text class="tick" x="42.0" y="66.0" text-anchor="end">750</text><line class="grid" x1="48.0" x2="308.0" y1="28.0" y2="28.0"/><text class="tick" x="42.0" y="32.0" text-anchor="end">1000</text><text class="tick" x="48.0" y="180.0" text-anchor="middle">32</text><text class="tick" x="308.0" y="180.0" text-anchor="middle">48</text><text class="tick" x="178.0" y="196.0" text-anchor="middle">concurrency</text><polyline class="line zd" points="48.0,46.7 308.0,32.2"/><circle class="dot zd" cx="48.0" cy="46.7" r="4" data-tip="server-zd, concurrency 32: 862 %"/><circle class="dot zd" cx="308.0" cy="32.2" r="4" data-tip="server-zd, concurrency 48: 969 %"/></svg></figure>
<figure><svg viewBox="0 0 320 200" role="img" aria-label="Peak server RSS"><text class="title" x="48" y="16">Peak server RSS (MiB)</text><line class="grid" x1="48.0" x2="308.0" y1="164.0" y2="164.0"/><text class="tick" x="42.0" y="168.0" text-anchor="end">0.00</text><line class="grid" x1="48.0" x2="308.0" y1="130.0" y2="130.0"/><text class="tick" x="42.0" y="134.0" text-anchor="end">25.0</text><line class="grid" x1="48.0" x2="308.0" y1="96.0" y2="96.0"/><text class="tick" x="42.0" y="100.0" text-anchor="end">50.0</text><line class="grid" x1="48.0" x2="308.0" y1="62.0" y2="62.0"/><text class="tick" x="42.0" y="66.0" text-anchor="end">75.0</text><line class="grid" x1="48.0" x2="308.0" y1="28.0" y2="28.0"/><text class="tick" x="42.0" y="32.0" text-anchor="end">100</text><text class="tick" x="48.0" y="180.0" text-anchor="middle">32</text><text class="tick" x="308.0" y="180.0" text-anchor="middle">48</text><text class="tick" x="178.0" y="196.0" text-anchor="middle">concurrency</text><polyline class="line zd" points="48.0,85.3 308.0,84.3"/><circle class="dot zd" cx="48.0" cy="85.3" r="4" data-tip="server-zd, concurrency 32: 57.9 MiB"/><circle class="dot zd" cx="308.0" cy="84.3" r="4" data-tip="server-zd, concurrency 48: 58.6 MiB"/></svg></figure>
<figure><svg viewBox="0 0 320 200" role="img" aria-label="Throughput per GiB of peak RSS"><text class="title" x="48" y="16">Throughput per GiB of peak RSS (/s per GiB)</text><line class="grid" x1="48.0" x2="308.0" y1="164.0" y2="164.0"/><text class="tick" x="42.0" y="168.0" text-anchor="end">0.00</text><line class="grid" x1="48.0" x2="308.0" y1="130.0" y2="130.0"/><text class="tick" x="42.0" y="134.0" text-anchor="end">250000</text><line class="grid" x1="48.0" x2="308.0" y1="96.0" y2="96.0"/><text class="tick" x="42.0" y="100.0" text-anchor="end">500000</text><line class="grid" x1="48.0" x2="308.0" y1="62.0" y2="62.0"/><text class="tick" x="42.0" y="66.0" text-anchor="end">750000</text><line class="grid" x1="48.0" x2="308.0" y1="28.0" y2="28.0"/><text class="tick" x="42.0" y="32.0" text-anchor="end">1000000</text><text class="tick" x="48.0" y="180.0" text-anchor="middle">32</text><text class="tick" x="308.0" y="180.0" text-anchor="middle">48</text><text class="tick" x="178.0" y="196.0" text-anchor="middle">concurrency</text><polyline class="line zd" points="48.0,85.6 308.0,81.7"/><circle class="dot zd" cx="48.0" cy="85.6" r="4" data-tip="server-zd, concurrency 32: 576267 /s per GiB"/><circle class="dot zd" cx="308.0" cy="81.7" r="4" data-tip="server-zd, concurrency 48: 604832 /s per GiB"/></svg></figure>
</div></section>
<h2 class="part">All results</h2><div class="table-wrap"><table><thead><tr><th>Scenario</th><th>Concurrency</th><th>Server</th><th>Throughput</th><th>p50 ms</th><th>p99 ms</th><th>CPU %</th><th>RSS MiB</th><th>Errors</th></tr></thead><tbody><tr><td>rpc-plain</td><td>32</td><td><i class="swatch zd"></i>server-zd</td><td>32559 rpcs/s</td><td>0.87</td><td>2.41</td><td>862</td><td>57.9</td><td>0</td></tr><tr><td>rpc-plain</td><td>48</td><td><i class="swatch zd"></i>server-zd</td><td>34611 rpcs/s</td><td>1.16</td><td>4.07</td><td>969</td><td>58.6</td><td>0</td></tr></tbody></table></div>
<div id="tip"></div>
<script>
const tip = document.getElementById("tip");
document.addEventListener("mousemove", (event) => {
  const target = event.target.closest("[data-tip]");
  if (!target) { tip.style.display = "none"; return; }
  tip.textContent = target.dataset.tip;
  tip.style.display = "block";
  tip.style.left = Math.min(event.clientX + 12, window.innerWidth - tip.offsetWidth - 8) + "px";
  tip.style.top = (event.clientY + 14) + "px";
});
</script>
</main></body></html>
