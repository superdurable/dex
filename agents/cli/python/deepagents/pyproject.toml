[project]
name = "dex-agents-deepagents-cli"
# Every agents package shares one version; agents/script/stamp_agents_release_version.py sets it.
version = "0.1.0"
description = "The dex-agents-deepagents command: a durable Deep Agents agent in your terminal"
authors = [{name = "Super Durable"}]
readme = "README.md"
license = "LicenseRef-Sustainable-Use-1.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
dependencies = [
    "deepagents>=0.7.32,<0.8",
    "dex-agents==0.1.0",
    "dex-agents-cli==0.1.0",
    "dex-agents-langgraph==0.1.0",
    "dex-python-sdk==1.38.0",
    "langchain>=1.4.7,<2",
    "langchain-core>=1.7.3,<2",
    "langchain-openai>=1.0,<2",
    "langgraph>=1.2.19,<2",
]

[project.scripts]
dex-agents-deepagents = "dex_agents_deepagents_cli:run"

[project.urls]
Homepage = "https://github.com/superdurable/dex/tree/main/agents/cli/python/deepagents"
Repository = "https://github.com/superdurable/dex"
Changelog = "https://github.com/superdurable/dex/blob/main/agents/CHANGELOG.md"

[dependency-groups]
dev = [
    "dex-agents-cli-testing",
    "mypy>=1.15,<2",
    "pexpect>=4.9,<5",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.26,<2",
    "ruff>=0.8,<0.9",
]

[build-system]
requires = ["uv_build>=0.12.2,<0.13"]
build-backend = "uv_build"

[tool.uv]
required-version = "==0.12.2"

[tool.uv.sources]
dex-agents = { path = "../../../python/core", editable = true }
dex-agents-cli = { path = "../runtime", editable = true }
dex-agents-cli-testing = { path = "../testing", editable = true }
dex-agents-langgraph = { path = "../../../python/langgraph", editable = true }

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF"]
# Test helpers poll files and spawn children on purpose.
ignore = ["ASYNC109", "ASYNC110", "ASYNC220", "ASYNC221"]

[tool.ruff.lint.isort]
known-first-party = [
    "dex_agents",
    "dex_agents_cli",
    "dex_agents_cli_testing",
    "dex_agents_deepagents_cli",
    "dex_agents_langgraph",
    "tests",
]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["pexpect", "pexpect.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
