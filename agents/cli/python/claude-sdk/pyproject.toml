[project]
name = "dex-agents-claude-sdk-cli"
# Every agents package shares one version; agents/script/stamp_agents_release_version.py sets it.
version = "0.1.0"
description = "The dex-agents-claude-sdk command: a durable Claude Agent SDK agent in your terminal"
authors = [{name = "Super Durable"}]
readme = "README.md"
license = "LicenseRef-Sustainable-Use-1.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
dependencies = [
    "claude-agent-sdk>=0.2.176,<0.3",
    "dex-agents==0.1.0",
    "dex-agents-claude-agent-sdk==0.1.0",
    "dex-agents-cli-core==0.1.0",
    "dex-python-sdk==1.45.2",
]

[project.scripts]
dex-agents-claude-sdk = "dex_agents_claude_sdk_cli:run"

[project.urls]
Homepage = "https://github.com/superdurable/dex/tree/main/agents/cli/python/claude-sdk"
Repository = "https://github.com/superdurable/dex"
Changelog = "https://github.com/superdurable/dex/blob/main/agents/CHANGELOG.md"

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "pexpect>=4.9,<5",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.26,<2",
    "ruff>=0.8,<0.9",
]

[build-system]
requires = ["uv_build>=0.12.2,<0.13"]
build-backend = "uv_build"

[tool.uv]
required-version = "==0.12.2"

[tool.uv.sources]
dex-agents = { path = "../../../python/core", editable = true }
dex-agents-claude-agent-sdk = { path = "../../../python/claude-agent-sdk", editable = true }
dex-agents-cli-core = { path = "../core", editable = true }

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF"]
# Test helpers poll files and spawn children on purpose.
ignore = ["ASYNC109", "ASYNC110", "ASYNC220", "ASYNC221"]

[tool.ruff.lint.isort]
known-first-party = [
    "dex_agents",
    "dex_agents_claude_agent_sdk",
    "dex_agents_claude_sdk_cli",
    "dex_agents_cli_core",
    "tests",
]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["pexpect", "pexpect.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
