[project]
name = "dex-agents-cli-config-tests"
version = "0.0.0"
description = "Checks the Dex Agents CLI configuration schemas, example, and conformance cases."
requires-python = ">=3.11"

[dependency-groups]
dev = [
    "jsonschema>=4.26,<5",
    "mypy>=1.15,<2",
    "pytest>=8.3,<9",
    "ruamel.yaml>=0.18,<0.19",
    "ruff>=0.8,<0.9",
    "types-jsonschema>=4.26,<5",
]

[tool.uv]
required-version = "==0.12.2"
package = false

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["."]
