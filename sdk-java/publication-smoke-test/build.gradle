plugins {
    id 'application'
}

repositories {
    maven {
        url = uri(providers.gradleProperty('publicationRepository').get())
    }
    mavenCentral()
}

dependencies {
    implementation "io.superdurable:dex-sdk:${providers.gradleProperty('dexSdkVersion').get()}"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// Consumers on Java 8 must still link against the published SDK.
tasks.withType(JavaCompile).configureEach {
    options.release = 8
}

application {
    mainClass = 'io.superdurable.dex.consumer.PublicationSmoke'
}
