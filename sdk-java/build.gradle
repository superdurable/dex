plugins {
    // Apply the java-library plugin for API and implementation separation.
    id 'java-library'
    id 'org.springframework.boot' version '2.7.2'
    id 'io.spring.dependency-management' version '1.0.12.RELEASE'
    id 'io.github.gradle-nexus.publish-plugin' version '1.1.0'
    id "maven-publish"
    id 'signing'
    id 'jacoco'
}

bootJar {
    enabled = false
}

jar {
    enabled = true
    from('LICENSE') {
        into 'META-INF'
    }
    from('LEGACY_NOTICES.md') {
        into 'META-INF'
    }
    from('LICENSES') {
        into 'META-INF/LICENSES'
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
    withJavadocJar()
    withSourcesJar()
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    // Use JUnit Jupiter for testing.
    testImplementation 'org.junit.jupiter:junit-jupiter:5.8.2'

    // This dependency is exported to consumers, that is to say found on their compile classpath.
    api 'org.apache.commons:commons-math3:3.6.1'

    // This dependency is used internally, and not exposed to consumers on their own compile classpath.
    implementation 'com.google.guava:guava:31.0.1-jre'

    // protobuf / gRPC (checked-in stubs under src/main/java/io/superdurable/gen)
    api 'com.google.protobuf:protobuf-java:4.35.1'
    api 'io.grpc:grpc-stub:1.69.1'
    api 'io.grpc:grpc-protobuf:1.69.1'
    compileOnly 'javax.annotation:javax.annotation-api:1.3.2'

    // for HTTP clients (legacy until gRPC migration)
    implementation "io.github.openfeign:feign-okhttp:11.10"
    implementation "io.github.openfeign:feign-core:11.10"
    implementation "io.github.openfeign:feign-jackson:11.10"
    implementation "com.github.scribejava:scribejava-core:8.3.1"
    implementation "io.github.openfeign.form:feign-form:3.8.0"
    implementation "io.github.openfeign:feign-slf4j:11.9.1"
    implementation "io.swagger:swagger-annotations:1.6.6"
    implementation 'io.swagger:swagger-models:1.6.6'
    implementation 'io.swagger:swagger-core:1.6.6'
    implementation "org.openapitools:jackson-databind-nullable:0.2.1"
    implementation "net.bytebuddy:byte-buddy:1.14.4"
    implementation "org.objenesis:objenesis:3.4"

    // jaskson
    implementation "com.fasterxml.jackson.datatype:jackson-datatype-jsr310"
    implementation "com.fasterxml.jackson.datatype:jackson-datatype-jdk8"
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.13.4'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.13.3'
    implementation 'com.fasterxml.jackson.core:jackson-core:2.13.3'
    implementation 'javax.annotation:javax.annotation-api:1.3.2'

    // spring?
    testImplementation 'org.springframework.boot:spring-boot-starter-web'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation "javax.validation:validation-api:2.0.1.Final"


    // immutable
    compileOnly 'org.immutables:value:2.9.2'
    annotationProcessor 'org.immutables:value:2.9.2'

    // cron utils
    implementation 'com.cronutils:cron-utils:9.2.0'
}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}

jacocoTestReport {
    reports {
        xml.enabled true
        html.enabled true
    }
}

check.dependsOn jacocoTestReport

// Custom task to unpublish from local Maven repository
// Usage: ./gradlew unpublishFromMavenLocal
task unpublishFromMavenLocal(type: Delete) {
    def groupPath = "io/superdurable/dex-sdk"
    def version = project.version
    def m2Repo = "${System.getProperty('user.home')}/.m2/repository"
    delete "$m2Repo/$groupPath/$version"
    doFirst {
        println "Deleting $m2Repo/$groupPath/$version"
    }
}

// Maven coordinates: io.superdurable:dex-sdk (reverse-DNS of superdurable.io)
group = "io.superdurable"
version = "0.0.2"

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId = project.group
            artifactId = 'dex-sdk'
            version = project.version
            from(components.java)

            pom {
                name = "dex-sdk"
                description = "Dex Java SDK"
                url = 'https://github.com/superdurable/dex'

                scm {
                    connection = 'scm:git@github.com:superdurable/dex.git'
                    developerConnection = 'scm:git@github.com:superdurable/dex.git'
                    url = 'https://github.com/superdurable/dex.git'
                }

                licenses {
                    license {
                        name = 'Super Durable Source License 1.0'
                        url = 'https://github.com/superdurable/dex/blob/main/LICENSE'
                        distribution = 'repo'
                    }
                }

                developers {
                    developer {
                        id = 'longquanzheng'
                        name = 'Quanzheng Long'
                        email = 'qlong.seattle@gmail.com'
                    }
                }
            }
        }
    }
}

signing {
    // CI: ORG_GRADLE_PROJECT_signingKey (+ optional signingPassword)
    // Local: signing.keyId / signing.password / signing.secretKeyRingFile in ~/.gradle/gradle.properties
    def signingKey = findProperty("signingKey")
    def signingPassword = findProperty("signingPassword") ?: ""
    if (signingKey) {
        useInMemoryPgpKeys(signingKey.toString(), signingPassword.toString())
    }
    required {
        gradle.taskGraph.allTasks.any {
            it.name.contains("publishToSonatype") || it.name.contains("PublishToSonatype")
        }
    }
    sign publishing.publications.mavenJava
}

nexusPublishing {
    repositories {
        sonatype {
            nexusUrl.set(uri("https://ossrh-staging-api.central.sonatype.com/service/local/"))
            snapshotRepositoryUrl.set(uri("https://central.sonatype.com/repository/maven-snapshots/"))
            // Prefer project properties (set via ORG_GRADLE_PROJECT_* in CI):
            username = project.findProperty('mavenCentralUsername') ?: System.getenv('ORG_GRADLE_PROJECT_mavenCentralUsername')
            password = project.findProperty('mavenCentralPassword') ?: System.getenv('ORG_GRADLE_PROJECT_mavenCentralPassword')
        }
    }
}
