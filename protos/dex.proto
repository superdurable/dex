syntax = "proto3";

package dex;

import "google/protobuf/empty.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "io.superdurable.gen";
option java_outer_classname = "DexProto";

// ---------------------------------------------------------------------------
// FlowService error handling
//
// Failures return a gRPC status with dexpb.ServiceErrorResponse in status details
// (see ServiceErrorResponse / ErrorSubStatus). Clients should read both the gRPC code
// and ServiceErrorResponse.sub_status / detail / original_worker_error_*.
//
// Common gRPC codes (all RPCs unless noted):
//   InvalidArgument   — bad request / invalid Value / empty lock keys, etc.
//                       sub_status usually UNCATEGORIZED
//   AlreadyExists     — StartFlow when ID already running
//                       sub_status FLOW_ALREADY_STARTED
//   NotFound          — unknown flow/run
//                       sub_status FLOW_NOT_EXISTS
//   FailedPrecondition — closed/invalid flow state; blob-backed WaitForAttribute;
//                       Dex application Worker failures (business errors and
//                       transport failures to the app worker). These must not
//                       use Unavailable so they do not count against server
//                       SLA/SLO. sub_status WORKER_API_ERROR when from a Worker;
//                       raw worker code/detail/type in original_worker_error_*
//                       when available
//   ResourceExhausted — message size, Stream capacity, and search scan limits
//   DeadlineExceeded  — transport long poll or caller-visible request deadline
//                       sub_status LONG_POLL_TIME_OUT or REQUEST_TIMEOUT
//   Canceled          — caller canceled the RPC context
//   Unavailable       — object storage or the search backend is unavailable, or
//                       the Server applies backpressure; never a Dex application Worker
//   Internal          — unexpected / violated trusted invariant
//   Unimplemented     — TriggerContinueAsNew; SearchFlows without a configured
//                       search backend
//
// Notable per-RPC behavior:
//   InvokeRPC — IsTransactional requests transactional reads and writes.
//     Non-empty LockAttributeKeys enables transactional execution automatically.
//     Worker errors (app or transport-to-worker) → FailedPrecondition +
//     WORKER_API_ERROR + OriginalWorker* when present.
//   WaitForStepCompletion / WaitForAttribute — Transport timeout →
//     DeadlineExceeded + LONG_POLL_TIME_OUT. Request timeout →
//     DeadlineExceeded + REQUEST_TIMEOUT. WaitForAttribute rejects waiting
//     on blob-backed stored attributes with FailedPrecondition.
//   WaitForFlow — long-poll timeout while still running → DeadlineExceeded +
//     LONG_POLL_TIME_OUT.
//   WriteStream / ReadStream — independent of Flow existence and lifecycle.
//     Read timeout → DeadlineExceeded + LONG_POLL_TIME_OUT.
// ---------------------------------------------------------------------------

// Hosted by Dex server; SDKs call these RPCs.
service FlowService {
  // Returns diagnostic release metadata and the Server's inclusive protocol interval.
  rpc GetServerInfo(google.protobuf.Empty) returns (ServerInfo);
  rpc StartFlow(StartFlowRequest) returns (StartFlowResponse);
  rpc PublishToChannel(PublishToChannelRequest) returns (google.protobuf.Empty);
  rpc GetChannelMessages(GetChannelMessagesRequest) returns (GetChannelMessagesResponse);
  rpc DeleteChannelMessage(DeleteChannelMessageRequest) returns (google.protobuf.Empty);
  rpc WriteStream(WriteStreamRequest) returns (google.protobuf.Empty);
  rpc ReadStream(ReadStreamRequest) returns (ReadStreamResponse);
  rpc ListStreamMessages(ListStreamMessagesRequest) returns (ListStreamMessagesResponse);
  rpc StopFlow(StopFlowRequest) returns (google.protobuf.Empty);
  rpc GetAttributes(GetAttributesRequest) returns (GetAttributesResponse);
  rpc SetAttributes(SetAttributesRequest) returns (google.protobuf.Empty);
  rpc LoadBlobs(LoadBlobsRequest) returns (LoadBlobsResponse);
  rpc WaitForFlow(WaitForFlowRequest) returns (FlowResult);
  rpc SearchFlows(SearchFlowsRequest) returns (SearchFlowsResponse);
  rpc SyncAttributeIndexes(SyncAttributeIndexRequest) returns (SyncAttributeIndexResponse);
  rpc GetFlowSummary(GetFlowSummaryRequest) returns (GetFlowSummaryResponse);
  rpc GetHistoryEvents(GetHistoryEventsRequest) returns (GetHistoryEventsResponse);
  rpc WaitForHistoryEvent(WaitForHistoryEventRequest) returns (WaitForHistoryEventResponse);
  rpc GetFlowState(GetFlowStateRequest) returns (GetFlowStateResponse);
  rpc ResetFlow(ResetFlowRequest) returns (ResetFlowResponse);
  rpc InvokeRPC(InvokeRPCRequest) returns (InvokeRPCResponse);
  rpc SkipTimer(SkipTimerRequest) returns (google.protobuf.Empty);
  rpc UpdateFlowConfig(UpdateFlowConfigRequest) returns (google.protobuf.Empty);
  rpc WaitForStepCompletion(WaitForStepCompletionRequest) returns (WaitForStepCompletionResponse);
  rpc WaitForAttribute(WaitForAttributeRequest) returns (WaitForAttributeResponse);
  // Deprecated: Dex does not continue Flows as new. This RPC always returns UNIMPLEMENTED.
  rpc TriggerContinueAsNew(TriggerContinueAsNewRequest) returns (google.protobuf.Empty);
  rpc HealthCheck(google.protobuf.Empty) returns (HealthInfo);
}

// Identifies the engine behind a Dex Server. Clients use it only to adapt behavior that differs
// between engines.
enum ServerEngine {
  // The Server does not report its engine. Servers released before this field existed are the
  // Go Server on Temporal or Cadence.
  SERVER_ENGINE_UNSPECIFIED = 0;
  // Deprecated: The Go Server running on Temporal. Dex no longer reports this engine.
  SERVER_ENGINE_TEMPORAL = 1;
  // Deprecated: The Go Server running on Cadence. Dex no longer reports this engine.
  SERVER_ENGINE_CADENCE = 2;
  // server-zd: the zero-dependency Server that keeps all state in object storage.
  SERVER_ENGINE_ZD = 3;
}

// Describes the Dex Server release and the inclusive protocol range it supports.
message ServerInfo {
  // Identifies the Server artifact for diagnostics. Compatibility uses only the protocol range.
  string server_version = 1;
  // Oldest protocol version still accepted by this Server.
  uint32 minimum_supported_protocol_version = 2;
  // Newest protocol version implemented by this Server.
  uint32 current_protocol_version = 3;
  // The engine behind this Server.
  ServerEngine server_engine = 4;
}

// Describes the Step and RPC calls a Worker serves.
// Dex delivers them over WorkerTaskService and never dials Workers.
service WorkerService {
  rpc InvokeWaitForMethod(InvokeWaitForMethodRequest) returns (stream InvokeWaitForMethodOutput);
  rpc InvokeExecuteMethod(InvokeExecuteMethodRequest) returns (stream InvokeExecuteMethodOutput);
  rpc InvokeWorkerRPC(InvokeWorkerRPCRequest) returns (InvokeWorkerRPCResponse);
}

// Hosted by Dex server; pull Workers open one queue stream for at most one task at a time.
service WorkerTaskService {
  // Exchanges registration, task, result, and control frames for one Dex task queue.
  rpc PollWorkerTask(stream PollWorkerTaskRequest) returns (stream PollWorkerTaskResponse);
}

// Carries one Worker frame on a pull stream. Register must be the first frame.
message PollWorkerTaskRequest {
  oneof frame {
    // Starts this queue stream; no other frame may precede registration.
    PollWorkerTaskRegister register = 1;
    // Reports task progress or its final result.
    PollWorkerTaskFrame task_frame = 2;
    // Declines an assigned task before output when the Worker lacks capacity or the named handler.
    PollWorkerTaskReject reject = 3;
    // Acknowledges a server liveness check.
    PollWorkerTaskPong pong = 4;
  }
}

// Registers one queue stream for a Worker process.
message PollWorkerTaskRegister {
  // Names this stream's queue: app_worker_id or one declared flow_type.
  string queue = 1;
  // Identifies this Worker process across reconnects; a restart uses a new ID.
  string app_worker_id = 2;
  // Lists the Flow types this Worker can execute.
  repeated string flow_types = 3;
  // Identifies the SDK implementation for diagnostics.
  string sdk_name = 4;
  // Identifies the SDK release for diagnostics.
  string sdk_version = 5;
}

// Carries a task's heartbeat, stream write, result, or Worker error.
message PollWorkerTaskFrame {
  // Matches the task_id sent by Dex on this stream.
  string task_id = 1;
  oneof output {
    // Includes heartbeat, stream write, and final result variants.
    InvokeWaitForMethodOutput wait_for = 2;
    // Includes heartbeat, stream write, and final result variants.
    InvokeExecuteMethodOutput execute = 3;
    // Completes an RPC task.
    InvokeWorkerRPCResponse rpc = 4;
    // Ends the task with a Worker error.
    WorkerErrorResponse worker_error = 5;
  }
}

// Declines a task so Dex can assign it to another available Worker stream.
message PollWorkerTaskReject {
  // Matches the declined task on this stream.
  string task_id = 1;
  // Explains why the Worker cannot accept the task.
  PollWorkerTaskRejectReason reason = 2;
}

// Explains why a Worker declined a task.
enum PollWorkerTaskRejectReason {
  // No rejection reason was supplied.
  POLL_WORKER_TASK_REJECT_REASON_UNSPECIFIED = 0;
  // All Worker execution slots are occupied.
  POLL_WORKER_TASK_REJECT_REASON_NO_CAPACITY = 1;
  // The Flow has no registration for the requested Step type.
  POLL_WORKER_TASK_REJECT_REASON_UNKNOWN_STEP = 2;
  // The Flow has no registration for the requested RPC name.
  POLL_WORKER_TASK_REJECT_REASON_UNKNOWN_RPC = 3;
}

// Acknowledges a server Ping on the same stream.
message PollWorkerTaskPong {}

// Carries one server frame on a pull stream.
message PollWorkerTaskResponse {
  oneof frame {
    // Confirms that Dex accepted this stream's queue registration.
    PollWorkerTaskRegistered registered = 1;
    // Assigns work to the registered Worker.
    PollWorkerTask task = 2;
    // Requests cancellation of the assigned task.
    PollWorkerTaskCancelTask cancel_task = 3;
    // Requests a reconnect after the current task finishes.
    PollWorkerTaskReconnect reconnect = 4;
    // Checks whether an idle stream remains responsive.
    PollWorkerTaskPing ping = 5;
  }
}

// Confirms that Dex accepted the queue registration.
message PollWorkerTaskRegistered {
  // Allows this queue-owner stream to reject an assigned unknown Step type or RPC name.
  bool supports_unknown_name_rejection = 1;
}

// Assigns one task to this stream until its final result, error, or rejection.
message PollWorkerTask {
  // Identifies the assignment for result and cancellation frames.
  string task_id = 1;
  // Bounds task execution, including Worker processing time.
  google.protobuf.Timestamp deadline = 2;
  oneof request {
    // Runs a Step's WaitFor method.
    InvokeWaitForMethodRequest wait_for = 3;
    // Runs a Step's Execute method.
    InvokeExecuteMethodRequest execute = 4;
    // Runs a Worker RPC.
    InvokeWorkerRPCRequest rpc = 5;
  }
}

// Requests cancellation of the task currently assigned to this stream.
message PollWorkerTaskCancelTask {
  // Matches the task currently assigned on this stream.
  string task_id = 1;
}

// Asks the Worker to finish its task and reconnect for queue ownership changes or shutdown.
message PollWorkerTaskReconnect {
  // Explains why Dex needs a new queue stream.
  string reason = 1;
}

// Checks that an idle pull stream remains responsive.
message PollWorkerTaskPing {}

// Distinguishes no available Worker, a disconnected Worker, and a missing Step or RPC registration.
// Dex persists it in Step method failure events.
enum DispatchTaskErrorReason {
  DISPATCH_TASK_ERROR_REASON_UNSPECIFIED = 0;
  DISPATCH_TASK_ERROR_REASON_NO_WORKER_AVAILABLE = 1;
  DISPATCH_TASK_ERROR_REASON_WORKER_DISCONNECTED = 2;
  // A matched Worker does not register the requested Step type or RPC name.
  DISPATCH_TASK_ERROR_REASON_UNKNOWN_NAME = 3;
}

message Value {
  oneof kind {
    // Hydrate from blob storage, then replace with string_value.
    // The Server chooses this reference text; clients must treat it as opaque.
    string internal_blob_id_for_string_value = 1;
    // Hydrate from blob storage, then replace with obj_value.
    // The Server chooses this reference text; clients must treat it as opaque.
    string internal_blob_id_for_obj_value = 2;

    string string_value = 3;
    EncodedObject obj_value = 4;

    int64 int_value = 5;
    double double_value = 6;
    bool bool_value = 7;
    // Top-level null. Within AttributeWrite, null deletes the Attribute.
    google.protobuf.NullValue null_value = 8;
  }
}

message EncodedObject {
  // "json" is JSON and "raw" is raw bytes. Other values are passed through.
  string encoding = 1;
  bytes payload = 2;
}

message AttributeWrite {
  string key = 1;
  Value value = 2;
  // Omit when indexing is inferred or attribute is not indexed.
  IndexConfig index_config = 3;
  // Omit or disable to keep this write out of the configured Attribute Store.
  AttributeSyncConfig sync_config = 4;
  // Stores a string or object value only in blob storage, regardless of the
  // size threshold, so Flow history keeps only a reference. A null write
  // permanently deletes the stored value. Requires an enabled blob store and
  // must not be combined with index_config or sync_config. Requires Server
  // protocol version 3 or later.
  bool is_hard_delete_on_null = 5;
}

message ActionPermissionMapping {
  string attribute_key = 1;
  repeated Value equal_values = 2;
  string required_permission = 3;
}

message ActionPermissionMappings {
  repeated ActionPermissionMapping mappings = 1;
}

message AttributeSyncConfig {
  // Enqueues this write for the Flow's current Attribute Store target.
  bool enabled = 1;
}

message KV {
  string key = 1;
  Value value = 2;
}

message IndexConfig {
  bool enable = 1;
  IndexType type = 2;
  // Omit to use the attribute key; set for dynamic attrs.
  string index_key = 3;
}

enum IndexType {
  INDEX_TYPE_UNSPECIFIED = 0;
  // Default for string/object when type is omitted.
  INDEX_TYPE_KEYWORD = 1;
  INDEX_TYPE_TEXT = 2;
  INDEX_TYPE_KEYWORD_ARRAY = 3;
  // Usually inferred from Value; optional to set explicitly.
  INDEX_TYPE_INT = 4;
  INDEX_TYPE_DOUBLE = 5;
  INDEX_TYPE_BOOL = 6;
  INDEX_TYPE_DATETIME = 7;
}

message Context {
  string flow_id = 1;
  string run_id = 2;
  int64 flow_started_timestamp = 3;
  string step_execution_id = 4;
  int64 first_attempt_timestamp = 5;
  int32 attempt = 6;
  // Step execution that scheduled this execution, or a reserved source.
  string from_step_execution_id = 7;
  // Previous Step method failure supplied only to its configured recovery method.
  RecoveryErrorInfo recovery_error = 8;
  Value last_heartbeat_value = 9;
  // The run attempt that dispatched this invocation. It starts at 1 and
  // increases on each time travel. run_id stays the same across run attempts,
  // so combine both when an idempotency key must change after time travel.
  int32 run_attempt = 10;
}

message RetryPolicy {
  int32 initial_interval_seconds = 1;
  float backoff_coefficient = 2;
  int32 maximum_interval_seconds = 3;
  int32 maximum_attempts = 4;
  int32 total_duration_seconds = 5;
}

// Dex does not support Flow retry and rejects a set policy with INVALID_ARGUMENT.
message FlowRetryPolicy {
  int32 initial_interval_seconds = 1;
  float backoff_coefficient = 2;
  int32 maximum_interval_seconds = 3;
  int32 maximum_attempts = 4;
}

enum WaitForMethodFailurePolicy {
  WAIT_FOR_METHOD_FAILURE_POLICY_UNSPECIFIED = 0;
  WAIT_FOR_METHOD_FAILURE_POLICY_FAIL_FLOW_ON_FAILURE = 1;
  // Execute runs after the final WaitFor failure.
  WAIT_FOR_METHOD_FAILURE_POLICY_PROCEED_ON_FAILURE = 2;
}

enum ExecuteMethodFailurePolicy {
  EXECUTE_METHOD_FAILURE_POLICY_UNSPECIFIED = 0;
  EXECUTE_METHOD_FAILURE_POLICY_FAIL_FLOW_ON_EXECUTE_METHOD_FAILURE = 1;
  // The configured recovery Step starts after the final Execute failure.
  EXECUTE_METHOD_FAILURE_POLICY_PROCEED_TO_CONFIGURED_STEP = 2;
}

message StepOptions {
  int32 wait_for_timeout_seconds = 1;
  int32 execute_timeout_seconds = 2;
  RetryPolicy wait_for_retry_policy = 3;
  RetryPolicy execute_retry_policy = 4;
  WaitForMethodFailurePolicy wait_for_failure_policy = 5;
  ExecuteMethodFailurePolicy execute_failure_policy = 6;
  // Step type started after the final Execute failure.
  string execute_failure_proceed_step_type = 7;
  // Options of the recovery Step.
  StepOptions execute_failure_proceed_step_options = 8;
  bool skip_wait_for = 9;
  StepDurability wait_for_durability_override = 10;
  StepDurability execute_durability_override = 11;
  repeated string wait_for_lock_attribute_keys = 12;
  repeated string execute_lock_attribute_keys = 13;
  int32 heartbeat_timeout_seconds = 14;
  repeated string wait_for_load_attribute_map_instances = 15;
  repeated string wait_for_load_channel_names = 16;
  repeated string wait_for_load_channel_map_instances = 17;
  repeated string execute_load_attribute_map_instances = 18;
  repeated string execute_load_channel_names = 19;
  repeated string execute_load_channel_map_instances = 20;
}

message FlowTimeoutHandlerOptions {
  int32 method_timeout_seconds = 1;
  int32 heartbeat_timeout_seconds = 2;
  RetryPolicy retry_policy = 3;
  ExecuteMethodFailurePolicy failure_policy = 4;
  // Step type started after the final timeout handler failure.
  string failure_proceed_step_type = 5;
  // Options of the recovery Step.
  StepOptions failure_proceed_step_options = 6;
  StepDurability durability_override = 7;
  repeated string lock_attribute_keys = 8;
  repeated string load_attribute_map_instances = 9;
  repeated string load_channel_names = 10;
  repeated string load_channel_map_instances = 11;
}

enum IdReusePolicy {
  ID_REUSE_POLICY_UNSPECIFIED = 0;
  ID_REUSE_POLICY_ALLOW_IF_PREVIOUS_EXISTS_ABNORMALLY = 1;
  ID_REUSE_POLICY_ALLOW_IF_NO_RUNNING = 2;
  ID_REUSE_POLICY_DISALLOW_REUSE = 3;
  ID_REUSE_POLICY_ALLOW_TERMINATE_IF_RUNNING = 4;
}

message FlowAlreadyStartedOptions {
  bool ignore_already_started_error = 1;
}

message FlowStartOptions {
  IdReusePolicy id_reuse_policy = 1;
  // Dex rejects a positive start delay with INVALID_ARGUMENT.
  int32 flow_start_delay_seconds = 2;
  // Dex rejects a set policy with INVALID_ARGUMENT.
  FlowRetryPolicy retry_policy = 3;
  repeated AttributeWrite attributes = 4;
  FlowConfig flow_config_override = 5;
  FlowAlreadyStartedOptions flow_already_started_options = 6;
  FlowTimeoutHandlerOptions timeout_handler_options = 7;
}

enum ActiveStepSearchMode {
  ACTIVE_STEP_SEARCH_MODE_UNSPECIFIED = 0;
  ACTIVE_STEP_SEARCH_MODE_ENABLED_FOR_ALL = 1;
  ACTIVE_STEP_SEARCH_MODE_ENABLED_FOR_STEPS_WITH_WAIT_FOR = 2;
  ACTIVE_STEP_SEARCH_MODE_DISABLED = 3;
}

// Was optimize_activity: false=SYNC, true=ASYNC. Timer is always optimized by the server.
// Both durabilities record the same events. ASYNC advances without waiting for the commit; there is no local phase.
enum StepDurability {
  STEP_DURABILITY_UNSPECIFIED = 0;
  STEP_DURABILITY_SYNC = 1;
  STEP_DURABILITY_ASYNC = 2;
}

message FlowConfig {
  optional ActiveStepSearchMode active_step_search_mode = 1;
  // Deprecated: Dex does not continue Flows as new. Dex rejects a negative value, stores the
  // value in the Flow configuration, and otherwise ignores it.
  optional int32 continue_as_new_threshold = 2;
  // Deprecated: Dex does not continue Flows as new. Dex rejects a negative value, stores the
  // value in the Flow configuration, and otherwise ignores it.
  optional int32 continue_as_new_page_size_in_bytes = 3;
  optional StepDurability step_durability = 4;
  WorkerTarget worker_target = 5;
  // Present empty disables future synchronization; non-empty selects Server-configured stores.
  optional AttributeStoreNames attribute_store_names = 6;
}

message AttributeStoreNames {
  repeated string names = 1;
}

message WorkerTarget {
  reserved 1, 2;
  reserved "address", "is_headless_address";
  // Routes work through a connected pull Worker. Dex requires true whenever a target is set.
  bool is_pull_mode = 3;
}

message StartFlowRequest {
  string flow_id = 1;
  string flow_type = 2;
  int32 flow_timeout_seconds = 3;
  FlowTimeoutPolicy flow_timeout_policy = 4;
  string start_step_type = 5;
  Value step_input = 8;
  StepOptions step_options = 9;
  FlowStartOptions flow_start_options = 10;
  string request_id = 11;
}

enum FlowTimeoutPolicy {
  FLOW_TIMEOUT_POLICY_UNSPECIFIED = 0;
  FLOW_TIMEOUT_POLICY_FAIL = 1;
  FLOW_TIMEOUT_POLICY_CANCEL = 2;
  FLOW_TIMEOUT_POLICY_HANDLER = 3;
}

message StartFlowResponse {
  string run_id = 1;
}

message PublishToChannelRequest {
  string flow_id = 1;
  string run_id = 2;
  repeated ChannelMessage messages = 3;
}

message ChannelMessage {
  string channel_name = 1;
  Value value = 2;
  string message_id = 3;
}

message GetChannelMessagesRequest {
  string flow_id = 1;
  string run_id = 2;
  string channel_name = 3;
}

message GetChannelMessagesResponse {
  repeated ChannelMessage messages = 1;
}

message DeleteChannelMessageRequest {
  string flow_id = 1;
  string run_id = 2;
  string channel_name = 3;
  string message_id = 4;
  string request_id = 5;
}

message ChannelMessageDeletion {
  string channel_name = 1;
  string message_id = 2;
}

message WriteStreamRequest {
  string flow_id = 1;
  string flow_type = 2;
  string stream_name = 3;
  int64 stream_capacity_bytes = 4;
  Value value = 5;
  string source = 6;
}

message ReadStreamRequest {
  string flow_id = 1;
  string flow_type = 2;
  string stream_name = 3;
  string resume_token = 4;
  int32 wait_time_seconds = 5;
}

message ReadStreamResponse {
  StreamMessage message = 1;
}

message ListStreamMessagesRequest {
  string flow_id = 1;
  string flow_type = 2;
  string stream_name = 3;
  int32 page_size = 4;
  string before_page_token = 5;
}

message ListStreamMessagesResponse {
  repeated StreamMessage messages = 1;
  string next_page_token = 2;
}

message StreamMessage {
  Value value = 1;
  string resume_token = 2;
  google.protobuf.Timestamp created_time = 3;
  string source = 4;
}

enum StopType {
  STOP_TYPE_UNSPECIFIED = 0;
  STOP_TYPE_CANCEL = 1;
  STOP_TYPE_TERMINATE = 2;
  STOP_TYPE_FAIL = 3;
}

message StopFlowRequest {
  string flow_id = 1;
  string run_id = 2;
  string reason = 3;
  StopType stop_type = 4;
}

message GetAttributesRequest {
  string flow_id = 1;
  string run_id = 2;
  repeated string keys = 3;
  // When true, return all attributes (keys is ignored).
  bool all_keys = 4;
}

message GetAttributesResponse {
  repeated KV attributes = 1;
}

message SetAttributesRequest {
  string flow_id = 1;
  string run_id = 2;
  repeated AttributeWrite attributes = 3;
  string request_id = 4;
  ActionPermissionMappings action_permission_mappings = 5;
}

message LoadBlobRequestEntry {
  // Flow that owns blob_value and supplies the omitted Blob path segment.
  string flow_id = 1;
  // Must use internal_blob_id_for_string_value or internal_blob_id_for_obj_value.
  Value blob_value = 2;
}

message LoadBlobsRequest {
  repeated LoadBlobRequestEntry entries = 1;
}

message LoadBlobsResponse {
  // Hydrated concrete values keyed by blob id.
  map<string, Value> values = 1;
}

message WaitForFlowRequest {
  string flow_id = 1;
  string run_id = 2;
  bool needs_results = 3;
  // Zero/omit uses the configured API maximum wait.
  int32 wait_time_seconds = 4;
}

enum FlowStatus {
  FLOW_STATUS_UNSPECIFIED = 0;
  FLOW_STATUS_RUNNING = 1;
  FLOW_STATUS_COMPLETED = 2;
  FLOW_STATUS_FAILED = 3;
  // Deprecated: Reserved for reporting a backend hard timeout; applications must not depend on
  // this status. Dex never returns this status.
  FLOW_STATUS_SERVER_SIDE_TIMEOUT_INTERNAL_ONLY = 4;
  FLOW_STATUS_TERMINATED = 5;
  FLOW_STATUS_CANCELED = 6;
  // Deprecated: Dex does not continue Flows as new and never returns this status.
  FLOW_STATUS_CONTINUED_AS_NEW = 7;
}

enum FlowErrorType {
  FLOW_ERROR_TYPE_UNSPECIFIED = 0;
  FLOW_ERROR_TYPE_STEP_DECISION_FAILING_FLOW = 1;
  FLOW_ERROR_TYPE_CLIENT_API_FAILING_FLOW = 2;
  // includes waitFor/execute/rpc methods
  FLOW_ERROR_TYPE_WORKER_API_FAIL = 3;
  FLOW_ERROR_TYPE_INVALID_USER_FLOW_CODE = 4;
  FLOW_ERROR_TYPE_FLOW_TIMEOUT = 5;
  // either bug in sdk or server
  FLOW_ERROR_TYPE_INTERNAL = 6;
}

message StepCompletionOutput {
  string completed_step_type = 1;
  string completed_step_execution_id = 2;
  Value completed_step_output = 3;
}

message FlowResult {
  FlowStatus flow_status = 1;
  repeated StepCompletionOutput results = 2;
  FlowErrorType error_type = 3;
  string error_message = 4;
}

message SearchFlowsRequest {
  string query = 1;
  int32 page_size = 2;
  string next_page_token = 3;
  // Deprecated: Dex does not continue Flows as new and ignores this field.
  bool include_continued_as_new = 4;
}

message SearchFlowsResponse {
  repeated SearchFlowsResponseEntry flow_runs = 1;
  string next_page_token = 2;
}

message SearchFlowsResponseEntry {
  string flow_id = 1;
  string run_id = 2;
  repeated KV indexed_attributes = 3;
  string flow_type = 4;
  FlowStatus flow_status = 5;
  google.protobuf.Timestamp start_time = 6;
  google.protobuf.Timestamp close_time = 7;
}

message SyncAttributeIndexRequest {
  map<string, IndexType> attribute_indexes = 1;
}

message SyncAttributeIndexResponse {}

message FlowExecutionID {
  string flow_id = 1;
  string run_id = 2;
}

message GetFlowSummaryRequest {
  string flow_id = 1;
  string run_id = 2;
}

message GetFlowSummaryResponse {
  FlowExecutionID flow_execution_id = 1;
  // Always equals run_id.
  string first_run_id = 2;
  string request_id = 3;
  string flow_type = 4;
  FlowStatus flow_status = 5;
  google.protobuf.Timestamp start_time = 6;
  google.protobuf.Timestamp close_time = 7;
  // The current run attempt of this run.
  int32 run_attempt = 8;
}

message GetHistoryEventsRequest {
  string flow_id = 1;
  string run_id = 2;
  int64 start_internal_event_id = 3;
  int32 estimate_page_size = 4;
  bytes next_page_token = 5;
  // Selects the run attempt whose lineage is returned. Zero selects the current
  // run attempt.
  int32 run_attempt = 6;
}

message GetHistoryEventsResponse {
  repeated FlowHistoryEvent events = 1;
  bytes next_page_token = 2;
  int64 next_internal_event_id = 3;
}

message FlowHistoryEvent {
  int64 event_id = 1;
  google.protobuf.Timestamp event_time = 2;
  // The run attempt that recorded this event.
  int32 run_attempt = 3;

  oneof payload {
    FlowStartedOrContinuedHistoryEvent flow_started_or_continued = 20;
    FlowClosedHistoryEvent flow_closed = 21;
    StepWaitForCompletedEvent step_wait_for_completed = 22;
    StepWaitForFailedEvent step_wait_for_failed = 23;
    StepExecuteCompletedEvent step_execute_completed = 24;
    StepExecuteFailedEvent step_execute_failed = 25;
    RpcExecutionCompletedEvent rpc_execution_completed = 26;
    ChannelExternalPublishEvent channel_external_publish = 27;
    StepMethodPendingEvent step_wait_for_pending = 28;
    StepMethodPendingEvent step_execute_pending = 29;
    TimeTravelForkHistoryEvent time_travel_fork = 30;
    ChannelExternalDeleteEvent channel_external_delete = 31;
  }
}

// TimeTravelForkHistoryEvent identifies the preserved run whose history Time Travel forked.
message TimeTravelForkHistoryEvent {
  // Previous run containing the original history branch.
  string previous_run_id = 1;
  // The run attempt that was current before this time travel.
  int32 previous_run_attempt = 2;
  // The run attempt of the point this time travel returned to.
  int32 target_run_attempt = 3;
  // The event ID of the point this time travel returned to.
  int64 target_event_id = 4;
}

message FlowStartedOrContinuedHistoryEvent {
  FlowExecutionID flow_execution_id = 1;
  string flow_type = 2;
  FlowConfig flow_config = 3;
  google.protobuf.Duration flow_timeout = 4;
  FlowTimeoutPolicy flow_timeout_policy = 5;
  FlowTimeoutHandlerOptions timeout_handler_options = 6;

  oneof start_or_continue {
    FlowInitialStart initial_start = 10;
    // Deprecated: Dex does not continue Flows as new and never sets this.
    FlowContinuedStart continued_start = 11;
  }
}

message FlowInitialStart {
  string start_step_type = 1;
  Value step_input = 2;
  StepOptions step_options = 3;
  repeated KV initial_attributes = 4;
}

// Deprecated: Dex does not continue Flows as new and never records this start.
message FlowContinuedStart {
  string previous_run_id = 1;
  repeated StepMovement steps_to_start = 2;
  repeated StepExecutionResumeInfo steps_to_resume = 3;
  map<string, ChannelValues> pending_channel_messages = 4;
  repeated KV attributes = 5;
  repeated StepCompletionOutput completed_steps = 6;
  string sticky_app_worker_id = 7;
}

message FlowClosedHistoryEvent {
  FlowStatus flow_status = 1;
  repeated StepCompletionOutput results = 2;
  FlowErrorType error_type = 3;
  string error_message = 4;
  // Deprecated: Dex does not continue Flows as new and never sets this.
  string continued_to_run_id = 5;
  string sticky_app_worker_id = 6;
}

// PendingStepMethodPhase reports the latest persisted backend lifecycle event.
// SCHEDULED waits for locks or dispatch. STARTED means an attempt is running.
enum PendingStepMethodPhase {
  PENDING_STEP_METHOD_PHASE_UNSPECIFIED = 0;
  PENDING_STEP_METHOD_PHASE_SCHEDULED = 1;
  PENDING_STEP_METHOD_PHASE_STARTED = 2;
}

// StepMethodPendingEvent describes a regular Step method unresolved at flow closure.
message StepMethodPendingEvent {
  StepMethodEventInput input = 1;
  StepMethodEventContext context = 2;
  PendingStepMethodPhase phase = 3;
}

message StepMethodFailure {
  string backend_error = 1;
  ServiceErrorResponse details = 2;
  int32 attempt = 3;
  PullRouting pull_routing = 4;
}

message StepMethodOptions {
  int32 timeout_seconds = 1;
  RetryPolicy retry_policy = 2;
  int32 heartbeat_timeout_seconds = 3;
}

message StepMethodEventInput {
  bool unavailable = 1;
  Value step_input = 2;
  ConditionResults condition_results = 3;
  repeated KV attributes = 4;
  repeated KV step_execution_locals = 5;
}

enum PullRoutingSource {
  PULL_ROUTING_SOURCE_UNSPECIFIED = 0;
  PULL_ROUTING_SOURCE_STICKY_QUEUE = 1;
  PULL_ROUTING_SOURCE_FLOW_TYPE_QUEUE = 2;
}

message PullRouting {
  string sticky_app_worker_id = 1;
  string served_by_app_worker_id = 2;
  PullRoutingSource source = 3;
}

message StepMethodEventContext {
  string step_execution_id = 1;
  string from_step_execution_id = 2;
  string step_type = 3;
  StepDurability durability = 4;
  int32 final_attempt = 5;
  google.protobuf.Timestamp started_time = 6;
  google.protobuf.Duration duration = 7;
  StepMethodOptions method_options = 8;
  StepMethodFailure last_failure_info = 9;
  PullRouting pull_routing = 10;
}

message StepWaitForCompletedOutput {
  WaitingCondition wait_for_condition = 1;
  repeated AttributeWrite upsert_attributes = 2;
  repeated ChannelMessage publish_to_channel = 3;
  repeated KV record_events = 4;
  repeated KV upsert_step_execution_locals = 5;
  repeated ChannelMessageDeletion delete_from_channel = 6;
}

message StepExecuteCompletedOutput {
  StepDecision step_decision = 1;
  repeated AttributeWrite upsert_attributes = 2;
  repeated ChannelMessage publish_to_channel = 3;
  repeated KV record_events = 4;
  repeated KV upsert_step_execution_locals = 5;
  repeated ChannelMessageDeletion delete_from_channel = 6;
}

message StepMethodFailedOutput {
  StepMethodFailure failure = 1;
}

message StepWaitForCompletedEvent {
  StepMethodEventInput input = 1;
  StepWaitForCompletedOutput output = 2;
  StepMethodEventContext context = 3;
}

message StepWaitForFailedEvent {
  StepMethodEventInput input = 1;
  StepMethodFailedOutput output = 2;
  StepMethodEventContext context = 3;
}

message StepExecuteCompletedEvent {
  StepMethodEventInput input = 1;
  StepExecuteCompletedOutput output = 2;
  StepMethodEventContext context = 3;
}

message StepExecuteFailedEvent {
  StepMethodEventInput input = 1;
  StepMethodFailedOutput output = 2;
  StepMethodEventContext context = 3;
}

// Successful RPC history projection. Transactional RPCs include input/output; other RPCs
// omit them.
message RpcExecutionCompletedEvent {
  string rpc_name = 1;
  Value input = 2;
  Value output = 3;
  StepDecision step_decision = 4;
  repeated AttributeWrite upsert_attributes = 5;
  repeated KV record_events = 6;
  repeated ChannelMessage publish_to_channel = 7;
  bool is_set_attribute_api = 8;
  repeated ChannelMessageDeletion delete_from_channel = 9;
  string served_by_app_worker_id = 10;
}

message ChannelExternalPublishEvent {
  repeated ChannelMessage messages = 1;
}

message ChannelExternalDeleteEvent {
  repeated ChannelMessageDeletion messages = 1;
}

message WaitForHistoryEventRequest {
  string flow_id = 1;
  string run_id = 2;
  int64 next_internal_event_id = 3;
}

message WaitForHistoryEventResponse {
  bool event_available = 1;
  int64 available_internal_event_id = 2;
  FlowStatus flow_status = 3;
}

enum ActiveStepPhase {
  ACTIVE_STEP_PHASE_UNSPECIFIED = 0;
  ACTIVE_STEP_PHASE_ACTIVE = 1;
  ACTIVE_STEP_PHASE_WAITING = 2;
}

message ActiveStepExecutionState {
  string step_execution_id = 1;
  string from_step_execution_id = 2;
  string step_type = 3;
  ActiveStepPhase phase = 4;
  StepMovement movement = 5;
  WaitingConditionState waiting_condition = 6;
  StepExecutionCompletedConditions completed_conditions = 7;
  repeated KV step_execution_locals = 8;
  repeated TimerInfo timers = 9;
  StepMethodFailure last_failure_info = 10;
  PullRouting wait_for_pull_routing = 11;
  PullRouting execute_pull_routing = 12;
}

message GetFlowStateRequest {
  string flow_id = 1;
  string run_id = 2;
}

message GetFlowStateResponse {
  FlowConfig flow_config = 1;
  repeated KV attributes = 2;
  repeated ActiveStepExecutionState active_step_executions = 3;
  repeated StepMovement queued_steps = 4;
  map<string, ChannelValues> pending_channel_messages = 5;
  repeated StepCompletionOutput completed_steps = 6;
  string sticky_app_worker_id = 7;
}

enum FlowResetType {
  FLOW_RESET_TYPE_UNSPECIFIED = 0;
  FLOW_RESET_TYPE_BEGINNING = 1;
  FLOW_RESET_TYPE_HISTORY_EVENT_TIME = 2;
  FLOW_RESET_TYPE_STEP_TYPE = 3;
  FLOW_RESET_TYPE_STEP_EXECUTION_ID = 4;
}

enum FlowResetStepMethod {
  FLOW_RESET_STEP_METHOD_UNSPECIFIED = 0;
  FLOW_RESET_STEP_METHOD_WAIT_FOR = 1;
  FLOW_RESET_STEP_METHOD_EXECUTE = 2;
}

message ResetFlowRequest {
  string flow_id = 1;
  string run_id = 2;
  FlowResetType reset_type = 3;
  string reason = 4;
  string history_event_time = 5;
  string step_type = 6;
  string step_execution_id = 7;
  // Skips reapplying RPCs, Channel publications, and Attribute writes after the reset point.
  bool skip_writes_reapply = 8;
  FlowResetStepMethod step_method = 9;
  // Selects the run attempt whose history is searched for the reset point.
  // Zero selects the current run attempt.
  int32 run_attempt = 10;
}

message ResetFlowResponse {
  string run_id = 1;
  // The run attempt created by this time travel. run_id does not change.
  int32 run_attempt = 2;
}

message InvokeRPCRequest {
  string flow_id = 1;
  // Targets this run when set.
  string run_id = 2;
  string rpc_name = 3;
  Value input = 4;
  int32 timeout_seconds = 5;
  // Acquire exclusive lock on these attribute keys for the RPC's
  // read-modify-write. Empty means no locking and uses the configured RPC path.
  repeated string lock_attribute_keys = 6;
  // Per-call UUID, SDK-generated and future-overridable; identical retries reuse it.
  // Dex deduplicates it for the whole run.
  string request_id = 7;
  // Requests transactional reads and writes. Attribute locking enables it
  // automatically. Channel deletion alone does not; callers must opt in.
  bool is_transactional = 8;
  // AttributeMap instances whose entries are loaded for the RPC handler.
  // A trailing slash loads every instance. The suffix names one instance.
  repeated string load_attribute_map_instances = 9;
  // Channel definitions whose pending messages are loaded for the RPC handler.
  repeated string load_channel_names = 10;
  // ChannelMap instances whose pending messages are loaded for the RPC handler.
  // A trailing slash loads every instance. The suffix names one instance.
  repeated string load_channel_map_instances = 11;
}

message InvokeRPCResponse {
  Value output = 1;
}

message SkipTimerRequest {
  string flow_id = 1;
  string run_id = 2;
  string step_execution_id = 3;
  string timer_condition_id = 4;
  optional int32 timer_condition_index = 5;
}

message UpdateFlowConfigRequest {
  string flow_id = 1;
  string run_id = 2;
  FlowConfig flow_config = 3;
}

message WaitForStepCompletionRequest {
  string flow_id = 1;
  // Identifies a step execution by type and its per-type execution number.
  string step_type = 2;
  string step_execution_number = 3;
  // Bounds the caller-visible request across transparent transport reattachments.
  // Zero waits indefinitely.
  int32 request_timeout_seconds = 4;
  // Deprecated: Dex rejects a negative value and otherwise ignores this field.
  int32 internal_handler_timeout_seconds = 5;
  // Optional logical idempotency key. Empty derives wait-for-step-completion:{Step execution ID}.
  string request_id = 6;
}

message WaitForStepCompletionResponse {}

message WaitForAttributeRequest {
  string flow_id = 1;
  AttributeMatch match = 2;
  // Bounds the caller-visible request across transparent transport reattachments.
  // Zero waits indefinitely.
  int32 request_timeout_seconds = 3;
  // Deprecated: Dex rejects a negative value and otherwise ignores this field.
  int32 internal_handler_timeout_seconds = 4;
  // Optional logical idempotency key. Empty derives wait-for-attribute:{encoded condition}.
  string request_id = 5;
}

message WaitForAttributeResponse {
  Value matched_value = 1;
}

message AttributeMatch {
  string key = 1;
  AttributeMatchOperator operator = 2;
  Value operand = 3;
}

enum AttributeMatchOperator {
  ATTRIBUTE_MATCH_OPERATOR_UNSPECIFIED = 0;
  ATTRIBUTE_MATCH_OPERATOR_EQUAL = 1;
  ATTRIBUTE_MATCH_OPERATOR_NOT_EQUAL = 2;
  ATTRIBUTE_MATCH_OPERATOR_GREATER_THAN = 3;
  ATTRIBUTE_MATCH_OPERATOR_GREATER_THAN_OR_EQUAL = 4;
  ATTRIBUTE_MATCH_OPERATOR_LESS_THAN = 5;
  ATTRIBUTE_MATCH_OPERATOR_LESS_THAN_OR_EQUAL = 6;
}

// Deprecated: TriggerContinueAsNew always returns UNIMPLEMENTED.
message TriggerContinueAsNewRequest {
  string flow_id = 1;
  string run_id = 2;
}

message HealthInfo {
  string condition = 1;
  string hostname = 2;
  int32 duration = 3;
}

message ServiceErrorResponse {
  string detail = 1;
  ErrorSubStatus sub_status = 2;
  string original_worker_error_detail = 3;
  string original_worker_error_type = 4;
  int32 original_worker_error_status = 5;
  string original_worker_error_stack_trace = 6;
  DispatchTaskErrorReason dispatch_task_error_reason = 7;
}

enum ErrorSubStatus {
  ERROR_SUB_STATUS_UNSPECIFIED = 0;
  ERROR_SUB_STATUS_UNCATEGORIZED = 1;
  ERROR_SUB_STATUS_FLOW_ALREADY_STARTED = 2;
  ERROR_SUB_STATUS_FLOW_NOT_EXISTS = 3;
  ERROR_SUB_STATUS_WORKER_API_ERROR = 4;
  ERROR_SUB_STATUS_LONG_POLL_TIME_OUT = 5;
  ERROR_SUB_STATUS_CHANNEL_MESSAGE_NOT_FOUND = 6;
  ERROR_SUB_STATUS_REQUEST_TIMEOUT = 7;
  // An update-class request arrived while Flow close cleanup is in progress.
  ERROR_SUB_STATUS_FLOW_CLOSING = 8;
}

message WorkerErrorResponse {
  string detail = 1;
  string error_type = 2;
  string stack_trace = 3;
  int32 retry_after_seconds = 4;
  // gRPC status code that the Worker derives from the handler error.
  int32 grpc_status = 5;
}

message ChannelInfo {
  int32 size = 1;
}

message InvokeWaitForMethodRequest {
  Context context = 1;
  string flow_type = 2;
  string step_type = 3;
  Value step_input = 4;
  repeated KV attributes = 5;
  map<string, ChannelInfo> channel_infos = 6;
  map<string, ChannelValues> loaded_channel_messages = 7;
  repeated string loaded_attribute_map_instances = 8;
  repeated string loaded_channel_names = 9;
  repeated string loaded_channel_map_instances = 10;
}

message InvokeWaitForMethodResponse {
  reserved 1;
  reserved "local_activity_metadata";
  repeated AttributeWrite upsert_attributes = 2;
  WaitingCondition waiting_condition = 3;
  repeated KV upsert_step_exe_locals = 4;
  repeated KV record_events = 5;
  repeated ChannelMessage publish_to_channel = 6;
  repeated ChannelMessageDeletion delete_from_channel = 7;
  ActionPermissionMappings action_permission_mappings = 8;
}

message StepMethodHeartbeat {
  Value value = 1;
}

message StepStreamWrite {
  string stream_name = 1;
  int64 stream_capacity_bytes = 2;
  Value value = 3;
}

message InvokeWaitForMethodOutput {
  oneof output {
    StepMethodHeartbeat heartbeat = 1;
    StepStreamWrite stream_write = 2;
    InvokeWaitForMethodResponse result = 3;
  }
}

message InvokeExecuteMethodRequest {
  Context context = 1;
  string flow_type = 2;
  string step_type = 3;
  Value step_input = 4;
  repeated KV attributes = 5;
  repeated KV step_exe_locals = 6;
  ConditionResults condition_results = 7;
  map<string, ChannelInfo> channel_infos = 8;
  map<string, ChannelValues> loaded_channel_messages = 9;
  repeated string loaded_attribute_map_instances = 10;
  repeated string loaded_channel_names = 11;
  repeated string loaded_channel_map_instances = 12;
}

message InvokeExecuteMethodResponse {
  reserved 1;
  reserved "local_activity_metadata";
  StepDecision step_decision = 2;
  repeated AttributeWrite upsert_attributes = 3;
  repeated KV record_events = 4;
  repeated KV upsert_step_exe_locals = 5;
  repeated ChannelMessage publish_to_channel = 6;
  repeated ChannelMessageDeletion delete_from_channel = 7;
  ActionPermissionMappings action_permission_mappings = 8;
}

message InvokeExecuteMethodOutput {
  oneof output {
    StepMethodHeartbeat heartbeat = 1;
    StepStreamWrite stream_write = 2;
    InvokeExecuteMethodResponse result = 3;
  }
}

message InvokeWorkerRPCRequest {
  Context context = 1;
  string flow_type = 2;
  string rpc_name = 3;
  Value input = 4;
  repeated KV attributes = 5;
  map<string, ChannelInfo> channel_infos = 6;
  map<string, ChannelValues> loaded_channel_messages = 7;
  repeated string loaded_attribute_map_instances = 8;
  repeated string loaded_channel_names = 9;
  repeated string loaded_channel_map_instances = 10;
}

message InvokeWorkerRPCResponse {
  Value output = 1;
  StepDecision step_decision = 2;
  repeated AttributeWrite upsert_attributes = 3;
  repeated KV record_events = 4;
  repeated ChannelMessageDeletion delete_from_channel = 5;
  repeated ChannelMessage publish_to_channel = 6;
  ActionPermissionMappings action_permission_mappings = 7;
}

message StepDecision {
  repeated StepMovement next_steps = 1;
  CloseDecision close_decision = 2;
  repeated string cancel_step_types = 3;
  repeated string cancel_sibling_step_types = 4;
}

enum CloseDecisionType {
  CLOSE_DECISION_TYPE_UNSPECIFIED = 0;
  CLOSE_DECISION_TYPE_FORCE_COMPLETE_ON_CHANNELS_EMPTY = 1;
  CLOSE_DECISION_TYPE_GRACEFUL_COMPLETE = 2;
  CLOSE_DECISION_TYPE_FORCE_COMPLETE = 3;
  CLOSE_DECISION_TYPE_FORCE_FAIL = 4;
  CLOSE_DECISION_TYPE_DEAD_END = 5;
}

message CloseDecision {
  CloseDecisionType close_decision_type = 1;
  repeated string conditional_channel_names = 2;
  Value close_input = 3;
}

message StepMovement {
  string step_type = 1;
  Value step_input = 2;
  StepOptions step_options = 3;
  // Server-owned scheduling source; workers must leave this empty.
  string from_step_execution_id_internal_only = 4;
  // Server-owned error passed only to an Execute failure recovery Step.
  RecoveryErrorInfo recovery_error_internal_only = 5;
}

enum WaitingConditionType {
  WAITING_CONDITION_TYPE_UNSPECIFIED = 0;
  WAITING_CONDITION_TYPE_ALL_COMPLETED = 1;
  WAITING_CONDITION_TYPE_ANY_COMPLETED = 2;
  WAITING_CONDITION_TYPE_ANY_COMBINATION_COMPLETED = 3;
}

message ConditionCombination {
  repeated string condition_ids = 1;
}

message WaitingCondition {
  WaitingConditionType waiting_condition_type = 1;
  repeated TimerCondition timer_conditions = 2;
  repeated ChannelCondition channel_conditions = 3;
  repeated ConditionCombination condition_combinations = 4;
  repeated SubFlowCondition sub_flow_conditions = 5;
}

message WaitingConditionState {
  WaitingConditionType waiting_condition_type = 1;
  repeated TimerCondition timer_conditions = 2;
  repeated ChannelCondition channel_conditions = 3;
  repeated ConditionCombination condition_combinations = 4;
  repeated SubFlowConditionState sub_flow_conditions = 5;
}

enum SubFlowReusePolicy {
  SUB_FLOW_REUSE_POLICY_UNSPECIFIED = 0;
  SUB_FLOW_REUSE_POLICY_ATTACH = 1;
  SUB_FLOW_REUSE_POLICY_RESTART_IF_PREVIOUS_EXITS_ABNORMALLY = 2;
  SUB_FLOW_REUSE_POLICY_ALWAYS_RESTART = 3;
}

message SubFlowOptions {
  SubFlowReusePolicy reuse_policy = 1;
  int32 flow_timeout_seconds = 2;
  // Dex rejects a positive start delay with INVALID_ARGUMENT.
  int32 flow_start_delay_seconds = 3;
  // Dex rejects a set policy with INVALID_ARGUMENT.
  FlowRetryPolicy retry_policy = 4;
  repeated AttributeWrite attributes = 5;
  FlowConfig flow_config_override = 6;
  FlowTimeoutPolicy flow_timeout_policy = 7;
  FlowTimeoutHandlerOptions timeout_handler_options = 8;
}

message SubFlowCondition {
  // Optional unless waiting_condition_type is ANY_COMBINATION_COMPLETED.
  string condition_id = 1;
  string sub_flow_type = 2;
  string start_step_type = 3;
  Value step_input = 4;
  StepOptions step_options = 5;
  SubFlowOptions options = 6;
  int32 sub_flow_index = 7;
}

message SubFlowConditionState {
  string condition_id = 1;
}

message TimerCondition {
  // Optional unless waiting_condition_type is ANY_COMBINATION_COMPLETED.
  string condition_id = 1;
  // Worker-relative delay; Dex converts it to firing_unix_timestamp_seconds.
  int64 duration_seconds = 2;
  // Deadline that Dex computes from duration_seconds; workers leave this zero.
  int64 firing_unix_timestamp_seconds = 3;
}

message ChannelCondition {
  // Optional unless waiting_condition_type is ANY_COMBINATION_COMPLETED.
  string condition_id = 1;
  string channel_name = 2;
  // Both omitted means exact one. Omitted at_least means zero; omitted at_most means unbounded.
  optional int32 at_least = 3;
  optional int32 at_most = 4;
}

message ConditionResults {
  repeated ChannelResult channel_results = 1;
  repeated TimerResult timer_results = 2;
  bool wait_for_failed = 3;
  repeated FlowResult sub_flow_results = 4;
}

enum ConditionStatus {
  CONDITION_STATUS_UNSPECIFIED = 0;
  CONDITION_STATUS_WAITING = 1;
  CONDITION_STATUS_COMPLETED = 2;
}

message TimerResult {
  string condition_id = 1;
  ConditionStatus condition_status = 2;
}

message ChannelResult {
  string condition_id = 1;
  ConditionStatus condition_status = 2;
  string channel_name = 3;
  repeated Value values = 4;
}

message ChannelValues {
  repeated ChannelMessage messages = 1;
}

message StepExecutionCompletedConditions {
  map<int32, InternalTimerStatus> completed_timer_conditions = 1;
  map<int32, FlowResult> completed_sub_flow_results = 2;
}

message StepExecutionResumeInfo {
  string step_execution_id = 1;
  StepMovement step = 2;
  StepExecutionCompletedConditions completed_conditions = 3;
  WaitingConditionState waiting_condition = 4;
  repeated KV step_exe_locals = 5;
  PullRouting wait_for_pull_routing = 6;
}

enum InternalTimerStatus {
  INTERNAL_TIMER_STATUS_UNSPECIFIED = 0;
  INTERNAL_TIMER_STATUS_PENDING = 1;
  INTERNAL_TIMER_STATUS_FIRED = 2;
  INTERNAL_TIMER_STATUS_SKIPPED = 3;
}

message RecoveryErrorInfo {
  string detail = 1;
  string error_type = 2;
}

message AttributeSyncItem {
  string config_name = 1;
  string key = 2;
  Value value = 3;
}

message TimerInfo {
  // Empty when the timer has no condition id.
  string condition_id = 1;
  int64 firing_unix_timestamp_seconds = 2;
  InternalTimerStatus status = 3;
}
